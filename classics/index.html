<style>
:root{
  color-scheme:dark;
  --bg:#0f0d0b;--panel:#1a1612;--panel2:#231d17;--line:#3a3127;--ink:#f1ebe0;--muted:#a99f92;
  --accent:#e9b44c;--good:#4fd18b;--bad:#ff6b5e;--lcd:#ffb23e;--lcdbg:#0a0906;
  --display:'Cinzel','Trajan Pro',Georgia,'Times New Roman',serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Share Tech Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font:16px/1.5 var(--body);padding-inline:16px;padding-block:0 40px}
.wrap{max-width:1120px;margin:0 auto}
button{font:inherit}
.btn{font-size:14px;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 13px;cursor:pointer;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.clue:focus-visible,.rc:focus-visible,input:focus-visible,.key:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:#15110a;border-color:transparent;font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.warn{border-color:#6a3b35;color:#ffb3aa}
.muted{color:var(--muted)}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding-block:12px;background:linear-gradient(var(--bg) 75%,rgba(15,13,11,0))}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.04em;color:var(--accent);line-height:1}
.roomtag{color:var(--muted);font-size:14px}
.roomtag b{color:var(--ink);font-weight:700}
.bar .right{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.timer{font-family:var(--mono);font-size:22px;color:var(--lcd);background:var(--lcdbg);border:1px solid #3a2f18;border-radius:6px;padding:1px 10px;letter-spacing:.08em;font-variant-numeric:tabular-nums;text-shadow:0 0 8px rgba(255,178,62,.45);min-width:5.2ch;text-align:center}
.timer.over{color:var(--bad);border-color:#5a2520;text-shadow:0 0 8px rgba(255,107,94,.5)}
.pill{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums}
.pill b{color:var(--lcd);font-family:var(--mono);font-size:15px}

/* title */
.hero{padding-block:24px 4px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(40px,7.4vw,92px);line-height:.98;margin:0;letter-spacing:.01em;text-wrap:balance}
.hero h1 span{color:var(--accent)}
.lede{max-width:60ch;color:#cfd2d8;font-size:18px;margin:14px 0 0}
.codeplate{font-family:var(--mono);background:var(--lcdbg);border:2px solid #3a2f18;border-radius:10px;padding:10px 14px;display:flex;gap:8px}
.codeplate span{display:grid;place-items:center;width:40px;height:54px;background:#16110a;border-radius:4px;color:var(--lcd);font-size:34px;text-shadow:0 0 10px rgba(255,178,62,.55)}
.codeplate span.dim{color:#4a3a1c;text-shadow:none}
@media (max-width:700px){.hero{grid-template-columns:1fr}.codeplate span{width:34px;height:46px;font-size:28px}}
.sectlabel{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:28px 0 10px}
.map{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.rc{--c:var(--accent);text-align:left;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:10px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-content:start}
.rc.pick{cursor:pointer}
.rc.pick:hover{background:var(--panel2)}
.rc .lvl{font-family:var(--display);font-weight:700;font-size:28px;line-height:1;color:var(--c)}
.rc .nm{grid-column:1/-1;font-weight:700;font-size:17px}
.rc .band{grid-column:1/-1;font-size:13px;color:var(--muted)}
.rc ul{grid-column:1/-1;margin:4px 0 0;padding-left:16px;font-size:13px;color:#c9ccd3}
.rc .md{width:40px;height:54px}
.rc .go{grid-column:1/-1;font-size:13px;color:var(--c);font-weight:700}
@media (max-width:980px){.map{grid-template-columns:1fr}.rc{grid-template-columns:auto 1fr auto}.rc .lvl{grid-row:1/3}.rc .nm,.rc .band{grid-column:2/3}.rc .md{grid-column:3;grid-row:1/3}}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.how div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.how b{display:block;font-family:var(--display);font-weight:700;font-size:20px;color:var(--accent);margin-bottom:2px}
.how p{margin:0;color:#c9ccd3;font-size:15px}
@media (max-width:760px){.how{grid-template-columns:1fr}}
.startrow{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:22px}
.startrow .btn.primary{font-size:17px;padding:12px 22px}
.chk{display:flex;gap:8px;align-items:center;color:#c9ccd3;font-size:15px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}

/* intro / done / end */
.splash{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:28px;align-items:center;padding-block:20px}
@media (max-width:860px){.splash{grid-template-columns:1fr}}
.splash .kicker{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.splash h2{font-family:var(--display);font-weight:700;font-size:clamp(34px,5vw,60px);line-height:1.02;margin:6px 0 12px;text-wrap:balance}
.splash p{color:#cfd2d8;max-width:52ch;margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{font-size:12.5px;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:3px 10px;color:#d6d8dd}
.preview{border-radius:12px;overflow:hidden;border:1px solid var(--line);pointer-events:none;position:relative}
.preview svg{display:block;width:100%;height:auto}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0 20px}
.statgrid div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.statgrid small{display:block;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.statgrid b{font-family:var(--mono);font-size:26px;color:var(--lcd);font-weight:400;font-variant-numeric:tabular-nums}
.statgrid span{font-size:13px;color:var(--muted)}
@media (max-width:640px){.statgrid{grid-template-columns:repeat(2,1fr)}}
.endtable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
.endtable th,.endtable td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
.endtable th{color:var(--muted);font-weight:400;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
.endtable td.n{font-family:var(--mono);color:var(--lcd)}
.tw{overflow-x:auto}

/* room */
.stage{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#000}
#scene svg{display:block;width:100%;height:auto;user-select:none}
.cover{position:absolute;inset:0;background:rgba(10,8,6,.92);display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:700;font-size:40px;color:var(--accent)}
.cover small{display:block;font-family:var(--body);font-size:15px;color:var(--muted)}
.cluebar{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
@media (max-width:980px){.cluebar{grid-template-columns:repeat(2,1fr)}}
.clue{text-align:left;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.clue:hover{border-color:var(--accent)}
.clue .cn{font-weight:700;font-size:15px}
.clue .ct{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.clue .cs{font-size:13px;margin-top:4px;color:var(--muted)}
.clue.done{border-color:#2d5a41}
.clue.done .cs{color:var(--good)}
.clue .cs b{font-family:var(--mono);color:var(--lcd);font-size:16px;font-weight:400}
.clue.doorb{background:#17130b;border-color:#3a2f18}
.clue.doorb .cn{color:var(--lcd)}
.clue.doorb.ready{border-color:var(--lcd);box-shadow:0 0 0 1px var(--lcd) inset}
.tip{font-size:13.5px;color:var(--muted);margin:10px 0 0}

/* scene svg */
#scene .hot{cursor:pointer;transition:filter .2s}
#scene .hot:hover,#scene .hot:focus-visible{filter:drop-shadow(0 0 9px var(--accent)) brightness(1.12);outline:none}

.beacon .ring{fill:none;stroke:var(--accent);stroke-width:2.5;transform-box:fill-box;transform-origin:center;animation:ping 1.8s ease-out infinite}

.slot{fill:#16110a}
.lcd{fill:var(--lcd);font:26px var(--mono);text-anchor:middle;dominant-baseline:central}
.lcd.dim{fill:#4a3a1c}
.door .leaf{transform-box:fill-box;transform-origin:left center;transition:transform 1.4s cubic-bezier(.6,0,.2,1)}
.door.open .leaf{transform:scaleX(.1)}
.swing{transform-box:view-box;transform-origin:330px 262px;animation:swing 1.6s ease-in-out infinite alternate}
.flick{transform-box:fill-box;transform-origin:center bottom;animation:flick .18s ease-in-out infinite alternate}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.spinr{transform-box:fill-box;transform-origin:center;animation:spin 7s linear infinite reverse}
.blink{animation:blink 1.4s steps(2) infinite}
.bub{animation:rise 2.4s ease-in infinite}
.beam{animation:beam 1.8s ease-in-out infinite alternate}
@keyframes ping{from{transform:scale(.8);opacity:1}to{transform:scale(1.9);opacity:0}}
@keyframes swing{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes flick{from{transform:scaleY(.9) skewX(-3deg)}to{transform:scaleY(1.08) skewX(3deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:.25}}
@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-34px);opacity:0}}
@keyframes beam{from{opacity:.55}to{opacity:1}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

<script>/* js/core/util.js */
/* Shared helpers used by the engine, the room scenes and the question banks. */
window.ER=window.ER||{};
(()=>{
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* answer tolerances. Choice answers are option indexes and years are whole numbers, so 'exact' is all a
   question bank needs; the others are kept for any course that asks for typed numerical answers. */
const TOL={exact:()=>1e-6,
  '3sf':v=>v===0?1e-9:0.5*Math.pow(10,Math.floor(Math.log10(Math.abs(v)))-2)*1.0001+1e-9,
  '2dp':()=>0.005+1e-9,'1dp':()=>0.05+1e-9};

ER.util={ri,pick,shuffle,rad,deg,esc,TOL};
})();

</script>
<script>/* js/core/scenes.js */
/* Room themes: the museum galleries. Every game uses five of the registered galleries in a random order.
   Each gallery has five clickable exhibits; question i of a room sits behind objects[i].
   To add a gallery, create js/rooms/<name>.js calling ER.scenes.add({name,accent,objects,blurb,scene}),
   where scene(k) returns SVG markup for a 1000×560 canvas using the kit k:
   k.hot(i,innerSvg,beaconX,beaconY) for i = 0..4, k.door(leafColour,decoSvg), k.COMMON in <defs>, k.finish last,
   and the museum pieces k.hall, k.plinth, k.column, k.spot, k.plaque, k.meander.
   Keep exhibits between x 30 and 790: the door and keypad fill x 806–976. */
window.ER=window.ER||{};
(()=>{
const rad=d=>d*Math.PI/180;
const f1=v=>(+v).toFixed(1);
const pth=ps=>'M'+ps.map(p=>f1(p[0])+' '+f1(p[1])).join(' L');
let cur=null; // {solved,code,slots,objects,doorOpen} for the room being drawn
const room=()=>cur;
let seed=1;const srand=s=>{seed=s};const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};
const COMMON=`<linearGradient id="doorLight" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fffbe8"/><stop offset="1" stop-color="#ffd27a"/></linearGradient><radialGradient id="vig" cx=".5" cy=".5" r=".78"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".62"/></radialGradient>
<linearGradient id="marble" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1ece2"/><stop offset=".5" stop-color="#d9d2c4"/><stop offset="1" stop-color="#bfb6a6"/></linearGradient>
<linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9a45a"/><stop offset=".55" stop-color="#9a6a2c"/><stop offset="1" stop-color="#5e3f17"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a3"/><stop offset="1" stop-color="#c08f2a"/></linearGradient>
<linearGradient id="terra" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a9502a"/><stop offset=".45" stop-color="#d9773f"/><stop offset="1" stop-color="#8a3a1c"/></linearGradient>
<linearGradient id="glaze" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0d0a08"/><stop offset=".45" stop-color="#2a2420"/><stop offset="1" stop-color="#0a0807"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3d1" stop-opacity=".22"/><stop offset="1" stop-color="#fff3d1" stop-opacity="0"/></linearGradient>`;
function hot(i,inner,bx,by){const r=room(),solved=r.solved[i],lbl=r.objects[i];
  const badge=solved?`<g class="badge" transform="translate(${bx} ${by})"><rect x="-19" y="-19" width="38" height="38" rx="6"/><text class="bd">${r.code[r.slots[i]]}</text><text class="bs" y="-27">SLOT ${r.slots[i]+1}</text></g>`
   :`<g class="beacon" transform="translate(${bx} ${by})"><circle class="ring" r="15"/><circle class="core" r="12"/><text>?</text></g>`;
  return `<g class="hot" data-i="${i}" tabindex="0" role="button" aria-label="${lbl}${solved?', solved':', unanswered question'}">${inner}${badge}</g>`}
function door(leaf,deco){const r=room();
  const lcd=[0,1,2,3,4].map(s=>{const qi=r.slots.indexOf(s),k=r.solved[qi];return `<rect x="${814+s*31}" y="119" width="27" height="36" rx="3" class="slot"/><text x="${827.5+s*31}" y="137.5" class="lcd${k?'':' dim'}">${k?r.code[s]:'–'}</text>`}).join('');
  return `<g id="door" class="door${r.doorOpen?' open':''}" tabindex="0" role="button" aria-label="Exit door keypad"><rect x="806" y="111" width="170" height="52" rx="6" class="lcdbox"/>${lcd}
  <path d="M800 182 L890 166 L980 182 Z" fill="url(#marble)" stroke="rgba(0,0,0,.35)"/><rect x="800" y="182" width="180" height="10" fill="url(#marble)"/>
  <rect x="806" y="192" width="168" height="252" fill="#0b0a09"/><rect x="820" y="198" width="140" height="242" fill="url(#doorLight)"/>
  <g class="leaf"><rect x="820" y="198" width="140" height="242" fill="${leaf}" stroke="rgba(0,0,0,.55)" stroke-width="2"/>${deco}<circle cx="943" cy="326" r="7" fill="#d8b25c" stroke="#5a4418" stroke-width="2"/></g></g>`}
const finish=`<rect width="1000" height="560" fill="url(#vig)" pointer-events="none"/>`;

/* ---- museum pieces ---- */
/* Greek key (meander) band from x0 to x1 at height y, h tall */
function meander(y,col,h=16,x0=0,x1=1000){const u=h/4;let d='';for(let x=x0;x<x1;x+=h){d+=`M${x} ${y+h} v${-h} h${3*u} v${2*u} h${-u} v${-u} h${-u} v${2*u} h${3*u} v${-3*u} h${u}`}
  return `<rect x="${x0}" y="${y-3}" width="${x1-x0}" height="${h+6}" fill="#000" opacity=".25"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2" opacity=".75"/>`}
/* the gallery shell: wall, dado, frieze, floor and ceiling lights */
function hall({id,wall,wall2,floor,floor2,trim}){
  let tiles='';for(let r=0;r<4;r++){const y=440+r*30,h=30;for(let c=-1;c<12;c++){const x=c*92+(r%2?46:0);tiles+=`<rect x="${x}" y="${y}" width="92" height="${h}" fill="${(r+c)%2?floor:floor2}" stroke="#000" stroke-opacity=".25"/>`}}

function plinth(cx,top,w,h=440-top){return `<rect x="${cx-w/2-6}" y="${top}" width="${w+12}" height="9" fill="url(#marble)" stroke="#7d7466" stroke-width="1.5"/><rect x="${cx-w/2}" y="${top+9}" width="${w}" height="${h-17}" fill="url(#marble)" stroke="#7d7466" stroke-width="1.5"/><rect x="${cx-w/2-8}" y="${top+h-8}" width="${w+16}" height="8" fill="url(#marble)" stroke="#7d7466" stroke-width="1.5"/>`}

function add(t){for(const k of ['name','accent','objects','blurb','scene'])if(!t[k])throw new Error('Room theme missing '+k);

ER.scenes={THEMES,svg,add,kit};
})();

</script>

<script>/* js/core/registry.js */
/* Course registry.

   A COURSE is something a student picks from the home menu (e.g. IGCSE Mathematics 0580).
   It has one or more COMPONENTS (papers/units, e.g. Pure 1 and Statistics 1). Each
   component lists its syllabus TOPICS. GENERATORS are added per component and each belongs
   to one topic and one level (1-5); the engine fills the five rooms by level from them.

   ER.registerCourse({
     id, subject, name, code, board,
     brand,            // top-bar wordmark once the course is chosen
     hero,             // h1 HTML on the course page
     lede, tip,        // course page copy
     codeplate,        // five characters shown on the course page code plate ('-' = dim)
     timeLimit,        // seconds, default 2700 (45 min)
     levels,           // [{band,mins}] x5: room labels and suggested minutes
     components:[{id,name,short,paper,topics:[{id,name}],levels?}]   // component levels override the course's when it is played alone
   })

   ER.addGenerators(courseId, componentId, {
     genId:{topic:'topicId', title:'Subtopic name', level:1-5, fn(level){ return question }}
   })

   A question object: {html, diagram?, fields:[{label,pre?,post?,ans,acc}], unordered?,
     hint, sol, mistakes:[{val,field?}|{vals}, msg], answer}
*/
window.ER=window.ER||{};
(()=>{
const courses=[],byId={};
function registerCourse(def){
  if(byId[def.id])throw new Error('Course registered twice: '+def.id);
  def.timeLimit=def.timeLimit||2700;
  def.components.forEach(c=>{c.gens=c.gens||{};c.course=def.id;c.topicById=Object.fromEntries(c.topics.map(t=>[t.id,t]))});
  courses.push(def);byId[def.id]=def;return def}
function component(courseId,compId){const c=byId[courseId];if(!c)throw new Error('Unknown course '+courseId);
  const k=c.components.find(x=>x.id===compId);if(!k)throw new Error(`Unknown component ${compId} in ${courseId}`);return k}
function addGenerators(courseId,compId,gens){const k=component(courseId,compId);
  for(const [id,g] of Object.entries(gens)){
    if(k.gens[id])throw new Error(`Generator ${courseId}/${compId}/${id} defined twice`);
    if(!k.topicById[g.topic])throw new Error(`Generator ${id}: unknown topic "${g.topic}" in ${courseId}/${compId}`);
    g.id=id;g.course=courseId;g.component=compId;g.label=k.topicById[g.topic].name+' · '+g.title;k.gens[id]=g}}
/* sanity-check the registered content */
function validate(){const problems=[];
  for(const c of courses)for(const k of c.components){const gs=Object.values(k.gens);
    if(!gs.length)problems.push(`${c.id}/${k.id}: no generators`);
    gs.forEach(g=>{const [lo,hi]=Array.isArray(g.level)?g.level:[g.level,g.level];if(!(lo>=1&&hi<=5&&lo<=hi))problems.push(`${c.id}/${k.id}/${g.id}: level must be 1-5`)})}
  return problems}
ER.courses=courses;ER.courseById=byId;ER.registerCourse=registerCourse;ER.addGenerators=addGenerators;ER.component=component;ER.validate=validate;
})();

</script>
<script>/* js/core/quiz.js */
/* Question banks: turns written questions into generators the engine can use.

   ER.bank(componentId, { subtopicId: [question, …], … })
   registers every question with every course that has that component (an AS topic
   appears in both the AS and the A Level course). Each question becomes one generator
   at its level, and the options are shuffled every time it is asked.

   Question kinds (all take lv:1-5, q:'stem HTML', hint, exp:'explanation HTML'):
     multiple choice  {lv,q,a:'right answer',w:['wrong',['wrong','feedback if picked'],…]}
     match            {lv,q,kind:'match',pairs:[['left','right'],…]}      each left gets a list of the rights
     order            {lv,q,kind:'order',items:['first','second',…]}      put the items in order
     year             {lv,q,kind:'year',year:336,era:'BCE'}               typed as a number
   Optional: src:'a source extract (paraphrased)' shown under the stem, cite:'where it is from'. */
window.ER=window.ER||{};
(()=>{
const {shuffle,esc}=ER.util;
const ORD=['1st','2nd','3rd','4th','5th','6th'];
const srcHTML=x=>x.src?`<blockquote class="src">${x.src}${x.cite?`<cite>${x.cite}</cite>`:''}</blockquote>`:'';
const stem=x=>`<p>${x.q}</p>${srcHTML(x)}`;

function mc(x){const opts=shuffle([{t:x.a,ok:1},...x.w.map(w=>Array.isArray(w)?{t:w[0],msg:w[1]}:{t:w})]);
  return{html:stem(x),fields:[{label:'Choose one answer',radio:true,choices:opts.map(o=>o.t),ans:opts.findIndex(o=>o.ok),acc:'exact'}],
    mistakes:opts.map((o,j)=>o.msg?{val:j,msg:o.msg}:null).filter(Boolean),
    hint:x.hint,sol:x.exp,answer:x.a}}
function match(x){const rights=shuffle(x.pairs.map(p=>p[1]));
  return{html:stem(x),fields:shuffle(x.pairs).map(([l,r])=>({label:l,choices:rights,ans:rights.indexOf(r),acc:'exact'})),
    hint:x.hint,sol:x.exp,answer:x.pairs.map(([l,r])=>`${l} → ${r}`).join('; '),wide:true}}
function order(x){const n=x.items.length;
  return{html:stem(x),fields:shuffle(x.items.map((t,i)=>({t,i}))).map(o=>({label:o.t,choices:ORD.slice(0,n),ans:o.i,acc:'exact'})),
    hint:x.hint,sol:x.exp,answer:x.items.map((t,i)=>`${i+1}. ${t}`).join('; '),wide:true}}
function year(x){return{html:stem(x),fields:[{label:'Year',post:x.era||'',ans:x.year,acc:'exact'}],
    note:`Type the year as a number${x.era?`, without ${x.era}`:''}.`,
    hint:x.hint,sol:x.exp,answer:`${x.year}${x.era?' '+x.era:''}`}}
const KINDS={mc,match,order,year};

/* registers the same bank with every course that offers this component */
function bank(compId,subs){
  const homes=ER.courses.filter(c=>c.components.some(k=>k.id===compId));
  if(!homes.length)throw new Error('No course has component '+compId);
  for(const [sub,list] of Object.entries(subs)){
    /* a topic file may call ER.bank more than once; numbering carries on from earlier sets */
    const base=Object.values(homes[0].components.find(k=>k.id===compId).gens).filter(g=>g.topic===sub).length;
    list.forEach((x,i)=>{const kind=x.kind||'mc';if(!KINDS[kind])throw new Error(`${compId}/${sub}#${base+i+1}: unknown kind ${kind}`);
      for(const c of homes){const k=c.components.find(k=>k.id===compId),id=`${sub}-${base+i+1}`;
        ER.addGenerators(c.id,compId,{[id]:{topic:sub,title:k.topicById[sub]?k.topicById[sub].name:sub,level:x.lv,item:x,fixed:true,fn(){return KINDS[kind](x)}}});
        k.gens[id].label=`${k.short} · ${k.gens[id].title}`}})}}
ER.bank=bank;ER.quiz={mc,match,order,year,esc};
})();

</script>

    exp:'<p>Alexander noticed that Bucephalus was <b>afraid of his own shadow</b>. He turned the horse towards the sun and then mounted. The story shows his observation, confidence and ambition, and Plutarch uses it to reveal his character.</p>'},
  {lv:4,q:'Read the source. What does it suggest about Philip’s view of his son?',
    src:'After Alexander tamed the horse, Philip wept for joy and kissed him, telling him to look for a kingdom equal to himself, because Macedonia was too small for him.',cite:'Plutarch, <em>Life of Alexander</em> 6 (paraphrased)',
    a:'Philip recognised that Alexander’s ambition and ability were too great for Macedonia to contain',
    w:[['Philip feared Alexander’s ambition and wanted him sent out of Macedonia before he grew dangerous','Philip is praising Alexander, not sending him away.'],'Philip saw the taming as a sign from the gods that Alexander, not Philip, should lead the war on Persia','Philip thought Alexander was better suited to managing horses than to ruling a kingdom'],
    hint:'Look at the phrase “a kingdom equal to himself”.',
    exp:'<p>The anecdote presents Philip recognising that Alexander’s <b>ambition and ability</b> were too great for Macedonia. Remember that Plutarch wrote about 400 years later and chose stories that foreshadow Alexander’s future greatness. Treat it as character-building rather than reliable fact.</p>'},
],
campaigns:[
  {lv:1,q:'Which god’s oracle did Alexander visit at the oasis of Siwah in the Egyptian desert?',a:'Zeus Ammon',
    w:[['Apollo at Delphi','Alexander did visit Delphi before the campaign, but Siwah is in Egypt.'],'Zeus at Dodona','Poseidon at the Isthmus'],
    hint:'The god was a mixture of the Greek king of the gods and the Egyptian god Amun.',
    exp:'<p>In 331 BCE Alexander visited the oracle of <b>Zeus Ammon</b> at Siwah. Plutarch says the priest greeted him as “son of Zeus” (or of Ammon). The visit is central to questions about Alexander’s belief in his own divinity.</p>'},
  {lv:3,kind:'order',q:'Put these events of Alexander’s campaign in order, earliest first.',
    items:['Battle of the Granicus','Visit to the oracle at Siwah','Battle of Gaugamela','Battle of the Hydaspes','March through the Gedrosian desert'],
    hint:'He crossed into Asia first and finished in the far south-east. Egypt came before the decisive battle against Darius in Mesopotamia.',
    exp:'<p>Granicus (334 BCE) → Siwah (early 331) → Gaugamela (autumn 331) → Hydaspes (326) → Gedrosian desert (325). Siwah came after the sieges of Tyre and Gaza in 332, and before Alexander marched east to face Darius again.</p>'},
  {lv:3,q:'Why did Alexander turn back at the Hyphasis (Beas) river in India in 326 BCE?',
    a:'His exhausted Macedonian soldiers refused to march further east, and Coenus spoke for them',
    w:[['He had been badly defeated by Porus and had lost most of his cavalry in the monsoon floods','Alexander defeated Porus at the Hydaspes and restored his kingdom.'],'News arrived that Antipater had rebelled in Macedonia, so he hurried home to deal with it',['The oracle of Ammon warned him that he would die if he crossed the river','The sacrifices only turned unfavourable after the army had refused.']],
    hint:'The problem came from inside his own army.',
    exp:'<p>At the Hyphasis the army, worn out after years of campaigning and the monsoon rains, <b>refused to go on</b>. Coenus spoke for the men. Alexander sulked in his tent for three days, but the sacrifices were then declared unfavourable and he turned back. It was the first time his men had stopped him.</p>'},
  {lv:4,q:'Read the source. Which motive for Alexander’s choice of route does it suggest?',
    src:'Nearchus says that Alexander chose the desert route because he had heard that no one had ever brought an army safely through it. Semiramis had escaped with only twenty men, and Cyrus with only seven. Alexander wanted to do better than them.',cite:'Arrian, <em>Campaigns of Alexander</em> 6.24 (paraphrased, wider reading)',
    a:'A desire to outdo famous rulers of the past, typical of his competitive ambition',
    w:['A practical wish to find the quickest route back to Babylon, whatever the risk to the army',['A plan to punish the army for its refusal to march any further east at the Hyphasis','Some modern historians suggest this, but it is not what this source says.'],'Obedience to an oracle that said only a son of Zeus could bring an army through the desert'],
    hint:'Who are Semiramis and Cyrus, and what did Alexander want to do compared with them?',
    exp:'<p>The source presents Alexander’s urge to <b>outdo legendary figures</b>, Semiramis and Cyrus, a theme that links to his rivalry with Heracles, Dionysus and Achilles. The march was a disaster, and many died. Modern historians debate whether it was ambition, poor planning, or punishment after the Hyphasis.</p>'},
],
military:[
  {lv:2,kind:'match',q:'Match each battle to its date.',
    pairs:[['Granicus','334 BCE'],['Issus','333 BCE'],['Gaugamela','331 BCE'],['Hydaspes','326 BCE']],
    hint:'They are in this order: Granicus, Issus, Gaugamela, Hydaspes.',
    exp:'<p><b>Granicus 334</b> (first victory in Asia, against the Persian satraps), <b>Issus 333</b> (first defeat of Darius), <b>Gaugamela 331</b> (decisive defeat of Darius), <b>Hydaspes 326</b> (against Porus in India).</p>'},
  {lv:2,q:'Which Indian king did Alexander defeat at the Hydaspes, and then allow to keep his kingdom?',a:'Porus',
    w:[['Taxiles','Taxiles was an Indian ruler who allied himself with Alexander before the battle.'],'Bessus','Darius III'],
    hint:'Plutarch says this king asked to be treated “like a king”.',
    exp:'<p><b>Porus</b> fought bravely at the Hydaspes (326 BCE), using war elephants. When captured, he asked to be treated like a king. Alexander admired him and gave back his kingdom, and later more land. It is a key example of Alexander’s respect for brave enemies.</p>'},
  {lv:3,q:'How did Alexander finally capture the island city of Tyre in 332 BCE?',
    a:'He built a causeway to the island and attacked the walls with engines',
    w:['He blockaded the island for a year until the starving Tyrians opened the gates and surrendered',['His engineers dug a tunnel under the sea and his men climbed up inside the city walls','There was no tunnel. Think about how he joined the island to the mainland.'],'Persian nobles inside the city betrayed it to him after he promised to spare their families'],
    hint:'Tyre stood on an island about half a mile offshore.',
    exp:'<p>Tyre refused to let Alexander sacrifice to Heracles (Melqart) in the city. Alexander spent about <b>seven months</b> building a mole from the mainland, using siege towers and a fleet. When the city fell, he treated it harshly: thousands were killed and about 30,000 people were sold into slavery.</p>'},
  {lv:3,q:'At Issus and Gaugamela, what was Alexander’s key tactical aim?',
    a:'To lead the Companion cavalry in a charge straight at Darius, to break the Persian command',
    w:['To hold back his cavalry and let the phalanx grind down the Persian centre before charging','To surround the Persian army with his light troops and force it to surrender without fighting',['To capture the Persian baggage train first, so that Darius’ army would lose its supplies','The decisive move was aimed at Darius himself.']],
    hint:'Think about where Alexander himself fought, and who he went looking for.',
    exp:'<p>At both battles Alexander led the <b>Companion cavalry</b> into a gap in the Persian line and drove at <b>Darius</b>, who fled each time. The phalanx held the centre, and Parmenio held the left under heavy pressure. It shows the importance of his personal leadership, and of the support of his generals.</p>'},
  {lv:5,q:'“Alexander’s military success was mainly due to the army he inherited from Philip.” Which evidence best supports this view?',
    a:'Philip had created the sarissa phalanx, the Companion cavalry and generals like Parmenio',
    w:[['Alexander charged in person at the Granicus and was nearly killed, inspiring the men to follow','This shows Alexander’s own leadership, so it supports the opposite view.'],['Alexander spent seven months building a mole to Tyre, a siege that others thought impossible','This shows Alexander’s own determination, not Philip’s army.'],'Alexander cut the Gordian knot, convincing his whole army that he was destined to rule Asia'],
    hint:'The view is about what Philip left behind, not what Alexander did himself.',
    exp:'<p>Philip’s reforms gave Alexander a professional army: the <b>sarissa phalanx</b>, the <b>Companion cavalry</b> and senior commanders such as <b>Parmenio</b>. A strong essay balances this against Alexander’s own tactical skill, speed and personal courage, then reaches a judgement.</p>'},
],
rule:[
  {lv:2,q:'Who did Alexander leave as regent of Macedonia while he campaigned in Asia?',a:'Antipater',
    w:[['Parmenio','Parmenio was Alexander’s senior general in Asia.'],'Cleitus','Hephaestion'],
    hint:'He had been one of Philip’s most trusted officers, and he dealt with Greek revolts while Alexander was away.',
    exp:'<p><b>Antipater</b> governed Macedonia and supervised Greece through the <b>League of Corinth</b>. He crushed the Spartan revolt of Agis III in 331 BCE. Olympias quarrelled with him constantly.</p>'},
  {lv:3,q:'Why did Alexander’s attempt to introduce proskynesis cause opposition?',
    a:'To Greeks, bowing to a man was worship fit only for gods, so it treated Alexander as divine',
    w:['It forced Macedonians to pay a yearly tribute to the Persian treasury, as conquered peoples did','It meant the Companions had to hand over their weapons whenever they came near the king',['It required every Macedonian officer to marry a Persian noblewoman chosen by the king','That was the Susa weddings of 324 BCE.']],
    hint:'Proskynesis was the Persian custom of bowing low before the king.',
    exp:'<p>Persians performed <b>proskynesis</b> (bowing or prostration) to their king as a social custom. To Greeks it was an act of worship. <b>Callisthenes</b> openly refused (327 BCE), and Alexander dropped the attempt. It is key evidence for tension over his move towards Persian-style kingship.</p>'},
  {lv:3,q:'What was the main purpose of the mass weddings at Susa in 324 BCE?',
    a:'To bind the Macedonian and Persian ruling classes together as part of his policy of fusion',
    w:['To reward the veterans with rich dowries before they were discharged and sent home to Macedonia','To make peace with the Indian kings by marrying their daughters to his senior commanders',['To give Hephaestion a royal wife, so that he could become the official heir to the empire','About 80 Companions married, not only Hephaestion.']],
    hint:'Alexander married a daughter of Darius, and about 80 of his Companions married Persian noblewomen.',
    exp:'<p>At Susa, Alexander (marrying Stateira, daughter of Darius) and about 80 Companions took <b>Persian noble brides</b>. He also recognised around 10,000 soldiers’ marriages to Asian women. The aim was to create a mixed ruling class loyal to him. Most Companions rejected their wives after his death, which suggests the policy had little support.</p>'},
  {lv:4,q:'Read the source. What does it reveal about the Macedonians’ attitude in 324 BCE?',
    src:'At Opis the Macedonians were angry that Alexander now wore Persian dress, that young Persians had been trained in Macedonian fighting, and that Persians had been enrolled in the Companion cavalry. They shouted that he should send them all home and campaign with his “father” Ammon.',cite:'Arrian, <em>Campaigns of Alexander</em> 7.8 (paraphrased)',
    a:'They resented his Persian policies and mocked his claim to be the son of a god',
    w:['They feared another war with the Persians and wanted to go home to their families',['They were angry that they had not been paid for the long Indian campaign','Pay is not mentioned. Look at the specific complaints in the source.'],'They wanted to settle in Persia permanently with the wives they had married at Susa'],
    hint:'There are two kinds of complaint: about Persians, and about Ammon.',
    exp:'<p>The complaints target the <b>policy of fusion</b> (Persian dress, the Persian “Successors”, Persians in the Companions). The jibe about <b>Ammon</b> mocks his divine claims. Alexander answered with a famous speech, then won the men back, and a reconciliation banquet followed.</p>'},
  {lv:5,q:'Which is the strongest argument that Alexander adopted Persian customs for practical reasons rather than vanity?',
    a:'With few Macedonians to rule a vast empire, he needed Persian nobles as satraps and officials',
    w:[['He wore Persian dress mainly at court, but kept to Macedonian dress when he was with the army','This describes what he did, not why he did it.'],['Callisthenes refused to perform proskynesis and was later arrested and died in custody','This shows opposition to the policy, not Alexander’s motive.'],'He claimed descent from Heracles and Achilles, so he wished to rule like a hero of myth'],
    hint:'Think about how many Macedonians there were compared with the size of the empire.',
    exp:'<p>The practical argument is that a small Macedonian elite could not govern Persia alone. Alexander kept the <b>Persian administrative system</b> and used Persian nobles as satraps. Against this, the evidence of proskynesis and his divine claims suggests personal ambition too. Good answers weigh both sides.</p>'},
],
relations:[
  {lv:1,q:'Who was Alexander’s closest friend, whose death at Ecbatana in 324 BCE left him overwhelmed with grief?',a:'Hephaestion',
    w:['Cleitus','Ptolemy','Parmenio'],
    hint:'Alexander compared this friendship to that of Achilles and Patroclus.',
    exp:'<p><b>Hephaestion</b> was Alexander’s lifelong friend. When he died, Alexander mourned extravagantly: Plutarch says he crucified the doctor and ordered a hugely expensive funeral pyre, and he asked Ammon whether Hephaestion could be honoured as a hero.</p>'},
  {lv:2,kind:'match',q:'Match each man to what happened to him.',
    pairs:[['Cleitus','Killed by Alexander with a spear at a drunken banquet'],['Philotas','Executed for failing to report a plot against Alexander'],['Parmenio','Killed at Ecbatana on Alexander’s orders'],['Callisthenes','Died in custody after the Pages’ Conspiracy']],
    hint:'One was killed in a moment of anger; one failed to pass on a warning; one was the father of that man; one was the historian who refused proskynesis.',
    exp:'<p><b>Philotas</b> (330 BCE) was executed for failing to report a conspiracy. His father <b>Parmenio</b> was then killed on Alexander’s orders. <b>Cleitus</b> (328) was killed in a drunken quarrel at Maracanda. <b>Callisthenes</b> (327) was arrested after the Pages’ Conspiracy and died in custody.</p>'},
  {lv:2,q:'How did Alexander treat the mother, wife and daughters of Darius III after capturing them at Issus?',
    a:'With great respect: they kept their royal titles and servants, and were protected',
    w:['He sent them back to Darius at once, in return for a large ransom paid in gold','He kept them as hostages in chains, to force Darius to surrender his empire',['He sold them as slaves to punish Darius for the Persian invasion of Greece','The sources stress the opposite: their honourable treatment.']],
    hint:'Plutarch and Arrian use this episode to praise Alexander’s self-control.',
    exp:'<p>Alexander treated Darius’ family with <b>honour</b>. In a famous story, Darius’ mother Sisygambis bowed to Hephaestion by mistake, and Alexander said that he too was Alexander. The sources use it to show his chivalry and self-restraint.</p>'},
  {lv:4,q:'Read the source. Which underlying cause of Cleitus’ murder does it suggest?',
    src:'At the banquet, as flatterers praised Alexander above his father, Cleitus grew angry. He reminded Alexander that it was his own right hand that had saved Alexander’s life at the Granicus, and he complained that Macedonians now had to beg Persians for a hearing with their king.',cite:'Plutarch, <em>Life of Alexander</em> 50–51 (paraphrased)',
    a:'Old Macedonians’ resentment of his Persian-style kingship and flatterers',
    w:['A long-running dispute over money that Cleitus believed he was owed for the Bactrian campaign',['A plot by Cleitus and other nobles to kill Alexander at the banquet and seize the throne','The source shows an angry outburst, not a plot.'],'Alexander’s jealousy of Cleitus, whose victories in Bactria had made him popular with the army'],
    hint:'Look at who Cleitus says Macedonians now have to “beg”.',
    exp:'<p>The quarrel reflects deep <b>tension between the old Macedonian “first among equals” tradition and Alexander’s Persian-style monarchy</b>, made worse by drink and flattery. Alexander’s remorse afterwards (he did not eat for days) is also important when judging his character.</p>'},
  {lv:5,q:'Which judgement on Alexander’s treatment of enemies is best supported by the evidence?',
    a:'He was generous to brave or submissive enemies, like Porus, but harsh to rebels like Thebes',
    w:[['He was always merciful to his enemies, as his generous treatment of Porus and Darius’ family shows','This ignores Thebes and Tyre.'],['He was always cruel to his enemies, as the destruction of Thebes and the massacre at Tyre show','This ignores Porus and Darius’ family.'],['He was harsh to Porus, who resisted bravely, but generous to Thebes and Tyre when they rebelled','This reverses the evidence: Porus was honoured, Thebes and Tyre were punished.']],
    hint:'A balanced judgement uses examples on both sides.',
    exp:'<p>The best answer is <b>balanced</b>. Alexander respected brave or submissive opponents, but punished resistance brutally. Thebes was razed in 335 BCE, with only Pindar’s house spared, and Tyre’s population was killed or enslaved. Both could be deliberate policy, to deter revolt and to win over the local elite.</p>'},
],
religion:[
  {lv:2,q:'Through his mother, Alexander claimed descent from which hero of the Trojan War?',a:'Achilles',
    w:[['Heracles','Alexander claimed descent from Heracles through Philip’s royal family, the Argeads.'],'Odysseus','Theseus'],
    hint:'Alexander slept with the <em>Iliad</em> under his pillow.',
    exp:'<p>Olympias’ royal family of Epirus claimed descent from <b>Achilles</b> (through his son Neoptolemus). Philip’s family claimed descent from <b>Heracles</b>. At Troy, Alexander honoured Achilles’ tomb, and he wanted to rival the heroes of the past.</p>'},
  {lv:2,q:'Which sculptor was Alexander’s official portraitist, the only one allowed to make his statue?',a:'Lysippos',
    w:[['Apelles','Apelles was the only painter allowed to paint Alexander.'],'Pheidias','Praxiteles'],
    hint:'Plutarch says this sculptor captured Alexander’s slight tilt of the neck and “melting” gaze.',
    exp:'<p><b>Lysippos</b> was Alexander’s “court sculptor”. His portraits showed the head tilted, the upturned gaze and the lion-like mane of hair, and they shaped how Alexander was pictured ever after. The marble head on the syllabus is a later copy of a Lysippan original.</p>'},
  {lv:3,q:'In Arrian, what does Alexander’s <em>pothos</em> describe?',
    a:'A powerful longing to do something extraordinary, like visiting Siwah or the Gordian knot',
    w:['A deep fear of the gods before battle, which made him consult seers such as Aristander every time',['His overwhelming grief after the death of Hephaestion, which led to an extravagant funeral','That is mourning, not pothos.'],'His habit of heavy drinking at banquets, which Arrian blames for the murder of Cleitus'],
    hint:'It is a Greek word for longing or yearning.',
    exp:'<p><b>Pothos</b> (“longing”) is Arrian’s word for Alexander’s urge to go beyond normal human limits. Examples include the Gordian knot, the visit to Siwah and the siege of Aornus. It presents his ambition as almost heroic or divine.</p>'},
  {lv:4,q:'Lysimachus’ silver tetradrachm (issued after Alexander’s death) shows Alexander with ram’s horns. What is the best explanation of its message?',
    a:'The horns link Alexander to Zeus Ammon as a god, lending his prestige to Lysimachus',
    w:[['The horns celebrate a great victory over the Persians, since rams were symbols of strength in battle','Ram’s horns are a religious symbol, not a military one.'],'The coin proves Alexander really wore a horned helmet in battle, as Lysimachus had seen for himself','The horns show Alexander as a gentle shepherd-king, a model for Lysimachus’ own peaceful rule'],
    hint:'Think about the god Alexander visited at Siwah, and who issued the coin.',
    exp:'<p>The ram’s horns are the symbol of <b>Zeus Ammon</b>, so the coin presents Alexander as the god’s son. As evidence, it shows how Alexander was used <b>after his death</b>: Lysimachus, one of the Successors, issued it to borrow Alexander’s prestige. It tells us about later propaganda more than about Alexander’s own beliefs.</p>'},
],
legacy:[
  {lv:1,q:'Where was the famous mosaic of Alexander fighting Darius found?',a:'The House of the Faun, Pompeii',
    w:[['Sidon in Phoenicia','The Alexander sarcophagus was found at Sidon.'],'The royal palace at Pella','The Pantheon in Rome'],
    hint:'It was buried by the eruption of Vesuvius in 79 CE.',
    exp:'<p>The <b>Alexander Mosaic</b> came from the House of the Faun in <b>Pompeii</b> (now in Naples). It is probably a copy of an earlier Greek painting from about 300 BCE, and it shows Alexander charging at Darius, who is fleeing in his chariot. As evidence it is a Roman copy made long after the event.</p>'},
  {lv:1,q:'Which of Alexander’s generals took control of Egypt after his death and founded a ruling dynasty there?',a:'Ptolemy',
    w:[['Seleucus','Seleucus took over most of the Asian empire (the Seleucid kingdom).'],['Lysimachus','Lysimachus took Thrace.'],'Antipater'],
    hint:'His family ruled Egypt until Cleopatra VII.',
    exp:'<p><b>Ptolemy</b> took Egypt and even seized Alexander’s body, burying it in Egypt (later at Alexandria). His dynasty ruled until Cleopatra VII died in 30 BCE. Ptolemy also wrote a history of Alexander, a major source for Arrian.</p>'},
  {lv:4,q:'Arrian based his account mainly on the histories of Ptolemy and Aristobulus. What is the main strength and the main problem of this?',
    a:'Both took part in the campaign, but Ptolemy, later a king, had reasons to flatter himself and Alexander',
    w:[['Both were Persian nobles who knew the empire well, but were naturally biased against their conqueror','Both were Macedonian or Greek members of Alexander’s expedition.'],'Both wrote centuries after Alexander, so they had good archives but no first-hand knowledge of events','Both histories survive complete today, so everything Arrian says can be checked against them line by line'],
    hint:'Think about who these men were, and what Ptolemy became.',
    exp:'<p>Ptolemy and Aristobulus were <b>eyewitnesses</b>, which is a strength. But <b>Ptolemy</b> became king of Egypt and could flatter Alexander and play up his own role. Their works are lost, and Arrian wrote in the 2nd century CE, more than 400 years later.</p>'},
  {lv:5,q:'Which is the strongest evidence that Alexander’s most lasting legacy was cultural rather than political?',
    a:'His empire soon broke up, but Greek language, cities and culture spread across the Hellenistic East',
    w:[['He was never defeated in a major battle, and generals studied his tactics for centuries after his death','That is a military achievement, not evidence that the cultural legacy was greater.'],['He founded Alexandria in Egypt, which became a great city and the home of the famous Library','True and relevant, but on its own it is weaker than the wider spread of Greek culture.'],['His empire survived intact for centuries, but Greek culture made little impact outside the cities','The empire split quickly, and Greek culture spread widely.']],
    hint:'Compare what happened to his empire with what happened to Greek culture.',
    exp:'<p>Politically, the empire <b>collapsed</b> into rival Hellenistic kingdoms (Ptolemaic, Seleucid, Antigonid). Culturally, <b>Greek language and culture</b> spread widely through new cities such as Alexandria. A good essay then weighs this against his political influence on later leaders such as Pompey, Caesar and Augustus.</p>'},
  {lv:5,q:'Plutarch says he was writing “lives”, not histories. Why does this matter when using him as evidence?',
    a:'He chose anecdotes to reveal character and teach morals, so some stories may be selected or shaped',
    w:[['It means he relied only on eyewitness accounts, so his biography is more accurate than any history','Plutarch wrote around 100 CE and used many earlier, often lost, writers.'],['It means he was openly hostile to Alexander and chose only stories that exposed his vices','Plutarch’s view is mixed, often admiring.'],'It means he ignored Alexander’s private life and wrote only about his battles and his government'],
    hint:'What is a biographer most interested in?',
    exp:'<p>Plutarch was interested in <b>character and morality</b>, so he chose anecdotes (Bucephalus, Cleitus, Darius’ family) that reveal virtue or vice. They are valuable for showing how Alexander was remembered, but they need to be checked against Arrian and other evidence.</p>'},
],
});

    exp:'<p>Pausanias had a personal grievance and was killed on the spot, so the truth is lost. Suspicion rests on <b>motive</b>: Olympias and Alexander benefited, and Alexander quickly removed rivals such as Attalus.</p>'},

comedy:[
  {lv:1,q:'At which two Athenian festivals of Dionysus were comedies performed?',a:'The City Dionysia and the Lenaia',

  {lv:1,q:'Where in Athens were the plays of Aristophanes first performed?',a:'The Theatre of Dionysus, on the south slope of the Acropolis',

    exp:'<p>Plays were staged in the <b>Theatre of Dionysus</b>, on the south slope of the Acropolis. The audience sat on the hillside around the circular <em>orchestra</em>, with the <em>skene</em> (stage building) behind it.</p>'},
  {lv:2,q:'What is the <em>parabasis</em> in Old Comedy?',

    hint:'The word means “stepping forward”.',
    exp:'<p>In the <b>parabasis</b> the chorus breaks the dramatic illusion and addresses the audience directly, often about politics or the poet himself. The parabasis of <em>Frogs</em> gave such admired political advice that, according to ancient tradition, the play was performed a second time.</p>'},
  {lv:2,q:'How many members did the chorus of an Old Comedy usually have?',a:'24',

    exp:'<p>A comic chorus had <b>24</b> members, compared with 12 or 15 in tragedy. Aristophanes sometimes splits it, as with the old men and old women in <em>Lysistrata</em>, or gives it a fantastic identity, such as the frogs and the initiates in <em>Frogs</em>.</p>'},
  {lv:4,q:'In <em>Women at the Thesmophoria</em>, the tragic poet Agathon is wheeled out on the <em>ekkyklema</em>. What is the main point of using it here?',
    a:'It parodies tragic stage conventions and mocks Agathon’s pretentious, effeminate style',
    w:[['It shows the audience that Agathon has died and been laid out for burial inside his house','The ekkyklema often reveals bodies in tragedy, but Agathon is very much alive.'],'It was the only way to get any actor onto the stage when the chorus filled the orchestra','It lets Agathon fly high over the audience like a god, as Euripides later does as Perseus'],
    hint:'In tragedy, this wheeled platform reveals what has happened indoors.',
    exp:'<p>The <b>ekkyklema</b> was a tragic device for revealing interior scenes, often bodies. Using it to roll out Agathon, lying around composing lyrics in women’s clothes, is <b>paratragedy</b>: comedy borrowing tragic staging to mock tragedy and its poets.</p>'},
],
lysistrata:[
  {lv:1,q:'What plan does Lysistrata persuade the women of Greece to follow in order to end the war?',
    a:'To refuse sex with their husbands until the men make peace',
    w:['To march together to Sparta and negotiate a peace treaty themselves','To poison the generals and politicians who keep the war going','To burn the Athenian fleet so that the men can no longer fight at sea'],
    hint:'It is a strike.',
    exp:'<p>Lysistrata’s plan is a <b>sex strike</b>, sworn on an oath over a bowl of wine. The older women also seize the <b>Acropolis</b> and its treasury. Together these produce the play’s fantasy plot and its sexual humour.</p>'},
  {lv:3,q:'Why do the older women seize the Acropolis in <em>Lysistrata</em>?',
    a:'To take control of the treasury, which pays for the war',
    w:['To offer sacrifices to Athena and pray for victory over Sparta','To hide from the Spartan army, which is marching on Athens','To set up a permanent government of women in the city'],
    hint:'What was kept on the Acropolis that the war needed?',
    exp:'<p>The Acropolis held the city’s <b>treasury</b>. Without money, Lysistrata argues, the war cannot go on. The scene sets up the clash between the choruses of old men (with fire) and old women (with water).</p>'},
  {lv:3,kind:'order',q:'Put these events of <em>Lysistrata</em> in order.',
    items:['The women swear their oath over a bowl of wine','The Magistrate tries to get money from the Acropolis and is humiliated','Myrrhine teases her husband Cinesias and then leaves him','A desperate Spartan herald arrives to talk about peace','Lysistrata uses Reconciliation to settle the peace terms'],
    hint:'Oath first; the peace settlement comes at the end.',
    exp:'<p>Oath → Magistrate humiliated (dressed as a woman and then as a corpse) → Myrrhine and Cinesias → Spartan herald → Reconciliation and the peace. The structure moves from the plan, to resistance, to the strike working, to the fantasy settlement.</p>'},
  {lv:4,q:'Read the source. What point is Lysistrata making?',
    src:'Lysistrata tells the Magistrate that the city should be handled like wool. First wash out the dirt and pick out the burrs, the men who cling together to get offices. Then card everyone together, including metics, friendly foreigners and the allied cities, and weave a fine cloak for the people.',cite:'Aristophanes, <em>Lysistrata</em> 567–586 (paraphrased)',
    a:'Women’s domestic skills can fix the city: remove corrupt men and unite everyone, allies and metics too',
    w:[['Women should stay at home making clothes and leave the running of the city entirely to the men','She uses wool-working as a model for running the city, not as a reason to stay at home.'],'Athens should put a heavy tax on the wool trade to pay for the fleet and keep the war going','The allies who rebelled should be punished, as a weaver removes damaged threads from the loom'],
    hint:'Each stage of wool-working stands for something political.',
    exp:'<p>The extended <b>metaphor</b> turns a domestic task into a political programme: clean out corrupt office-seekers and <b>unite all groups</b> in the city and empire. The humour lies in the role reversal, but the advice has a serious edge, coming in 411 BCE after the Sicilian disaster.</p>'},
],
thesmo:[
  {lv:1,q:'At the start of <em>Women at the Thesmophoria</em>, why is Euripides worried?',
    a:'The women at the festival plan to punish him for portraying women badly in his tragedies',
    w:['He has lost the tragic competition at the City Dionysia to Aeschylus and Sophocles',['The Spartans have captured his relative and are holding him for ransom in Sparta','His relative’s danger comes later, inside the festival.'],'He has been put on trial for impiety and fears he will be exiled from Athens for good'],
    hint:'The festival was for women only, and the women had a grievance against him.',
    exp:'<p>The women plan to debate how to destroy <b>Euripides</b> because his plays show women as adulterous and scheming. Euripides needs a spy inside the women-only <b>Thesmophoria</b>, a festival of Demeter and Persephone.</p>'},
  {lv:2,q:'How does Euripides’ relative (the Kinsman) get into the women’s festival?',
    a:'He is shaved, singed and dressed in women’s clothes borrowed from Agathon',
    w:['He bribes the doorkeeper of the festival with money borrowed from Agathon','He climbs over the sanctuary wall at night while the women are sleeping',['He disguises himself as a priestess of Athena sent to bless the rites','He disguises himself as an ordinary woman, using Agathon’s clothes.']],
    hint:'Agathon refuses to go himself, but lends something useful.',
    exp:'<p>After <b>Agathon</b> refuses to go, the Kinsman is shaved, has his hair singed off with a lamp, and is dressed in Agathon’s clothes. This creates broad <b>physical humour</b> and the disguise plot.</p>'},
  {lv:3,kind:'match',q:'The Kinsman’s rescue attempts parody plays by Euripides. Match each tragedy to the parody.',
    pairs:[['Telephus','He seizes a woman’s “baby”, which turns out to be a wineskin'],['Palamedes','He writes messages on votive tablets and throws them away'],['Helen','He plays Helen, and Euripides arrives as Menelaus'],['Andromeda','Euripides appears as Perseus, flying in on the stage crane']],
    hint:'Andromeda is rescued by a flying hero; Helen is reunited with her husband; Telephus took a baby hostage.',
    exp:'<p>Each rescue attempt <b>parodies</b> a Euripides tragedy: <em>Telephus</em> (baby hostage, here a wineskin), <em>Palamedes</em> (messages on oar-blades, here votive tablets), <em>Helen</em> and <em>Andromeda</em> (with Euripides on the <em>mechane</em>). The audience is expected to know the originals well.</p>'},
  {lv:4,q:'At the women’s assembly, the disguised Kinsman “defends” Euripides by listing even worse things women really do. Why is this funny?',
    a:'His defence backfires: it confirms the women’s bad reputation and makes them furious, exposing him',
    w:['Because the women agree with every word he says and decide to forgive Euripides after all','Because he speaks in a thick Spartan accent that none of the Athenian women can understand',['Because he forgets his lines and has to ask Euripides for help from behind the door','It is the content of his speech that causes the trouble.']],
    hint:'Think about what the audience expects a defence to do.',
    exp:'<p>The humour is <b>irony</b>: a “defence” that is really a worse attack. It satirises male stereotypes of women while also using them for laughs, and it leads straight to the Kinsman’s exposure.</p>'},
],
frogs:[
  {lv:1,q:'Why does Dionysus travel to the Underworld in <em>Frogs</em>?',
    a:'To bring back Euripides, because Athens has no good tragic poets left',
    w:['To rescue Heracles, who has been trapped there since fetching Cerberus',['To bring back Pericles, the only man who could still save Athens','The aim is a poet, though the play ends with political advice.'],'To find Persephone and bring her back to her mother for the spring'],
    hint:'Dionysus is the god of theatre, and Euripides had died in 406 BCE.',
    exp:'<p>Dionysus misses <b>Euripides</b>, who had recently died, and goes to fetch him. He ends up judging a contest between <b>Aeschylus and Euripides</b>, and chooses to bring back Aeschylus.</p>'},
  {lv:2,q:'Who is Dionysus’ slave, who travels with him in <em>Frogs</em>?',a:'Xanthias',
    w:[['Lampito','Lampito is the Spartan woman in <em>Lysistrata</em>.'],['The Kinsman','He is Euripides’ relative in <em>Women at the Thesmophoria</em>.'],'Aeacus'],
    hint:'He carries the luggage, and complains about it.',
    exp:'<p><b>Xanthias</b> is the clever, put-upon slave. His swaps of costume and status with Dionysus are a key source of <b>role-reversal</b> humour.</p>'},
  {lv:2,q:'When Dionysus is threatened at Pluto’s door, he is so terrified that he soils himself. Which type of humour is this?',a:'Scatological humour',
    w:['Parody','Political satire',['Mistaken identity','The joke is about bodily functions, not confusion over who someone is.']],
    hint:'It is lavatory humour.',
    exp:'<p>This is <b>scatological humour</b>, jokes about bodily functions. It also undermines Dionysus’ pretence of being the brave Heracles, mixing physical comedy with a mocking portrait of a god.</p>'},
  {lv:3,q:'How is the poetry of Aeschylus and Euripides “weighed” in the contest in <em>Frogs</em>?',
    a:'Each speaks lines into a pair of scales, and Aeschylus wins because his words are “heavier”',
    w:['The audience votes by clapping, and Pluto counts which poet received the louder applause','Pluto reads both poets’ plays overnight and announces his decision the next morning',['Each poet is timed reciting a speech, and the quicker one is declared the better poet','The contest literally weighs words.']],
    hint:'Taking a metaphor literally is a typical comic trick.',
    exp:'<p>Words are put on <b>scales</b>: Aeschylus’ heavy images (a river, chariots, corpses) outweigh Euripides’ lighter lines. It is <b>literalised metaphor</b> and literary criticism at the same time, mocking both poets’ styles.</p>'},
  {lv:4,q:'In the parabasis of <em>Frogs</em> (405 BCE), what does the chorus advise the Athenians to do?',
    a:'Restore the rights of citizens disgraced after the coup of 411, as slaves were freed',
    w:['Make peace with Persia at once, and use Persian money to rebuild the fleet against Sparta','Recall Alcibiades from exile and make him sole ruler of Athens until the war is won',['Put the generals of Arginusae on trial for failing to rescue the shipwrecked sailors','The generals had already been executed in 406; the chorus argues for unity.']],
    hint:'The theme is unity and forgiveness in a city facing defeat.',
    exp:'<p>The chorus argues for <b>reconciliation</b>: if slaves who rowed at Arginusae could be freed, then disenfranchised citizens should be restored. Ancient tradition says this advice was so admired that <em>Frogs</em> was given a second performance.</p>'},
  {lv:5,q:'What does the ending of <em>Frogs</em>, when Dionysus brings back Aeschylus, suggest about Aristophanes’ view of poetry?',
    a:'That poets should make citizens better and give the city good advice in a crisis',
    w:[['That comedy is a more important art than tragedy and should be given more prizes','The contest is between tragedians.'],'That only the newest poetry is worth reading, so old poets should be forgotten','That poetry should avoid politics altogether and simply entertain the audience'],
    hint:'Dionysus asks both poets how to save Athens.',
    exp:'<p>Dionysus chooses the poet who can <b>save the city</b>, after asking about Alcibiades and how to win the war. Aristophanes presents poetry as having a <b>civic and moral purpose</b>. Remember that the choice is also a joke, and that both poets are mocked.</p>'},
],
techniques:[

    w:['Political satire of an Athenian general who had run away from a battle',['Parody of a famous speech from one of Euripides’ recent tragedies','The joke here is visual.'],'Sexual innuendo about Dionysus and the women of the Underworld'],

  {lv:4,q:'In <em>Frogs</em>, Dionysus and Xanthias keep swapping costumes, and Aeacus whips them both to find out which one is the god. What is the main source of humour?',

],
themes:[
  {lv:5,q:'“<em>Lysistrata</em> is a serious plea for peace.” Which evidence best supports this view?',
    a:'Lysistrata reminds both sides of their shared religion and past help, and urges Greek unity',
    w:[['The sexual jokes of the Cinesias and Myrrhine scene, which show how desperate both sides are','These are comic devices; on their own they do not show a serious message.'],['The feast and dancing at the end, when Spartans and Athenians celebrate together','This is a conventional comic ending.'],['Lampito’s athletic body, which the Athenian women admire and joke about','This is a joke about Spartan women.']],
    hint:'Look for a speech that argues rather than jokes.',
    exp:'<p>Lysistrata’s speech recalls that Athens sent help when Sparta faced the helot revolt, and Sparta helped free Athens from tyranny. It argues for <b>pan-Hellenic unity</b>. Coming in 411 BCE after the Sicilian disaster, it has a real edge. A balanced answer notes that the play is still a fantasy built for laughs.</p>'},
  {lv:5,q:'Modern productions often present <em>Lysistrata</em> as a feminist play. Which is the strongest counter-argument?',
    a:'The women only want normal married life back, and many jokes rely on male stereotypes of women',
    w:[['Lysistrata hardly appears on stage, and the other women make all the important decisions','She dominates the play.'],['The women fail to achieve peace, so the play shows that women cannot change politics','The plan works.'],'Women were not allowed to watch comedies, so Aristophanes never thought about them at all'],
    hint:'What do the women want at the end, and how are they joked about?',
    exp:'<p>The women want the <b>old order back</b>, husbands home and peace, not political rights. Many jokes rely on <b>stereotypes</b>, such as the women’s desperation to break the oath. Written by a man for a mainly male audience, the role reversal is comic fantasy. A good answer still credits Lysistrata’s intelligence and authority.</p>'},
  {lv:5,q:'Which judgement on Aristophanes’ treatment of Euripides is best supported by the plays?',
    a:'He mocks Euripides’ style and heroines, but his detailed parodies show he knew the plays well',
    w:[['He hated Euripides so much that he refused to mention his plays, attacking only his private life','Euripides appears in two of the three set plays.'],['He thought Euripides the greatest poet, which is why Dionysus brings him back from the dead','In Frogs, Dionysus finally chooses Aeschylus.'],['He respected Euripides deeply, but mocked Aeschylus instead because he disliked old-fashioned poetry','In Frogs both are mocked, and Euripides is a central target.']],
    hint:'Think about how much of Euripides’ work Aristophanes quotes and parodies.',
    exp:'<p>Aristophanes’ mockery is sharp: Euripides “teaches people to argue” and shows wicked women. But the <b>close parody</b> in <em>Women at the Thesmophoria</em> and <em>Frogs</em> shows a deep familiarity, almost an affectionate fascination, and assumes an audience that knew the tragedies.</p>'},
  {lv:5,q:'<em>Frogs</em> won first prize and, ancient sources say, was performed a second time. What does this suggest about comedy in Athens?',
    a:'Audiences valued comedy’s political advice as well as its jokes, so comedy had a civic role',
    w:['Comedies were repeated only when there were no new tragedies ready for the festival',['Aristophanes was the only comic poet in Athens, so his plays were always performed twice','He competed against other comic poets every year.'],'Audiences cared only about spectacle, and the frog costumes were so popular they were reused'],
    hint:'Why might a city want to hear a play again?',
    exp:'<p>The repeat performance, linked to the <b>parabasis</b> advice on reconciliation, suggests that comedy was part of the city’s <b>political conversation</b>. Comic poets could criticise politicians and offer advice under the protection of a religious festival.</p>'},
],
});

    exp:'<p><b>Cleisthenes</b>, a frequent comic target, acts as the women’s ally. His arrival leads to the Kinsman being exposed, which is personal satire in the plot.</p>'},
  {lv:3,q:'Who guards the Kinsman after he is caught?',a:'A Scythian archer, a public slave who speaks broken Greek',
    w:['A Spartan soldier, captured and kept as a prisoner of war','The archon in charge of the festival, with two of his clerks','Agathon’s servant, who had lent the Kinsman his master’s clothes'],
    hint:'Athens used foreign slaves as a kind of police force.',
    exp:'<p>The <b>Scythian archer</b>’s broken Greek is played for laughs. He is fooled by Euripides’ final trick, a joke drawing on Athenian attitudes to foreigners.</p>'},
  {lv:3,q:'How does Euripides finally rescue the Kinsman?',
    a:'He makes peace with the women, then tricks the archer in disguise',
    w:['He flies in on the stage crane as Perseus and carries the Kinsman away into the sky','He bribes the women with money and promises to write plays that praise them','He persuades the archer to let the Kinsman go with a speech from his own Medea'],
    hint:'After the tragic parodies fail, he uses a comic trick.',
    exp:'<p>Euripides promises never to insult women again, then uses a <b>disguise</b> and a dancer to distract the guard. The play ends with comic, not tragic, means.</p>'},
  {lv:4,q:'Agathon explains that a poet must take on the nature of the characters he writes, so he dresses as a woman when composing female roles. What is being satirised?',
    a:'Theories of poetry and Agathon’s effeminate style',
    w:['Spartan customs, such as the training of girls alongside boys','The Athenian law courts and the way jurors are chosen by lot','The secret religious rites of Demeter and Persephone'],
    hint:'It is literary satire.',
    exp:'<p>Aristophanes mocks a <b>theory of imitation</b> by taking it literally, and mocks Agathon personally. The scene mixes intellectual satire with visual cross-dressing humour.</p>'},
  {lv:4,q:'In the parabasis of <em>Women at the Thesmophoria</em>, the women’s chorus argues that women are better than men. What is the effect?',
    a:'It turns the satire on the men in the audience and plays with their assumptions about women',
    w:['It proves that Aristophanes believed women should be allowed to vote in the assembly','It praises Euripides for showing women honestly, as they really are, in his tragedies','It is addressed to the gods only, and asks Demeter to bless the women of Athens'],
    hint:'Who are they talking to, and who sat in the audience?',
    exp:'<p>The chorus mocks the <b>male audience</b> (for wasting money, losing shields, poor leadership). It is comic reversal, not a political programme, but it shows Aristophanes playing with stereotypes.</p>'},
  {lv:5,q:'“<em>Women at the Thesmophoria</em> is a misogynistic play.” Which is the best judgement?',
    a:'It uses stereotypes, but also mocks Euripides’ misogyny',
    w:[['It never mentions women at all, so it cannot be called misogynistic','Women are central.'],['It is entirely in favour of women and never makes a joke at their expense','Many jokes rely on stereotypes.'],['It praises women throughout, but mocks Agathon for writing about them','Many jokes rely on stereotypes of women.']],
    hint:'Who is being laughed at, and how?',
    exp:'<p>The play’s <b>ambiguity</b> is the point: it uses and also exposes stereotypes. Its main target is Euripides and tragedy, through parody.</p>'},
],
frogs:[
  {lv:1,q:'Whom does Dionysus visit first, to ask the way to the Underworld?',a:'Heracles',
    w:['Charon','Hermes','Pluto'],
    hint:'This hero had been to the Underworld before, to fetch Cerberus.',
    exp:'<p>Dionysus asks <b>Heracles</b> for advice and borrows his look (lion-skin and club), which causes trouble later when Underworld characters remember the real Heracles.</p>'},
  {lv:1,q:'What do the frogs sing in <em>Frogs</em>?',a:'“Brekekekex koax koax”',
    w:['“Io Bacche!”','“Woe, woe!”','“Hail, Athena!”'],
    hint:'It imitates croaking.',
    exp:'<p>The frogs’ refrain is <b>onomatopoeia</b>, sung while Dionysus rows. He tries to outdo their noise, a comic contest that anticipates the poets’ contest.</p>'},
  {lv:2,q:'Who make up the second chorus in <em>Frogs</em>?',a:'Initiates of the Eleusinian Mysteries',
    w:['The souls of dead Athenian soldiers','Spartan women who have died in the war','The Furies who punish wrongdoers in Hades'],
    hint:'They celebrate a famous Athenian mystery cult.',
    exp:'<p>The <b>initiates</b> sing hymns that mix religious solemnity with jokes. They also deliver the serious <b>parabasis</b>.</p>'},
  {lv:2,q:'Who holds the “chair of tragedy” in the Underworld when Euripides arrives?',a:'Aeschylus',
