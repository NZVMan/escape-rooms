    hint:'Sophocles politely gives way to him.',
    exp:'<p><b>Aeschylus</b> holds the chair. Euripides challenges him, and Sophocles stays out of it, which sets up the <b>agon</b>.</p>'},
  {lv:3,q:'Aeschylus keeps finishing Euripides’ prologues with “…lost his little oil-flask”. What is the joke?',
    a:'Euripides’ prologues are so predictable in rhythm that any silly phrase fits on the end',
    w:['Euripides really was a perfume seller before he became a poet, and everyone knew it','The oil-flask is a symbol of the gods, so Aeschylus is accusing him of impiety','Aeschylus has forgotten his own lines and fills the silence with any phrase he can'],
    hint:'It is literary criticism disguised as a silly joke.',
    exp:'<p>The repeated tag mocks Euripides’ <b>formulaic</b> openings. It is a famous example of <b>literary parody</b> working on the audience’s knowledge of the plays.</p>'},
  {lv:3,q:'Why does Xanthias have to walk round the lake while Dionysus rides in Charon’s boat?',
    a:'Charon only ferries slaves who fought in the sea battle',
    w:['Xanthias is terrified of water and refuses to get into any boat','The boat is too small to carry both of them and all the luggage','Dionysus tells him to run round the lake to get some exercise'],
    hint:'A topical reference to Arginusae.',
    exp:'<p>Charon refuses <b>slaves</b> who did not fight at <b>Arginusae</b> (406), where slaves who rowed were freed. The joke links to the serious theme of the parabasis.</p>'},
  {lv:4,q:'Euripides boasts that he made tragedy “democratic” by letting women, slaves and masters all speak, and by showing ordinary household matters. Aeschylus replies that poets should teach virtue. What is the debate about?',
    a:'The purpose of tragedy: realism and clever argument against moral teaching and grandeur',
    w:['Which poet wrote the greater number of plays and won more prizes at the Dionysia','Who should pay for the chorus, the poet himself or a wealthy choregos','Whether tragedy should be written in prose instead of verse in future'],
    hint:'What should poetry do for the city?',
    exp:'<p>The <b>agon</b> raises real questions of literary criticism: whether tragedy should <b>reflect life</b> or <b>improve citizens</b>. Aristophanes exaggerates both sides.</p>'},
  {lv:4,q:'Asked about Alcibiades, Aeschylus answers that it is best not to rear a lion cub in the city, but if you do, you must put up with its ways. What does this mean?',
    a:'Alcibiades is dangerous, but if Athens recalls him it must accommodate him',
    w:['Athens should buy lions for the games to win back the people','Alcibiades should be executed at once before he betrays Athens again','Sparta is like a lion, so Athens should never make peace with it'],
    hint:'Read the image politically.',
    exp:'<p>The <b>lion-cub</b> image gives practical political advice in a crisis. It helps persuade Dionysus to choose Aeschylus.</p>'},
  {lv:5,q:'Is Dionysus mainly a figure of fun, or a serious judge, in <em>Frogs</em>?',
    a:'Both: cowardly and absurd at first, but his final choice carries a serious message',
    w:[['He is only a figure of fun throughout, and his choice of poet is just another joke','His decision carries real weight.'],['He is a serious and dignified judge from the very first scene to the last','The first half is broad comedy.'],['Serious and dignified at first, but he becomes a figure of fun once the contest begins','The order is the other way round.']],
    hint:'Compare the journey with the contest.',
    exp:'<p>The <b>structure</b> shifts from slapstick to literary and political debate, and Dionysus changes with it.</p>'},
],
techniques:[
  {lv:1,q:'What is parody?',a:'Comic imitation of a well-known work or style',
    w:['A choral song addressed to the audience about the gods','A list of the characters given at the start of the play','The happy ending of a comedy, with a feast or a wedding'],
    hint:'Aristophanes does this to Euripides constantly.',
    exp:'<p><b>Parody</b> of tragedy (paratragedy) is central to <em>Women at the Thesmophoria</em> and <em>Frogs</em>.</p>'},
  {lv:2,q:'When Aristophanes mocks real Athenians such as Cleon and Cleophon by name, which comic technique is he using?',a:'Political satire and personal ridicule',
    w:['Mistaken identity and disguise','Fantasy and impossible journeys','Scatological humour and slapstick'],
    hint:'Old Comedy named its victims.',
    exp:'<p>Mocking named individuals was a hallmark of <b>Old Comedy</b>, allowing direct comment on politics.</p>'},
  {lv:3,kind:'match',q:'Match each comic technique to an example.',
    pairs:[['Role reversal','Women take over the Acropolis'],['Parody','The Kinsman acts out Euripides’ <em>Helen</em>'],['Scatological humour','Dionysus soils himself in fear'],['Fantasy','A journey to the Underworld to fetch a poet']],
    hint:'Each example comes from a different scene.',
    exp:'<p>Strong essays name the <b>technique</b>, give a precise <b>example</b>, and explain the <b>effect</b> on the audience.</p>'},
  {lv:4,q:'In <em>Frogs</em>, Aeschylus mocks Euripides’ lyrics by calling for “the Muse of Euripides”, a woman playing castanets. What point is he making?',
    a:'That Euripides’ songs are cheap and undignified',
    w:['That Euripides was a skilled dancer as well as a poet','That women should not be allowed to perform music in public','That castanets were used in every tragedy of his day'],
    hint:'Who is this “Muse”?',
    exp:'<p>The joke is <b>literary criticism</b> through visual comedy: Euripides’ new musical style is reduced to a vulgar performance.</p>'},
  {lv:5,q:'“Aristophanes uses fantasy to make serious points.” Which example best supports this?',
    a:'A fantasy trip to Hades ends in debate on saving Athens',
    w:[['The frogs’ croaking song, which Dionysus tries to drown out as he rows','This is fun, but not a serious point.'],['Dionysus’ costume of a lion-skin over a yellow dress and soft boots','This is visual humour.'],'The Scythian archer’s broken Greek, which the audience finds absurd'],
    hint:'Find a fantasy with a political purpose.',
    exp:'<p>Fantasy frees the plot from reality so that it can comment on reality: a <b>poet to save the city</b> (<em>Frogs</em>), or <b>peace through a sex strike</b> (<em>Lysistrata</em>).</p>'},
  {lv:5,q:'“The chorus is the most important element of Old Comedy.” Which is the best judgement?',
    a:'The chorus gives identity and the parabasis, but central characters drive the plots',
    w:[['The chorus has almost no role in Old Comedy; it only sings while the scenery changes','It is central.'],['Only the actors matter, because the chorus never speaks to the audience directly','The chorus has the parabasis and many songs.'],['The chorus matters little, but the scenery and machines carry the meaning of the plays','The chorus is central, with the parabasis.']],
    hint:'Weigh both the chorus and the actors.',
    exp:'<p>Name examples on both sides: the <b>frogs and initiates</b>, the split chorus in <em>Lysistrata</em>, the women’s parabasis, set against the leading characters.</p>'},
],
themes:[
  {lv:1,q:'Which war was Athens fighting when all three plays were first performed?',a:'The Peloponnesian War',
    w:['The Persian Wars','The Trojan War','The Punic Wars'],
    hint:'Athens against Sparta, 431–404 BCE.',
    exp:'<p><em>Lysistrata</em> and <em>Women at the Thesmophoria</em> (411) and <em>Frogs</em> (405) all date from the late, desperate years of the <b>Peloponnesian War</b>.</p>'},
  {lv:2,q:'Which recent disaster gave <em>Lysistrata</em>’s plea for peace (411 BCE) special urgency?',a:'The Sicilian Expedition’s destruction in 413',
    w:['The plague that struck Athens in 430 BCE','The Battle of Marathon against the Persians','The loss of Amphipolis to Brasidas in 424 BCE'],
    hint:'Athens had lost a huge army and fleet.',
    exp:'<p>After <b>Sicily</b>, Athens was exhausted and allies were revolting, so a comic fantasy of peace had a real edge.</p>'},
  {lv:3,q:'How does <em>Frogs</em> explore the theme of slaves and masters?',
    a:'Xanthias is often braver and cleverer than his master, and they swap roles',
    w:['Slaves never appear in the play, which is set entirely among gods and poets','Xanthias is punished for disobedience and sold to Aeacus in the Underworld','Dionysus frees all the slaves in Hades to win their votes in the contest'],
    hint:'Who behaves better in the whipping scene?',
    exp:'<p>The <b>slave–master</b> reversal is comic, but it also echoes Arginusae, where slaves fought for the city and were freed.</p>'},
  {lv:3,q:'Which political upheaval took place in Athens in 411 BCE, the year of <em>Lysistrata</em> and <em>Women at the Thesmophoria</em>?',a:'The oligarchic coup of the Four Hundred',
    w:['The reforms of Ephialtes','The ostracism of Themistocles','The rule of the Thirty Tyrants'],
    hint:'Democracy was briefly overthrown.',
    exp:'<p>The <b>coup of 411</b> forms the background to the plays, and its aftermath is the subject of the <em>Frogs</em> parabasis about restoring rights.</p>'},
  {lv:4,q:'In <em>Lysistrata</em>, the old men’s and old women’s choruses insult each other and then reconcile, merging into one chorus. Why is this significant?',
    a:'Their reconciliation mirrors peace between Athens and Sparta',
    w:['It shows that the chorus has forgotten its lines and needs to start the song again','It shows that the women have lost the argument and must give in to the men','It has no link to the play’s themes and is simply a chance for a final dance'],
    hint:'Think about structure and theme together.',
    exp:'<p>The <b>split chorus</b> stages conflict and then <b>unity</b>, anticipating the peace at the end.</p>'},
  {lv:4,q:'At the end of <em>Frogs</em>, Pluto sends Aeschylus back with “gifts” for Cleophon and others: means to kill themselves. What does this suggest?',
    a:'He attacks warmongers like Cleophon as harmful',
    w:['Aristophanes admired Cleophon and wanted him honoured','Pluto wants to help Cleophon escape from his enemies','Cleophon was a tragic poet who had lost the contest'],
    hint:'Cleophon opposed peace with Sparta.',
    exp:'<p>The dark joke shows <b>political satire</b> continuing to the last lines, and links the literary contest to real policy.</p>'},
  {lv:5,q:'How might a modern audience respond differently from an ancient one to these plays?',
    a:'Modern audiences miss topical jokes and may see feminism',
    w:[['They would respond in exactly the same way, because comedy never changes','Context has changed hugely.'],'Modern audiences cannot laugh at physical comedy, because it does not translate','Ancient audiences found the plays dull and only came for the free wine'],
    hint:'Consider knowledge, values and humour.',
    exp:'<p>The syllabus asks about <b>ancient and modern</b> reactions: topical satire fades, while slapstick and sexual humour travel, and gender issues are read in new ways.</p>'},
  {lv:5,q:'Is Aristophanes’ moral purpose genuine?',
    a:'His plays mix crude comedy with sincere advice, but winning the prize came first',
    w:[['He had no interest in politics at all, and every serious passage is really a joke','The parabases show otherwise.'],['He was a philosopher first and wrote comedy only to spread his ideas','He wrote to win comic competitions.'],['He had no interest in advice, but the Archon forced him to add serious speeches to his plays','The serious passages are his own.']],
    hint:'Balance entertainment against message.',
    exp:'<p>A balanced view sees a <b>serious</b> purpose (the <em>Frogs</em> parabasis, Lysistrata’s speeches) inside a form designed to <b>entertain</b> and win.</p>'},
  {lv:5,q:'“Aristophanes was a conservative.” Which evidence best supports this view?',

    w:[['He supported peace with Sparta, as Lysistrata and other plays show','Peace could be supported by many viewpoints.'],['He wrote comedies with women as the main characters','This is not evidence of political views.'],'He used a chorus of 24, as Old Comedy always did'],
    hint:'Look for nostalgia and hostility to new ideas.',
    exp:'<p>Nostalgia for the <b>“good old days”</b> runs through his plays. A balanced answer notes that he mocks everyone, including generals and the rich.</p>'},
  {lv:5,q:'Which play best explores the theme of escapism and reality?',
    a:'Frogs: a trip to Hades that tackles the crisis of 405 BCE',
    w:[['None of the three plays deals with this theme in any real way','It is on the syllabus.'],'Women at the Thesmophoria, because it is set at a real festival in Athens','Lysistrata, because its plot could really happen in a city at war'],
    hint:'Which journey goes as far from reality as possible?',
    exp:'<p><em>Frogs</em> travels as far from reality as possible but returns with <b>real advice</b>. <em>Lysistrata</em> is also a strong case, as a fantasy solution to a real war.</p>'},

<script>/* js/courses/cie-9274/vases.js */
/* Paper 1 Topic C: Themes in Greek Vase Painting (Trojan War; the daily life of women) */
ER.bank('vases',{
shapes:[
  {lv:1,q:'Which pot shape had three handles and was used mainly for fetching and carrying water?',a:'Hydria',
    w:[['Kylix','A kylix is a shallow drinking cup.'],['Krater','A krater is a large bowl for mixing wine and water.'],'Lekythos'],
    hint:'Two horizontal handles for lifting, one vertical handle for pouring.',
    exp:'<p>The <b>hydria</b> (from <em>hydor</em>, water) had two side handles for lifting and a back handle for pouring. Fittingly, the Antimenes Painter’s hydria shows women collecting water at a fountain house.</p>'},
  {lv:1,q:'What is a kylix?',a:'A shallow, two-handled drinking cup used at the symposium',
    w:['A tall, narrow-necked jar for storing olive oil or wine','A lidded box for a woman’s cosmetics or jewellery','A one-handled jug for pouring wine from the krater'],
    hint:'Its inside (the tondo) was revealed as the drinker emptied it.',
    exp:'<p>The <b>kylix</b> was a wide, shallow wine cup. Painters decorated the round inner <b>tondo</b> and the outside. The circular field was a real compositional challenge, as on the Sosias Painter’s Achilles and Patroclus.</p>'},
  {lv:2,kind:'match',q:'Match each shape to its main use.',
    pairs:[['Amphora','Storing and transporting wine or oil'],['Krater','Mixing wine with water'],['Lekythos','Holding oil, often for funerals'],['Pyxis','Holding cosmetics or jewellery'],['Loutrophoros','Carrying water for the bridal bath']],
    hint:'The krater stood at the centre of the symposium; the loutrophoros belongs to weddings.',
    exp:'<p>Shape matched function: <b>amphora</b> (storage), <b>krater</b> (mixing wine and water), <b>lekythos</b> (oil, often for graves), <b>pyxis</b> (lidded box for a woman’s cosmetics or jewellery) and <b>loutrophoros</b> (water for the wedding bath; also placed on the graves of the unmarried).</p>'},
  {lv:2,q:'What was an epinetron used for?',
    a:'It was placed over the knee and thigh while preparing raw wool for spinning',
    w:['It was used in the workshop to grind and mix the pigments for added colour','It was a shallow cup that women used at festivals such as the Thesmophoria','It held perfumed oil for the bride on the morning of her wedding day'],
    hint:'Its rough upper surface was used in wool-working.',
    exp:'<p>The <b>epinetron</b> was a half-cylinder placed over the thigh to roll and prepare wool (roving). The epinetra on the syllabus (Eretria Painter; BM B598) tie the object to its use in women’s daily wool-work.</p>'},
],
technique:[
  {lv:1,q:'In black-figure painting, how were details such as muscles and hair shown?',
    a:'By incising (scratching) lines through the black slip to show the clay underneath',
    w:[['By painting them with a fine brush in diluted slip to give golden-brown lines','That is the red-figure technique.'],'By carving them in raised relief into the clay before the vase was fired','By gluing on thin pieces of coloured clay after the vase came out of the kiln'],
    hint:'The painter used a sharp point.',
    exp:'<p>Black-figure painters made the figures in black slip and then <b>incised</b> the details, so the orange clay showed through. They added <b>red and white</b> paint for extra colour. Masters like Exekias used incision with great precision (look at Achilles’ and Ajax’s cloaks).</p>'},
  {lv:2,q:'How does red-figure differ from black-figure?',
    a:'The figures are left the colour of the clay and the background is painted black',
    w:['The figures are painted in red paint on a white background before firing','The whole vase is fired red and figures are then scratched into the surface',['It uses far more incision, with every detail scratched through the black','Red-figure painters used brushes rather than incision.']],
    hint:'Think of it as the reverse of black-figure.',
    exp:'<p>In <b>red-figure</b> the figures are <b>reserved</b> (left in clay colour) and the background is filled in with black. Details are painted with a <b>brush</b>, which allows more flexible lines.</p>'},
  {lv:2,q:'In black-figure, which added colour was used for women’s skin?',a:'White',
    w:['Red','Blue','Gold leaf'],
    hint:'It also marks women as pale, because they lived mostly indoors.',
    exp:'<p><b>Added white</b> was the convention for female flesh in black-figure. It helped viewers tell figures apart, and it reflected the ideal that respectable women stayed indoors. Red-figure later dropped the convention.</p>'},
  {lv:3,q:'Why could red-figure painters show anatomy and drapery more naturally than black-figure painters?',
    a:'They drew details with brushes, using relief lines and diluted slip for fine lines',
    w:['They could use many more colours of paint, including blue, green and gold leaf',['They used a much sharper engraving tool, which cut thinner lines than before','They stopped using incision for details.'],'They painted on flat panels that were attached to the vase after it was fired'],
    hint:'Compare a brush with a scratching tool.',
    exp:'<p>A brush allowed varied lines: bold <b>relief lines</b> for contours and <b>diluted slip</b> for shading, muscles and see-through drapery. This let the Pioneers experiment with foreshortening and twisting poses.</p>'},
  {lv:4,q:'Why did the painted slip come out black while the clay stayed orange after firing?',
    a:'All turned black, but only the porous clay turned red again in the end',
    w:['The painters used black paint made from soot, which did not burn away in the heat of the kiln',['The slip was made from a different, naturally black clay brought from Corinth','The slip was made of the same clay, very finely refined.'],'The black areas were painted on after firing, with a varnish made from pine resin'],
    hint:'Oxidising, reducing, then re-oxidising.',
    exp:'<p>Potters controlled oxygen in the kiln. <b>Oxidising</b> turned everything red, <b>reducing</b> (smoky) turned everything black, and the final <b>re-oxidising</b> turned the porous body red again. The fine slip had <b>sintered</b> (sealed), so it stayed black.</p>'},
],
style:[
  {lv:1,q:'Roughly when was red-figure painting invented in Athens?',a:'About 530 BCE',
    w:[['About 700 BCE','About 700 BCE is roughly when black-figure developed in Corinth.'],'About 430 BCE','About 330 BCE'],
    hint:'It was in the second half of the 6th century BCE.',
    exp:'<p>Red-figure was invented in Athens around <b>530 BCE</b>, traditionally in the workshop of the <b>Andokides Painter</b>. For a while both techniques were used side by side, as on bilingual vases.</p>'},
  {lv:2,q:'What is a “bilingual” vase?',a:'A vase with black-figure on one side and red-figure on the other',
    w:['A vase with inscriptions written in both Greek and Latin','A vase made by two potters working in different cities','A vase showing a myth on one side and daily life on the other'],
    hint:'The two “languages” are painting techniques.',
    exp:'<p><b>Bilingual</b> vases show the same or similar scenes in both techniques. The Boston belly amphora, by the Lysippides Painter (black-figure) and the Andokides Painter (red-figure), shows Achilles and Ajax playing dice, so the two methods can be compared directly.</p>'},
  {lv:3,q:'What were the “Pioneer” painters, such as Euphronios and Euthymides, best known for?',
    a:'Using red-figure to explore anatomy, foreshortening and torsion',
    w:['Inventing black-figure painting in Corinth and teaching it to the potters of Athens','Painting tiny, delicate figures on small perfume vases made for women','Painting mainly calm scenes of women’s daily life, such as weaving and bathing'],
    hint:'They were among the first generation of red-figure painters.',
    exp:'<p>The <b>Pioneers</b> (about 520–500 BCE) used the brush to explore <b>anatomy</b>, <b>three-quarter views</b> and <b>foreshortening</b>. Euphronios’ Sarpedon krater and Euthymides’ Hector arming are key examples.</p>'},
  {lv:3,q:'Which change in drawing the eye shows the move towards naturalism?',
    a:'From a frontal eye in a profile face to a profile eye',
    w:['From a closed, sleeping eye to a wide, staring open eye','From an eye painted in colour to an eye left in plain black','From a very large eye to no eye drawn on the figure at all'],
    hint:'In early work the eye looks straight at the viewer even when the face is side-on.',
    exp:'<p>Early painters drew a <b>frontal eye</b> in a profile head. Later red-figure painters drew a <b>profile eye</b>, a key sign of increasing naturalism, which you can comment on when comparing vases.</p>'},
  {lv:4,q:'Which description best fits the Mannerist painters of the early 5th century BCE?',
    a:'They kept old-fashioned features on purpose: stiff drapery, small heads, long limbs',
    w:[['Huge, serious figures on several ground levels, influenced by the great wall painters','That describes the Grand style.'],'The very first painters to use red-figure, working in the Andokides Painter’s workshop','Painters who worked only on women’s scenes, for pots used in the home'],
    hint:'Their style looks back to Archaic art.',
    exp:'<p>The <b>Mannerists</b> chose an archaising style that contrasts with the <b>Grand style</b>, whose painters (such as the Niobid Painter) were influenced by wall painters like Polygnotos and used larger, more serious figures.</p>'},
],
composition:[
  {lv:3,q:'On Exekias’ amphora of Achilles and Ajax playing a board game, how does the composition focus attention?',
    a:'The heroes’ backs and spears form a triangle that leads the eye to the game',
    w:['The figures are scattered around the vase in a long frieze of soldiers and horses',['The background is filled with animals and plants, which frame the heroes on each side','Exekias uses a plain black background to isolate the figures.'],'The gods watch the game from above, and their gaze leads our eyes down to the heroes'],
    hint:'Look at the shapes made by the heroes’ bodies and spears.',

  {lv:4,q:'On the Sosias Painter’s kylix, Achilles bandages the wounded Patroclus. What is most innovative about it?',

trojan:[

  {lv:4,q:'Some black-figure vases of the sack of Troy show Neoptolemus swinging the body of the child Astyanax as a weapon against Priam on the altar. What is the effect?',
    a:'It shocks us with the victors’ cruelty and sacrilege',
    w:['It celebrates Neoptolemus as the greatest hero of the war','It shows that the Trojans won the final battle for the city','It is a comic scene, meant to make drinkers laugh at a party'],
    hint:'A child, an old king, and an altar.',
    exp:'<p>Combining the deaths of <b>Priam and Astyanax</b> at an altar condenses the horror of the sack into one image, a powerful example of <b>emotion</b> in narrative.</p>'},
  {lv:4,q:'A hydria shows Achilles carrying the body of Penthesilea from the battlefield. What does choosing this moment emphasise?',
    a:'Pathos and regret, not the fight',
    w:['Achilles’ triumph over the Amazons','The comic side of war for drinkers','Penthesilea’s victory over the Greeks'],
    hint:'Compare it with Exekias’ moment of the kill.',
    exp:'<p>Showing the <b>aftermath</b> focuses on loss and remorse, while Exekias chose the instant of death and love. Comparing the two shows how painters chose moments for effect.</p>'},
  {lv:5,q:'Which Trojan War vase best shows sympathy for the defeated Trojans?',
    a:'The Kleophrades Painter’s Fall of Troy hydria',
    w:[['Exekias’ amphora of Achilles and Ajax playing dice in a quiet moment','It shows two Greek heroes at rest.'],['The François Vase, with the wedding of Peleus and Thetis','Its main subject is a wedding.'],'Sophilos’ dinos, with the gods arriving for a wedding feast'],
    hint:'Which vase focuses on Trojan suffering?',
    exp:'<p>The Kleophrades Painter makes the <b>victims</b> central and the Greeks appear brutal. It is a strong choice for essays on emotion and the treatment of myth.</p>'},
  {lv:5,q:'Some scholars link scenes of the sack of Troy painted around 480 BCE to the Persian sack of Athens. Which is the best judgement on this idea?',
    a:'Plausible from the date and the sacrilege, but we cannot prove intent',
    w:[['It is proven, because the painter inscribed “Athens” beside the burning city','There is no such inscription.'],['It is impossible, because the Persians never reached Athens in 480 BCE','The Persians sacked Athens in 480.'],['It is proven by the painter’s signature, but only for vases made in Persia','There is no such proof, and the vases are Athenian.']],
    hint:'Distinguish evidence from interpretation.',
    exp:'<p>Good answers present this as an <b>interpretation</b>: suggestive context, but speculative.</p>'},
],
women:[
  {lv:1,q:'Which daily task of women is most often shown on the syllabus vases?',a:'Wool-working and weaving',
    w:['Farming','Fighting','Fishing'],
    hint:'Spindles, looms and epinetra.',
    exp:'<p><b>Textile work</b> was the ideal occupation of the respectable wife and appears on the Amasis Painter’s lekythos, the Douris kylix, the Brygos Painter’s jug and the epinetra.</p>'},
  {lv:2,q:'What scene does the Edinburgh Painter’s neck amphora show?',a:'Women showering under spouts in a shower house',
    w:['Women weaving at a large upright loom','A wedding procession with the bride in a cart','Women mourning at a young man’s funeral'],
    hint:'It is a bathing scene.',
    exp:'<p>The shower scene is unusual. Its nudity raises questions about who the women are and who the audience was.</p>'},
  {lv:2,q:'What is the woman doing on the Douris kylix in Berlin?',a:'Preparing (roving) wool',
    w:['Playing the lyre','Fetching water','Dancing at a symposium'],
    hint:'It is the step before spinning.',
    exp:'<p>The scene shows <b>roving</b> wool, which links the cup to the epinetron and to the ideal of domestic work.</p>'},
  {lv:3,q:'On the Brygos Painter’s kylix of a symposiast and dancing girl (British Museum), what is the woman’s role?',a:'A hired entertainer at a party',
    w:['The host’s wife, welcoming guests','A priestess pouring a libation','The cup’s owner, toasting a friend'],
    hint:'Respectable wives did not attend symposia.',
    exp:'<p>Women at the <b>symposium</b> were musicians, dancers or hetairai, so these scenes show a very different side of women’s lives from the wool-working ideal.</p>'},
  {lv:3,q:'What does the Amasis Painter’s wedding procession lekythos show?',a:'The bride and groom riding in a cart to their home',
    w:['A bride weaving her dowry before the wedding, watched by her mother','The funeral procession of a young woman who died before her wedding','Women fetching water at a fountain for the bride’s ritual bath'],
    hint:'Marriage meant moving to the husband’s house.',
    exp:'<p>The <b>wedding procession</b> marked the bride’s transfer from her father’s household to her husband’s, the key moment in a citizen woman’s life.</p>'},
  {lv:4,q:'Why are spinning and weaving scenes so common on vessels used by women, such as the pyxis and epinetron?',
    a:'They promoted the ideal of the hard-working wife to the women using them',
    w:['Because women were not allowed to see any other kind of scene on pots','Because spinning was a religious ritual performed only at festivals','Because painters could not draw anything more complicated than looms'],
    hint:'Think about who used these objects.',
    exp:'<p>The decoration matched both the <b>user</b> and the <b>ideal</b>. These are useful as evidence of values, if not of everyday reality.</p>'},
  {lv:4,q:'The potter Sophilos signed his dinos, and Kleitias labelled most figures on the François Vase. Why are inscriptions useful to us?',
    a:'They name artists and figures, helping us read scenes',
    w:['They prove that all potters and painters could read and write Latin','They give the price of each vase, showing how much they cost to buy','They show that these vases were made in Rome, not in Athens at all'],
    hint:'Without labels, many figures would be hard to identify.',
    exp:'<p><b>Signatures</b> let us study individual artists, and <b>name labels</b> make complex scenes readable for us, as they were for ancient viewers.</p>'},
  {lv:5,q:'Which vases are the best evidence that some women had roles outside the home?',
    a:'The fountain-house and workshop scenes, perhaps idealised',
    w:[['The Amasis Painter’s lekythos showing every stage of weaving wool at home','It shows the domestic ideal.'],['Exekias’ amphora of Achilles and Ajax playing dice in a tent','It shows no women.'],'The Sosias Painter’s kylix of Achilles bandaging the wounded Patroclus'],
    hint:'Look outside the house.',
    exp:'<p>Water-collecting and the workshop show women in <b>public or working spaces</b>. Religious festivals are another strong example.</p>'},
  {lv:5,q:'What is the most cautious interpretation of scenes of nude women bathing, like the Edinburgh Painter’s shower house?',
    a:'They may show hetairai or ideal nudes for male viewers',
    w:[['They are a photographic record of the daily routine of most Athenian women','Vases are not neutral records.'],['They prove that public baths for women existed in every Greek city','One scene cannot prove that.'],'They show goddesses only, so they tell us nothing about real women'],
    hint:'Who were these images made for?',
    exp:'<p>Remember the <b>male gaze</b> and the context of use when using these images as evidence.</p>'},
],
});

<script>/* js/courses/cie-9274/augustus.js */
/* Paper 2 Topic A: Augustus (sources: Res Gestae; Suetonius, Augustus; Tacitus, Annals 1.1–10; Horace; Virgil; visual and material sources) */
ER.bank('augustus',{
rise:[
  {lv:1,q:'How was Octavian (the future Augustus) related to Julius Caesar?',
    a:'He was Caesar’s great-nephew, and was adopted as his son in Caesar’s will',
    w:['He was Caesar’s only son by Cleopatra, brought up in Rome by Caesar’s sister Julia',['He was Caesar’s brother-in-law, married to Caesar’s daughter Julia until her death','That was not his relationship.'],'He was Caesar’s nephew by marriage, but Caesar never adopted him or named him heir'],
    hint:'His grandmother was Caesar’s sister Julia.',
    exp:'<p>Octavian’s grandmother was Caesar’s sister, so he was Caesar’s <b>great-nephew</b>. In 44 BCE Caesar’s will made him his <b>adopted son</b> and heir, giving him Caesar’s name and the loyalty of Caesar’s veterans.</p>'},
  {lv:2,q:'Which three men formed the Second Triumvirate in 43 BCE?',a:'Octavian, Mark Antony and Lepidus',
    w:[['Julius Caesar, Pompey and Crassus','That was the so-called First Triumvirate (60 BCE).'],'Octavian, Agrippa and Maecenas','Octavian, Cicero and Brutus'],
    hint:'It was legally set up by the Lex Titia, and its first act was the proscriptions.',
    exp:'<p>The <b>Second Triumvirate</b> (Octavian, Antony, Lepidus) was a legal five-year commission. It began with the <b>proscriptions</b>, in which <b>Cicero</b> was killed, and it defeated Brutus and Cassius at Philippi (42 BCE).</p>'},
  {lv:2,kind:'year',q:'In which year did Octavian defeat Antony and Cleopatra at the Battle of Actium?',year:31,era:'BCE',
    hint:'Four years before the settlement of 27 BCE.',
    exp:'<p><b>Actium, 2 September 31 BCE.</b> Agrippa commanded Octavian’s fleet. Antony and Cleopatra killed themselves in Alexandria in 30 BCE, and Egypt was annexed. Augustan propaganda presented Actium as a war against a foreign queen.</p>'},
  {lv:3,kind:'order',q:'Put these events of Octavian’s rise to power in order.',
    items:['Adopted in Julius Caesar’s will','Second Triumvirate formed','Brutus and Cassius defeated at Philippi','Lepidus removed from the triumvirate','Battle of Actium'],
    hint:'44, 43, 42, 36, 31 BCE.',
    exp:'<p>Adoption (44) → triumvirate (43) → Philippi (42) → Lepidus removed after the defeat of Sextus Pompeius (36) → Actium (31). Look for how Octavian moved from private citizen to sole ruler.</p>'},
  {lv:4,q:'Read the source. Why might Augustus begin his <em>Res Gestae</em> this way?',
    src:'At the age of nineteen, on my own initiative and at my own expense, I raised an army, with which I set the state free from the tyranny of a faction.',cite:'<em>Res Gestae</em> 1 (paraphrased)',
    a:'To present an illegal private army as a patriotic act that saved the Republic',
    w:['To admit openly that he had seized power illegally, so that later readers would forgive him',['To thank the Senate for giving him command of an army at such a young age','He stresses that the army was his own initiative.'],'To criticise Julius Caesar for leaving the Republic in the hands of a faction of senators'],
    hint:'Who is the “faction”, and was a 19-year-old allowed to raise an army?',
    exp:'<p>A private citizen raising an army was <b>illegal</b>. Augustus reframes it as <b>liberation</b> from “a faction” (Antony, unnamed). This is typical of the <em>Res Gestae</em>: selective, euphemistic and focused on legality and service.</p>'},
],
power:[
  {lv:1,q:'Which name did the Senate grant Octavian in January 27 BCE?',a:'Augustus',
    w:['Pater Patriae',['Imperator','He used Imperator as a first name (praenomen), but it was not the 27 BCE honour.'],'Dictator'],
    hint:'It suggested “revered”, with religious overtones.',
    exp:'<p>In 27 BCE the Senate voted him the name <b>Augustus</b> (“revered”, linked to augury), along with the oak-leaf crown, laurels at his door and the golden shield. The title was new, so it avoided “king” or “dictator”.</p>'},
  {lv:2,q:'Which two powers formed the basis of Augustus’ position after the settlement of 23 BCE?',
    a:'Tribunician power and greater proconsular power (maius imperium)',
    w:[['A permanent dictatorship and the office of censor, both held for life','He refused the dictatorship.'],'A consulship every year and the title of king, voted by the people','The office of pontifex maximus and a permanent praetorship in Rome'],
    hint:'He gave up the consulship he had held every year since 31 BCE.',
    exp:'<p>In 23 BCE Augustus resigned the consulship and received <b>tribunicia potestas</b> (protection, veto, the right to propose laws, popular appeal) and <b>maius imperium</b> (authority over other governors). He dated his reign by his years of tribunician power.</p>'},
  {lv:3,q:'Which was a likely reason for the settlement of 23 BCE?',
    a:'His serious illness and a conspiracy showed the need for a more stable, less provocative position',
    w:['He had been defeated in a civil war by supporters of the Republic and had to accept terms','The Senate forced him to retire from all offices after complaints about his building costs',['He wanted to make himself king openly, and needed new powers to prepare the people for it','He carefully avoided monarchy in name.']],
    hint:'In 23 BCE he nearly died, and he handed his signet ring to Agrippa.',
    exp:'<p>In 23 BCE Augustus nearly died, and there was a <b>conspiracy</b> (Caepio and Murena). Holding the consulship every year also blocked senators’ careers. The new arrangement kept real power while freeing the consulship for others.</p>'},
  {lv:4,q:'Read the source. What claim does Augustus make, and why is it misleading?',
    src:'After this time I surpassed everyone in authority (auctoritas), but I had no more official power (potestas) than my colleagues in each office.',cite:'<em>Res Gestae</em> 34 (paraphrased)',
    a:'He claims only greater prestige, though he held unique powers and controlled the army',
    w:[['He claims to be a god on earth, which was untrue, as he never accepted divine honours','He claims auctoritas, not divinity.'],'He admits that he was a dictator, which is misleading because the Senate never voted him that title','He says he shared all power equally with Agrippa, though Agrippa in fact held no offices'],
    hint:'Compare auctoritas with tribunicia potestas and maius imperium.',
    exp:'<p>The <b>auctoritas versus potestas</b> distinction presents Augustus as first among equals. In reality his <b>combination of powers</b>, control of the legions and wealth made him supreme. Tacitus (<em>Annals</em> 1.2) gives the cynical version.</p>'},
  {lv:5,q:'In 27 BCE Augustus claimed to have “restored the Republic”. Which is the best judgement on this claim?',
    a:'Republican forms continued, but the army, provinces and money lay with him: monarchy in disguise',
    w:[['It was a genuine restoration: Augustus gave up all his powers and retired from public life','He kept his powers until his death in 14 CE.'],['He openly declared himself king, and the Senate accepted this to avoid another civil war','He carefully avoided the title of king.'],['Augustus kept the army, but the Senate held the real power over the provinces and money','Augustus controlled the key provinces and much of the money.']],
    hint:'Compare what things looked like with where real power lay.',
    exp:'<p>The best answer contrasts <b>appearance</b> with <b>reality</b>. The Senate, magistrates and assemblies carried on, but Augustus controlled the legions, Egypt and patronage. Tacitus (<em>Annals</em> 1.3) says that “the same names of magistrates” remained. Use the settlements of 27 and 23 BCE as evidence.</p>'},
  {lv:5,q:'Tacitus says Augustus “won over the soldiers with gifts, the people with cheap grain and everyone with the sweetness of peace”. Which is the best judgement on this view?',
    a:'Hostile but perceptive: Augustus did rely on these, but Tacitus ignores the real benefits',
    w:[['It is fully reliable, because Tacitus was an eyewitness who knew Augustus personally','Tacitus wrote about 100 years later.'],['It is completely false, as Augustus never gave the soldiers or people anything','There is evidence for donatives, grain and the appeal of peace.'],['Tacitus is friendly to Augustus, but his account is too short to be useful','Tacitus is hostile to the Principate.']],
    hint:'Consider when Tacitus wrote, and his attitude to the emperors.',
    exp:'<p>Tacitus (early 2nd century CE) writes as a <b>senator hostile to the Principate</b>. His analysis captures how Augustus secured support, but it is <b>cynical</b>: it plays down genuine achievements and the relief after the civil wars.</p>'},
],
senate:[
  {lv:2,q:'Who governed Egypt under Augustus?',a:'An equestrian prefect appointed by Augustus',
    w:[['A senator chosen each year by lot','That is how senatorial provinces were governed.'],'Cleopatra’s son, as a client king of Rome','A consul elected each year by the people'],
    hint:'Senators were not even allowed to enter Egypt without permission.',
    exp:'<p>Egypt was too important (grain supply, wealth) to risk a rival senator controlling it. It was run by a <b>praefectus Aegypti</b> of <b>equestrian</b> rank, answerable to Augustus. The first, Cornelius Gallus, fell from favour.</p>'},
  {lv:3,q:'What was the difference between imperial and senatorial provinces?',
    a:'Imperial frontier provinces with legions had Augustus’ legates; peaceful ones had proconsuls',
    w:['Imperial provinces paid no taxes, while senatorial provinces paid tribute directly to the Senate',['Senatorial provinces held most of the legions, while imperial provinces were peaceful and unarmed','Most legions were in the imperial provinces.'],'There was no real difference; both were governed by men chosen by Augustus personally'],
    hint:'Where were most of the legions stationed?',
    exp:'<p>The division (27 BCE) gave Augustus the <b>militarily important</b> provinces with most of the <b>legions</b>, governed by his legates. It looked like sharing power with the Senate while keeping military control.</p>'},
],
frontiers:[
  {lv:1,q:'What did Augustus recover from the Parthians by diplomacy in 20 BCE?',
    a:'The legionary standards lost by Crassus at Carrhae',
    w:['The body of Mark Antony, killed in Parthia after Actium','Cleopatra’s treasure, taken east by her supporters','The Roman province of Syria, seized by the Parthians'],
    hint:'They appear on the breastplate of the Prima Porta statue.',
    exp:'<p>Crassus had lost the <b>standards</b> at Carrhae in 53 BCE. Their return in 20 BCE was celebrated as a victory on coins, on the Prima Porta breastplate and in the Temple of Mars Ultor, even though it was achieved by negotiation.</p>'},
  {lv:2,q:'What happened in the Varian disaster of 9 CE?',
    a:'Three legions under Varus were wiped out in the Teutoburg Forest',
    w:['The Roman fleet was destroyed in a storm off Germany, with all its crews','Parthia invaded Syria and captured the governor Varus with three legions','Rome itself was struck by a great fire, blamed on supporters of Varus'],
    hint:'Suetonius says Augustus beat his head on a door, crying out for his legions.',
    exp:'<p>In <b>9 CE</b> Arminius ambushed and destroyed <b>three legions</b> under Varus. Rome gave up plans to push the frontier to the Elbe and fixed it at the <b>Rhine</b>. Tacitus reports Augustus’ advice to keep the empire within its existing limits.</p>'},
  {lv:3,q:'Which members of Augustus’ family led the campaigns on the German frontier?',a:'Tiberius and Drusus, Livia’s sons',
    w:[['Gaius and Lucius, his grandsons','Gaius and Lucius were sent east, not to Germany.'],'Agrippa and Marcellus, his sons-in-law','Mark Antony’s sons, Iullus and Antyllus'],
    hint:'They were Augustus’ stepsons.',
    exp:'<p><b>Drusus</b> reached the Elbe before dying in 9 BCE. <b>Tiberius</b> then campaigned in Germany and Pannonia. Their generalship mattered both militarily and dynastically.</p>'},
],
religion:[
  {lv:2,q:'What did Augustus say he did for the temples of Rome in 28 BCE?',a:'He restored 82 temples in one year',
    w:['He closed all the temples to foreign gods','He turned the temples into treasuries','He moved the temples to the Palatine'],
    hint:'<em>Res Gestae</em> 20.',
    exp:'<p>Augustus claimed to have <b>restored 82 temples</b>, neglecting none that needed repair. He also built new ones (Apollo on the Palatine, Mars Ultor, Divus Julius), presenting himself as the restorer of traditional <b>piety</b>.</p>'},
  {lv:2,q:'What were the Secular Games of 17 BCE?',
    a:'A great religious festival marking a new age, for which Horace wrote the <em>Carmen Saeculare</em>',
    w:['Gladiator games and beast hunts celebrating the victory at Actium fourteen years earlier',['Athletic games copied from Olympia, with Greek athletes competing for olive crowns','They were religious rites for a new saeculum.'],'Chariot races held each year on Augustus’ birthday, paid for by the Senate'],
    hint:'A saeculum was roughly the longest human lifetime.',
    exp:'<p>The <b>Ludi Saeculares</b> celebrated the start of a new <b>golden age</b>. Horace’s hymn, sung by 27 boys and 27 girls, praised the gods, Augustus’ moral laws and Rome’s renewed prosperity.</p>'},
  {lv:3,q:'Which law rewarded citizens who had three or more children?',
    a:'The Julian laws on marriage and children',
    w:['The Lex Titia, which set up the triumvirate',['The Lex Hortensia, passed by the plebs','That is a law of 287 BCE about the plebs.'],'The law that gave Augustus maius imperium'],
    hint:'Augustus wanted more upper-class Romans to marry and have children.',
    exp:'<p>Augustus’ <b>social legislation</b> (18 BCE; Lex Papia Poppaea, 9 CE) penalised the unmarried and childless and rewarded parents (<em>ius trium liberorum</em>). Adultery became a public crime. The laws were <b>unpopular and largely ineffective</b>: the Lex Papia Poppaea was proposed by two unmarried consuls.</p>'},
  {lv:5,q:'Which is the strongest evidence that Augustus’ moral legislation failed?',
    a:'His own daughter and granddaughter were exiled for adultery',
    w:[['He restored 82 temples in a single year, as he records in the Res Gestae','This is about religion, not moral legislation.'],['Horace praised the laws in the Carmen Saeculare at the Secular Games','Praise from a court poet shows the intention, not the effect.'],'The Senate gave him the title Pater Patriae as a reward for his reforms'],
    hint:'Look closest to home.',
    exp:'<p>The scandal of <b>Julia</b> (2 BCE) and of the younger Julia (8 CE), together with the equestrians’ protests that forced changes (Suetonius), show that the laws had <b>limited effect</b> even inside Augustus’ own family.</p>'},
],
family:[
  {lv:1,q:'Who was Augustus’ wife for more than 50 years?',a:'Livia',
    w:[['Octavia','Octavia was his sister, who married Mark Antony.'],['Julia','Julia was his daughter.'],'Scribonia'],
    hint:'Her sons were Tiberius and Drusus.',
    exp:'<p>Augustus married <b>Livia Drusilla</b> in 38 BCE. She brought the <b>Claudian</b> connection and her sons Tiberius and Drusus. Hostile sources such as Tacitus suspect her of scheming for Tiberius.</p>'},
  {lv:2,kind:'match',q:'Match each man to his link with Augustus’ plans for the succession.',
    pairs:[['Marcellus','Nephew, married to Julia, died in 23 BCE'],['Agrippa','Loyal general, married Julia and fathered Gaius and Lucius'],['Gaius and Lucius','Grandsons adopted as sons, both died young'],['Tiberius','Stepson, adopted in 4 CE, became emperor']],
    hint:'Work through the order: Marcellus, then Agrippa, then the grandsons, then Tiberius.',
    exp:'<p>The succession plan kept failing: <b>Marcellus</b> died (23 BCE), <b>Agrippa</b> died (12 BCE), <b>Lucius</b> (2 CE) and <b>Gaius</b> (4 CE) died, leaving <b>Tiberius</b>, adopted in 4 CE. Julia was used in dynastic marriages throughout.</p>'},
  {lv:4,q:'A silver denarius shows Augustus on one side and Gaius and Lucius with shields and spears on the other. What was its purpose?',
    a:'To introduce his grandsons to the Empire as “leaders of the youth” and his chosen successors',
    w:['To celebrate the victory at Actium, with the boys shown as the future generals of Rome','To advertise the return of the Parthian standards, which the boys had helped to win',['To mourn their deaths in 2 and 4 CE, with their shields hung up in the Senate house','The coin presents them as living heirs.']],
    hint:'Coins travelled everywhere: what message reached the soldiers and provinces?',
    exp:'<p>The coin publicised Gaius and Lucius as <b>principes iuventutis</b> (“leaders of the youth”), quietly preparing the Empire for a dynastic succession. Coins were mass media, but they show official intentions, not public opinion.</p>'},
],
image:[
  {lv:1,q:'Where was the Res Gestae originally set up?',a:'On bronze pillars outside his Mausoleum',
    w:['Inside the Senate House, read aloud each year','On the walls of the Ara Pacis Augustae','On the base of Trajan’s Column in Rome'],
    hint:'Copies were also put up in the provinces, such as at Ancyra (Ankara).',
    exp:'<p>The <em>Res Gestae</em> was inscribed on <b>bronze pillars at the Mausoleum</b>. The best surviving copy is on the temple of Rome and Augustus at <b>Ancyra</b>, showing how it spread across the Empire.</p>'},
  {lv:3,q:'On the Prima Porta statue, what is the significance of the small Cupid riding a dolphin by Augustus’ leg?',
    a:'It links Augustus to Venus, ancestor of the Julian family through Aeneas',
    w:['It celebrates his naval victory over the pirates of Sextus Pompeius','It shows his love for Livia, whose villa the statue was found in',['It means that the statue originally stood beside the sea at Ostia','Cupid here is the son of Venus, the divine ancestor.']],
    hint:'Cupid is the son of Venus.',
    exp:'<p>Cupid (son of <b>Venus</b>) shows Augustus’ <b>divine ancestry</b> through Aeneas and Iulus. The dolphin may also recall Actium. Together with the bare feet and the idealised Polykleitan body, the statue presents him as more than an ordinary man.</p>'},
  {lv:3,q:'When and why was the Ara Pacis Augustae built?',
    a:'Voted 13 BCE, dedicated 9 BCE, for the peace after his return from Spain and Gaul',
    w:['Voted in 31 BCE and dedicated in 29 BCE, to celebrate the victory over Antony at Actium','Begun in 14 CE and finished in 17 CE, to mark Augustus’ death and deification','Dedicated in 42 BCE, to celebrate the defeat of Brutus and Cassius at Philippi'],
    hint:'Its name means “Altar of Augustan Peace”.',
    exp:'<p>The <b>Ara Pacis</b> celebrated <b>Pax</b> after Augustus’ return in 13 BCE. Its reliefs show the imperial family in procession, religious scenes, the Lupercal and Aeneas sacrificing, and rich acanthus scrolls symbolising abundance.</p>'},
  {lv:4,q:'In <em>Aeneid</em> 8, why does Virgil place the Battle of Actium at the centre of the shield made for Aeneas?',
    a:'To make Actium the climax of Roman history: Augustus and Rome’s gods defeat Egypt',
    w:[['To criticise Augustus for fighting a civil war against fellow Romans and a Roman general','The shield celebrates the victory.'],'Because Aeneas himself fought at Actium in an earlier life, as Anchises reveals in Book 6','To remind readers of Antony’s greatness, since he was Aeneas’ true descendant'],
    hint:'The shield shows the future history of Rome, which Aeneas cannot yet understand.',
    exp:'<p>The shield (<em>Aeneid</em> 8.626–731) turns a <b>civil war</b> into a war against a foreign queen and <b>barbarian gods</b>, with Apollo on Augustus’ side. Aeneas lifts “the fame and fortunes of his descendants” on his shoulder, linking the founder to Augustus. It is court poetry, so think about its purpose.</p>'},
  {lv:4,q:'Augustus closed the gates of the Temple of Janus three times. Why was this good propaganda?',
    a:'The gates closed only in peace, which had happened just twice before',
    w:[['It showed that he had conquered and captured the temple of an enemy god','Janus was a Roman god, not an enemy.'],'It kept the people out of the Forum during riots over grain shortages','It was a public sign of mourning for Julius Caesar on the Ides of March'],
    hint:'Open gates meant war; closed gates meant…',
    exp:'<p>Closing the <b>gates of Janus</b> symbolised <b>peace throughout the empire</b>. Augustus stresses that it had happened only twice before his birth, so his record of three closures presents him as the bringer of the <b>Pax Augusta</b>.</p>'},

  {lv:2,kind:'order',q:'Put these events from Book 2 in order.',
    items:['Laocoön warns the Trojans not to trust the horse','Sinon tricks the Trojans into taking the horse into the city','Hector’s ghost tells Aeneas to flee','Pyrrhus kills Priam at the altar','Aeneas carries Anchises out of Troy and loses Creusa'],
    hint:'Warning, trick, dream, the palace falls, escape.',
    exp:'<p>Laocoön → Sinon → Hector’s ghost → death of Priam → escape with Anchises and Iulus and the loss of Creusa, whose ghost then foretells a new home in Hesperia and a royal bride.</p>'},
  {lv:2,q:'What omen persuades Anchises to leave burning Troy?',
    a:'A harmless flame plays around Iulus’ head, followed by thunder and a shooting star',
    w:['An eagle snatches a snake from the sky and drops it on the palace roof as the city burns','The statue of Athena in the citadel weeps tears of blood as the Greeks break in',['The ghost of Hector appears to him and orders him to take the household gods and flee','Hector appeared to Aeneas, not Anchises.']],
    hint:'It involves Aeneas’ young son.',
    exp:'<p>The flame on <b>Iulus’ head</b> is a sign of divine favour on Aeneas’ line, the future Julian family. Anchises asks for confirmation, and thunder and a shooting star follow. This is <b>pietas</b> in action: the family obeys the gods.</p>'},
  {lv:2,q:'What does Aeneas need before he can enter the Underworld in Book 6?',
    a:'The golden bough, for Proserpina',
    w:['A lock of Dido’s hair, cut by Iris','The shield forged for him by Vulcan','The blood of a sacrificed white bull'],
    hint:'The Sibyl tells him to find something precious in the woods.',
    exp:'<p>The Sibyl at Cumae sends Aeneas to find the <b>golden bough</b>. Two doves sent by Venus guide him to it. Only those chosen by fate can pluck it.</p>'},
  {lv:3,q:'Why is Aeneas’ visit to Evander’s town Pallanteum in Book 8 significant?',
    a:'It stands on the future site of Rome, so Aeneas walks over places Virgil’s readers knew',
    w:['It is where Aeneas finally marries Lavinia and is crowned king of the Latins and Trojans','It is where Aeneas fights and kills Turnus in the duel that ends the whole poem','It stands on the site of Carthage, so Aeneas sees where Dido will later build her city'],
    hint:'Evander shows him the Capitol and the Palatine as they were then.',
    exp:'<p>Evander’s humble settlement lies on the <b>site of Rome</b>. Virgil contrasts its simple huts with the golden Rome of Augustus, linking the founding myth with the present. Evander also entrusts his son <b>Pallas</b> to Aeneas.</p>'},
  {lv:3,q:'How does the <em>Aeneid</em> end?',
    a:'Aeneas sees Pallas’ belt on Turnus and kills him in fury as he begs for mercy',
    w:['Aeneas marries Lavinia and founds the city of Lavinium, with Latins and Trojans united','Aeneas spares Turnus after he begs for mercy, and the two leaders swear peace','Aeneas is carried up to heaven by Venus and becomes a god, watched by his people'],
    hint:'The poem ends suddenly, in the middle of a duel.',
    exp:'<p>Turnus, beaten, asks for mercy, and Aeneas <b>hesitates</b>. Then he sees the <b>belt of Pallas</b> and kills him, “burning with fury”. The poem ends with Turnus’ spirit fleeing to the shades. The ending is much debated: pietas or furor?</p>'},
],
characters:[
  {lv:1,q:'Who is Dido?',a:'The queen who founded Carthage after fleeing Tyre',
    w:[['Aeneas’ first wife, lost during the fall of Troy','That was Creusa.'],'The Latin princess Aeneas is destined to marry','The Sibyl, the prophetess of Apollo at Cumae'],
    hint:'Her husband Sychaeus had been murdered by her brother.',
    exp:'<p><b>Dido</b> fled Tyre after her brother Pygmalion murdered her husband <b>Sychaeus</b>, and she founded <b>Carthage</b>. She is a capable ruler whose love for Aeneas destroys her, and she is one of literature’s great tragic figures.</p>'},
  {lv:2,q:'Who is Turnus?',a:'King of the Rutulians, Lavinia’s suitor',
    w:['King of the Latins and the father of Princess Lavinia','The son of Evander, sent to fight beside Aeneas',['A Trojan warrior who stays behind in Sicily','Turnus is Italian.']],
    hint:'Aeneas’ arrival threatens his marriage.',
    exp:'<p><b>Turnus</b>, king of the <b>Rutulians</b>, expected to marry <b>Lavinia</b>, daughter of King Latinus. Stirred by the Fury Allecto, he leads the war against the Trojans. The Sibyl calls him “another Achilles”.</p>'},
  {lv:2,kind:'match',q:'Match each character to their role.',
    pairs:[['Anchises','Aeneas’ father, who shows him future Romans in the Underworld'],['Pallas','Evander’s son, killed by Turnus'],['Evander','Greek king living on the future site of Rome'],['Iulus (Ascanius)','Aeneas’ son, ancestor of the Julian family'],['Lavinia','Latin princess Aeneas is fated to marry']],
    hint:'One is the source of the Julian name.',
    exp:'<p>These secondary characters carry key themes: <b>Anchises</b> (fathers and the future), <b>Pallas</b> (the cost of war and revenge), <b>Evander</b> (the site of Rome), <b>Iulus</b> (the Julian line) and <b>Lavinia</b> (union with Italy).</p>'},
  {lv:3,q:'How does Dido react when Aeneas meets her in the Underworld in Book 6?',
    a:'She turns away in silence and goes back to her first husband, Sychaeus',
    w:['She forgives him, embraces him and tells him she understands his duty','She curses him and all the Romans again, repeating her dying words','She begs him to take her back with him to Carthage and the world above'],
    hint:'Her response is a powerful silence.',
    exp:'<p>Aeneas weeps and says he left her unwillingly. Dido stays silent “like flint or marble” and returns to <b>Sychaeus</b>. Her silence reverses Book 4, where she pleaded and he stayed unmoved.</p>'},
  {lv:4,q:'Read the source. What does Dido’s curse foreshadow?',
    src:'As she prepares to die, Dido prays that there will never be love or treaty between her people and Aeneas’ descendants, and that an avenger will rise from her bones to pursue the Trojan settlers with fire and sword.',cite:'Virgil, <em>Aeneid</em> 4.622–629 (paraphrased)',
    a:'The Punic Wars and Hannibal, the “avenger”',
    w:['The civil war between Octavian, Antony and Cleopatra',['The war between Aeneas and Turnus in Latium','That is a war in Italy, not with Carthage.'],'The fall of Troy and the death of King Priam'],
    hint:'Who was Rome’s greatest enemy from Carthage?',
    exp:'<p>The curse gives a <b>mythical origin</b> to the <b>Punic Wars</b>, with the avenger Hannibal. It shows how Virgil ties personal tragedy to Roman history and to the price of Rome’s destiny.</p>'},
  {lv:5,q:'“Dido is the real tragic hero of the <em>Aeneid</em>.” Which evidence best supports this view?',
    a:'Virgil makes her a strong queen undone by the gods, dying with pathos',
    w:[['She founded Carthage and built its walls after fleeing from her brother in Tyre','This shows her ability, but not why she is tragic.'],['She marries Aeneas in a formal ceremony with Juno as the goddess of marriage','Whether they were married is disputed; Aeneas denies it.'],['She is mentioned again in Book 6, when Aeneas meets her among the dead','A mention alone is weak evidence.']],
    hint:'Think about how the reader is made to feel about her.',
    exp:'<p>Dido is manipulated by <b>Venus and Cupid</b> and by <b>Juno</b>, loses her reputation and kingdom, and dies by her own hand. Virgil’s <b>sympathy</b> for her is clear. A balanced answer notes that Aeneas suffers too, and that the poem’s structure is built around his mission.</p>'},
],
language:[
  {lv:2,q:'In which metre is the <em>Aeneid</em> written?',a:'Dactylic hexameter, the metre of Homer',
    w:['Iambic trimeter, the metre of tragedy','Elegiac couplets, the metre of love poems','Rhyming prose, the style of Roman oratory'],
    hint:'It is the traditional metre of epic.',
    exp:'<p>Virgil uses <b>dactylic hexameter</b>, the metre of the <em>Iliad</em> and <em>Odyssey</em>, so the <em>Aeneid</em> places itself in the Homeric epic tradition while giving it Roman themes.</p>'},
  {lv:2,q:'Aeneas is often called “pius Aeneas”. What kind of literary device is this?',a:'An epithet, stressing his chief quality',
    w:['A simile, comparing him to a god','A flashback to his life before the war',['Personification of the virtue of duty','Personification gives human qualities to something non-human, such as Rumour.']],
    hint:'Homer does the same with “swift-footed Achilles”.',
    exp:'<p>The <b>epithet</b> “pius” highlights Aeneas’ <b>pietas</b>, his duty to gods, family and country. Virgil sometimes uses it at uncomfortable moments, such as when Aeneas leaves Dido, inviting the reader to question it.</p>'},
  {lv:4,q:'In Book 4 Dido, in love, is compared to a deer wounded by a shepherd who does not know he has hit her. What does the simile suggest?',
    a:'Her love is a fatal wound, and Aeneas, like the shepherd, does not know the harm he caused',
    w:['Dido is a skilled huntress like the goddess Diana, who will catch Aeneas in the end',['Aeneas deliberately sets out to hurt Dido, just as a hunter aims to kill a deer','The shepherd does not know he has hit the deer.'],'Dido will escape her troubles by running away into the mountains of Crete'],
    hint:'Focus on the wound and on the shepherd’s ignorance.',
    exp:'<p>The <b>simile</b> presents Dido as a helpless, wounded victim who wanders in pain, and Aeneas as an unknowing cause. Hunting imagery also foreshadows the hunt and the cave scene later in Book 4.</p>'},
  {lv:4,q:'How does Virgil present Rumour (Fama) in Book 4, and why?',
    a:'As a monster with an eye, tongue and ear under every feather, spreading news of the affair',
    w:['As a kind old woman who protects Dido’s reputation and keeps her secrets from the city','As a messenger sent by Jupiter to bring good news of Aeneas’ future marriage in Italy',['As Aeneas’ guardian spirit, who warns him that his men are plotting to leave','Fama is no friend to Aeneas or Dido.']],
    hint:'It is personification on a grand, grotesque scale.',
    exp:'<p><b>Fama</b> is vividly <b>personified</b> as a growing monster. She spreads the news of Dido and Aeneas, which reaches <b>Iarbas</b>, whose prayer prompts Jupiter to send Mercury. Her grotesqueness reflects the destruction of Dido’s reputation.</p>'},
  {lv:4,q:'After Dido’s and Anna’s pleas, Aeneas is compared to an oak tree battered by winds but standing firm. What does this suggest?',
    a:'He is deeply shaken, but his mind stays fixed on his duty',
    w:['He feels nothing for Dido at all and is not moved by any of her words','He decides to stay in Carthage after all, rooted there like the tree','He is like a tree that will soon fall, so his resolve will break'],
    hint:'An oak’s roots go down as deep as its branches go up.',
    exp:'<p>The <b>oak simile</b> (4.441–449) shows Aeneas’ <b>steadfastness</b> in pietas while he suffers inside. Whose tears are “in vain”, his or Dido’s, is ambiguous, a nice point for analysis.</p>'},
],
values:[
  {lv:1,q:'What does the Roman value <em>pietas</em> mean?',a:'Duty to the gods, family and country',
    w:['Pity and mercy for the defeated in war','Courage and skill in battle against enemies','Love and loyalty between a husband and wife'],
    hint:'It is Aeneas’ defining quality.',
    exp:'<p><b>Pietas</b> is dutiful devotion to gods, family (Anchises, Iulus) and country (the mission to found Rome). It is the central Roman virtue of the poem, and Augustus also claimed it (it was listed on his golden shield).</p>'},
  {lv:3,q:'How does Aeneas’ departure from Carthage show pietas?',
    a:'He puts his duty to the gods and his son’s future ahead of his love for Dido',
    w:['He leaves because he no longer loves Dido and wants to marry an Italian princess','He leaves to escape from Iarbas, who is gathering an army to attack Carthage','He leaves because Dido orders him out of the city after their bitter quarrel'],
    hint:'Mercury reminds him about someone else’s future kingdom.',
    exp:'<p>Mercury reminds Aeneas of his destiny and of <b>Iulus’ rights</b> to Italy. Aeneas obeys, saying “I do not seek Italy of my own free will”. His pietas costs him and Dido dearly, and the episode shows both the greatness and the pain of duty.</p>'},
  {lv:4,q:'After Pallas’ death in Book 10, Aeneas goes on a rampage, even taking eight young men alive to sacrifice at Pallas’ pyre. What does this show?',
    a:'Grief and furor overwhelm him, showing war’s brutality, though he later pities Lausus',
    w:['Aeneas stays calm and merciful in war, killing only those who refuse to surrender','Aeneas is carrying out a direct command from Jupiter to punish the Rutulians','Aeneas wants to impress Lavinia by proving himself the greatest warrior in Italy'],
    hint:'Furor is the opposite of controlled pietas.',
    exp:'<p>Aeneas’ <b>furor</b> here is Achilles-like (Achilles too sacrificed captives for Patroclus). Virgil shows the cost of war. Yet when Aeneas kills young <b>Lausus</b> he feels pity, thinking of his own father, a sign of his humanity.</p>'},
  {lv:5,q:'“Aeneas’ killing of Turnus is an act of furor, not pietas.” Which evidence best supports this view?',
    a:'He is “on fire with fury” and kills a suppliant, against Anchises',
    w:[['Turnus had broken the sworn truce, so Aeneas had every right to punish him','This could justify the killing, so it weakens the view.'],['Aeneas had promised Evander to protect Pallas and avenge him if he died','This supports pietas (duty to Evander).'],['Jupiter had already decreed that Turnus must die, as the scales showed','This makes the killing fated, not driven by furor.']],
    hint:'Look at the language of the final lines, and recall Book 6.',
    exp:'<p>The final lines stress Aeneas’ <b>anger</b>, and Anchises had urged <b>parcere subiectis</b>, “spare the conquered”. But there is a strong case for pietas: revenge for Pallas, duty to Evander, and fate. The best essays argue both sides.</p>'},
  {lv:5,q:'Which is the best judgement on whether Aeneas is a Homeric hero?',
    a:'He shares Homeric courage and divine birth, but is driven by pietas, not personal glory',
    w:[['He is exactly like Achilles in every way, fighting only for his own glory and honour','He is driven by duty, not personal kleos.'],['He is not a warrior at all, but a priest who avoids fighting whenever he can','He fights brilliantly in Books 10 and 12.'],'He is exactly like Odysseus, seeking only to return to his home and his wife'],
    hint:'Compare the motivation for kleos with the motivation for duty.',
    exp:'<p>Aeneas is a <b>new kind of hero</b>: he keeps Homeric prowess but puts duty and community first, and often suffers for it. His furor at the end shows Homeric traits returning. Good answers use Homeric comparisons, such as Hector’s farewell or Achilles’ revenge.</p>'},
],
gods:[
  {lv:1,q:'Which goddess hates the Trojans and keeps trying to stop Aeneas?',a:'Juno',
    w:[['Venus','Venus is Aeneas’ mother and protector.'],'Minerva','Diana'],
    hint:'She is Jupiter’s wife, and Carthage is her favourite city.',
    exp:'<p><b>Juno</b> drives much of the plot: the storm in Book 1, the “marriage” in the cave in Book 4, and the war in Book 7 (through Allecto). Her anger (<em>ira</em>) is announced in the very first lines.</p>'},
  {lv:2,q:'Why does Juno hate the Trojans?',
    a:'Paris’ Judgement, and Rome’s fated defeat of Carthage',
    w:['Because Aeneas stole treasure from her temple at Carthage','Because the Trojans refused to worship her during the war','Because Dido begged her to punish Aeneas for leaving'],
    hint:'There is a past grievance and a future fear.',
    exp:'<p>Juno remembers the <b>Judgement of Paris</b> (Paris chose Venus) and <b>Ganymede</b> (taken to Olympus), and she knows that <b>Carthage</b> will fall to Rome. Her opposition delays fate but cannot stop it.</p>'},
  {lv:2,q:'Who is Aeneas’ divine mother?',a:'Venus',
    w:['Juno','Minerva','Thetis'],
    hint:'She is also the divine ancestor claimed by the Julian family.',
    exp:'<p>Aeneas is the son of <b>Venus</b> and Anchises. Through Iulus, Julius Caesar and Augustus claimed descent from Venus, which links the epic directly to the ruling family.</p>'},
  {lv:3,q:'Why does Jupiter send Mercury to Aeneas in Carthage?',
    a:'After Iarbas complains, Jupiter orders Aeneas to leave for Italy',
    w:['To tell Aeneas to marry Dido and unite the Trojans and Carthaginians for ever',['To warn Aeneas that Turnus is gathering an army against him in Italy','Turnus’ war comes later, in Book 7.'],['To give him the golden bough that he needs to enter the Underworld','The Sibyl sends him for the bough in Book 6.']],
    hint:'A jealous rejected suitor prays to his father, Jupiter.',
    exp:'<p><b>Iarbas</b>, a rejected suitor, prays to Jupiter. Jupiter sends <b>Mercury</b> to remind Aeneas of Italy and Iulus’ inheritance. The gods intervene directly, but Aeneas still has to choose to obey.</p>'},
  {lv:4,q:'In Book 12, Juno finally agrees to stop opposing the Trojans. What condition does she set?',
    a:'The Latins keep their name, language and customs, and the Trojans merge into them',
    w:['Carthage must be protected for ever, and Rome must never make war on it','Aeneas must give up the throne to Turnus and rule only the Trojan settlers','Rome must build her a temple bigger than Jupiter’s on the Capitoline hill'],
    hint:'It is about who the future Romans will be.',
    exp:'<p>Juno’s condition makes the future Romans <b>Italian in name, language and dress</b>, with Trojan blood. This suits the Augustan ideal of a united Italy, which was important after the civil wars.</p>'},
  {lv:5,q:'“In the <em>Aeneid</em>, the gods control everything.” Which is the strongest counter-argument?',
    a:'Fate fixes the end, but characters still choose and suffer',
    w:[['Jupiter never appears in the poem, so the gods cannot really be in control','He appears several times.'],['The gods only appear in Book 1, and after that the humans act alone','They act throughout.'],['Humans control everything, but the gods give advice','The gods intervene constantly.']],
    hint:'Separate fate (the outcome) from how people reach it.',
    exp:'<p>The gods shape events, but the poem still shows <b>human responsibility and emotion</b>. Characters choose, and they suffer. A balanced answer recognises that divine machinery frames, but does not replace, human tragedy.</p>'},
],
augustan:[
  {lv:1,q:'During whose rule did Virgil write the <em>Aeneid</em>?',a:'Augustus',
    w:['Julius Caesar','Nero','Trajan'],
    hint:'Virgil wrote it between about 29 and 19 BCE.',
    exp:'<p>Virgil wrote the <em>Aeneid</em> under <b>Augustus</b>, with the support of Augustus’ adviser <b>Maecenas</b>. The poem links Rome’s legendary founder to the new ruler.</p>'},
  {lv:2,q:'What happened to the <em>Aeneid</em> when Virgil died in 19 BCE?',
    a:'Virgil wanted it burned, but Augustus had it published',
    w:['It was lost for centuries and rediscovered in a library at Alexandria','Augustus banned it because of its criticism of the imperial family','Virgil’s son finished the last six books and published it under his name'],
    hint:'Some lines are still incomplete.',
    exp:'<p>Virgil died before revising the poem, and he asked for it to be <b>burned</b>. <b>Augustus</b> had his friends Varius and Tucca publish it. The unfinished half-lines show it was not quite complete.</p>'},
  {lv:3,q:'In the parade of heroes in Book 6, what does Anchises say about Augustus?',
    a:'He is a god’s son who will restore the Golden Age and extend the empire',
    w:['He will be murdered on the Ides of March by senators who fear his power','He will lose three legions in Germany and never recover from the disaster','He will never rule Rome, because the gods have given the city to Marcellus'],
    hint:'Julius Caesar was deified, which made Augustus “son of a god”.',
    exp:'<p>Anchises presents <b>Augustus Caesar, son of a god</b> (divi filius), restoring the <b>Golden Age</b> in Latium and ruling beyond the Garamantes and the Indians. It is direct praise of the emperor, set inside a prophecy.</p>'},
  {lv:4,q:'Read the source. What does it present as Rome’s special mission?',
    src:'Others will cast bronze more finely and carve living faces from marble; they will plead cases better and chart the stars. Remember, Roman, that your skill is to rule the peoples, to add peace to that rule, to spare the conquered and to war down the proud.',cite:'Virgil, <em>Aeneid</em> 6.847–853 (paraphrased)',
    a:'Ruling the world well, with peace and justice, rather than excelling in the arts',
    w:['Becoming the finest artists and sculptors in the world, better than the Greeks','Conquering every nation without mercy, so that no enemy could ever rise again','Studying astronomy and philosophy, and teaching them to the conquered peoples'],
    hint:'“Others” (the Greeks) will do some things better.',
    exp:'<p>Anchises sets out Rome’s <b>imperial mission</b>: to rule, to bring <b>peace</b>, and to <b>spare the conquered</b>. That last phrase becomes vital when you judge Aeneas’ killing of the suppliant Turnus at the end.</p>'},
  {lv:4,q:'Why does the parade of heroes in Book 6 end with a lament for the young Marcellus?',
    a:'Marcellus, Augustus’ heir, died in 23 BCE, so the lament adds grief and honours the family',
    w:['Marcellus was Aeneas’ friend who died at Troy, and Anchises remembers him with sorrow','Marcellus was Rome’s first king, and his death ended the line of Romulus','Marcellus killed Turnus in a later war, and Anchises mourns the cost of victory'],
    hint:'Ancient tradition says Octavia fainted when Virgil read it.',
    exp:'<p>The parade’s triumphant tone ends in <b>sorrow</b> for <b>Marcellus</b>, Augustus’ intended successor. It honours the family but also shows the human cost behind Rome’s glory, typical of Virgil’s mixed tone.</p>'},
  {lv:5,q:'“The <em>Aeneid</em> is simply Augustan propaganda.” Which is the strongest counter-argument?',
    a:'Virgil also shows the terrible cost of Rome’s founding, so it questions',
    w:[['Augustus is never mentioned in the poem, so it cannot be propaganda for him','He appears in Books 1, 6 and 8.'],['Virgil was not a Roman citizen, so he had no reason to praise the emperor','He was.'],['The poem is about Greek heroes only and has nothing to do with Rome','Its hero is the Trojan ancestor of the Romans.']],
    hint:'Look for sadness and loss rather than glory.',
    exp:'<p>The poem clearly <b>celebrates</b> Augustus (the parade, the shield), but it also stresses <b>suffering</b> and moral ambiguity. Aeneas even leaves the Underworld by the <b>ivory gate</b>, through which false dreams pass. Strong answers argue that the poem is both praise and a meditation on the cost of empire.</p>'},
],
});

  {lv:4,q:'Read the source. How does Dido see herself as she prepares to die?',

language:[

values:[

    hint:'Three generations together.',
    exp:'<p>The image of <b>pius Aeneas</b> carrying the past (Anchises, the household gods) and leading the future (Iulus) became an emblem of Roman duty, shown in the Forum of Augustus.</p>'},

    exp:'<p>Aeneas’ mission demands constant <b>sacrifice</b>, a key point for essays on the hero and on the costs of empire.</p>'},
],
