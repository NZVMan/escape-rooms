<script>/* js/courses/cie-9274/architecture.js */
/* Paper 2 Topic C: Architecture of the Roman City (Rome, Ostia, Pompeii, Herculaneum and listed buildings) */
ER.bank('architecture',{
techniques:[
  {lv:1,q:'What is the wedge-shaped stone at the very top of an arch called?',a:'The keystone',
    w:[['The lintel','A lintel is the horizontal beam in post-and-lintel building.'],'The capital','The podium'],
    hint:'It locks the other wedge-shaped stones (voussoirs) in place.',
    exp:'<p>An arch is made of wedge-shaped <b>voussoirs</b> locked by the <b>keystone</b>. The arch carries weight down and outwards, so it can span wider gaps than a stone lintel.</p>'},
  {lv:2,q:'Which ingredient made Roman concrete so strong that it could even set underwater?',a:'Pozzolana, a volcanic ash',
    w:['Crushed marble','Iron filings','Sand from the Nile'],
    hint:'It is named after Puteoli, near Vesuvius.',
    exp:'<p>Lime mortar mixed with <b>pozzolana</b> (volcanic ash) and rubble (caementa) made <b>opus caementicium</b>. It allowed huge vaults and domes, and harbour works such as those at Ostia.</p>'},
  {lv:2,kind:'match',q:'Match each type of wall facing to its description.',
    pairs:[['Opus incertum','Irregular small stones'],['Opus reticulatum','Square stones set diagonally like a net'],['Opus latericium','Brick facing over a concrete core'],['Opus craticium','Timber frame filled with rubble']],
    hint:'“Reticulum” means a net; “later” means brick; “cratis” means wickerwork.',
    exp:'<p>Facings covered concrete cores: <b>incertum</b> (irregular), <b>reticulatum</b> (net pattern), <b>latericium</b> (brick, very common in Ostia), and <b>craticium</b> (cheap timber frame, as in the House of Opus Craticium at Herculaneum).</p>'},
  {lv:3,q:'What is a groin (cross) vault?',a:'Two barrel vaults crossing at right angles',
    w:['A single continuous half-cylinder roof over a long hall','A flat timber ceiling supported on rows of columns','A dome with a circular opening at the very top'],
    hint:'It is formed where two tunnels meet.',
    exp:'<p>A <b>barrel vault</b> is a continuous arch. A <b>groin vault</b> is two barrel vaults intersecting, which concentrates the load on the corners and allows windows in the sides. The Basilica of Maxentius and the Baths of Caracalla used huge groin vaults.</p>'},
  {lv:3,q:'Why could Romans build larger spaces with arches and vaults than the Greeks could with post and lintel?',
    a:'Arches carry the load down and outwards, so they span gaps that would crack a lintel',
    w:['Romans quarried much stronger marble than the Greeks, so their stone beams could be twice as long','Arches need no foundations at all, so they could be built quickly on any kind of ground','Greek law banned large public buildings, while Roman law encouraged emperors to build them'],
    hint:'Think about what happens to a long stone beam under its own weight.',
    exp:'<p>Stone is weak in <b>tension</b>, so lintels must be short. Arches (and vaults and domes) keep the stone in <b>compression</b>, so they can span far wider spaces. Combined with concrete, this produced Rome’s great interiors.</p>'},
  {lv:3,q:'How did the builders reduce the weight of the Pantheon’s dome?',
    a:'Coffers, lighter volcanic stone higher up, and a thinner shell around the oculus',
    w:['They built the upper part in wood and painted it to look like stone, hiding the joins with gilding','They hung the dome from iron chains fixed to a frame of beams above the roof','They supported it with a hidden forest of columns inside the walls of the rotunda'],
    hint:'There are three clever tricks, and one is the hole at the top.',
    exp:'<p>The dome (about 43 m across) uses <b>coffering</b>, aggregates graded from heavy to light (ending in <b>pumice</b>), thinner walls towards the top, and the <b>oculus</b>. It remained the largest unreinforced concrete dome in the world for centuries.</p>'},
],
public:[
  {lv:1,q:'What was a basilica used for in a Roman town?',a:'Law courts and business',
    w:['Christian worship only, from the start',['Bathing','That was the job of the baths (thermae).'],'Chariot racing'],
    hint:'It was usually next to the forum.',
    exp:'<p>The <b>basilica</b> was a large roofed hall by the forum for <b>legal cases and commerce</b>. Christians later adopted the shape for churches. Trajan’s Basilica Ulpia and the Basilica of Maxentius are examples.</p>'},
  {lv:1,q:'What does the Arch of Titus in Rome celebrate?',a:'The capture of Jerusalem in 70 CE',
    w:['The conquest of Dacia in 106 CE','The Battle of Actium in 31 BCE','Victory at the Milvian Bridge in 312 CE'],
    hint:'One relief shows the menorah being carried in triumph.',
    exp:'<p>The single-bay <b>Arch of Titus</b> (after 81 CE, under Domitian) shows the triumph after the <b>sack of Jerusalem</b>, with spoils from the Temple, including the menorah, and Titus’ apotheosis in the vault. Arches combined architecture with political propaganda.</p>'},
  {lv:2,q:'Who was the architect of Trajan’s Forum?',a:'Apollodorus of Damascus',
    w:['Vitruvius','Rabirius','Agrippa'],
    hint:'He was from Syria, and he also built Trajan’s bridge over the Danube.',
    exp:'<p><b>Apollodorus of Damascus</b> designed the Forum of Trajan (dedicated 112 CE), with the Basilica Ulpia, libraries and Trajan’s Column, alongside the brick-faced Markets on the slope of the Quirinal.</p>'},
  {lv:2,q:'What was the Piazzale of the Corporations at Ostia?',
    a:'A colonnade of traders’ and shippers’ offices, whose mosaics showed their home ports',
    w:['The headquarters of Ostia’s fire brigade, with barracks around a central courtyard','A temple of Mithras built in the basement of a large apartment block','A huge public bath complex with mosaics of sea creatures in the cold rooms'],
    hint:'The mosaics show ships, lighthouses and the names of ports.',
    exp:'<p>The <b>Piazzale delle Corporazioni</b> had about 60 small offices of merchants and shippers, with <b>mosaics</b> advertising their home ports (for example in Africa and Gaul). It is evidence of Ostia’s role in Rome’s food supply and trade.</p>'},
  {lv:3,q:'Why is the Arch of Constantine (315 CE) significant in architectural history?',
    a:'It reuses sculpture from monuments of Trajan, Hadrian and Marcus Aurelius',
    w:['It was the first triumphal arch ever built in Rome, and set the model for all later arches','It has no sculpture at all, because Constantine wanted a plain, Christian monument','It celebrates the capture of Jerusalem, with reliefs of the menorah carried in triumph'],
    hint:'Some of the emperors’ heads were re-carved as Constantine.',
    exp:'<p>The arch celebrates Constantine’s victory at the <b>Milvian Bridge</b> (312 CE). Its reuse of “good emperor” sculpture (<b>spolia</b>) linked Constantine with earlier great emperors. Some see it as a decline in craft, others as deliberate ideology.</p>'},
  {lv:4,q:'Why was the Basilica of Maxentius and Constantine innovative?',
    a:'It roofed a basilica with huge concrete groin vaults instead of timber',
    w:['It was the first building in Rome to be made entirely of solid marble blocks',['It had no roof at all, so that the law courts could meet in the open air','It had one of the greatest vaulted roofs in Rome.'],'It was built entirely of timber, so it could be put up in a single year'],
    hint:'Compare it with the frigidarium of a great bath complex.',
    exp:'<p>Earlier basilicas had <b>timber roofs</b> over colonnades. This one used <b>three huge groin vaults</b> over the nave, supported on massive piers, bringing bath-hall engineering to civic architecture.</p>'},
],
leisure:[
  {lv:1,q:'Which emperor began building the Colosseum?',a:'Vespasian',
    w:[['Nero','The Colosseum was built on the site of the lake of Nero’s Golden House.'],['Titus','Titus opened it in 80 CE.'],'Augustus'],
    hint:'He founded the Flavian dynasty.',
    exp:'<p><b>Vespasian</b> began the <b>Flavian Amphitheatre</b> about 70–72 CE, <b>Titus</b> opened it in 80 CE, and <b>Domitian</b> completed it (including the hypogeum). It held perhaps 50,000 spectators.</p>'},
  {lv:2,kind:'year',q:'In which year was the Colosseum officially opened by Titus with 100 days of games?',year:80,era:'CE',
    hint:'It was a year after the eruption of Vesuvius.',
    exp:'<p>Titus opened the Colosseum in <b>80 CE</b> with 100 days of games. That was one year after Vesuvius buried Pompeii and Herculaneum (79 CE).</p>'},
  {lv:2,q:'What happened at the amphitheatre in Pompeii in 59 CE?',
    a:'A riot between Pompeians and Nucerians, after which games were banned for ten years',
    w:['It was destroyed by an earthquake and never rebuilt before the eruption of Vesuvius','The emperor Nero performed there as a singer and won every prize','It was turned into a Christian church after the local magistrates converted'],
    hint:'A wall painting from Pompeii shows the fighting.',
    exp:'<p>Tacitus (<em>Annals</em> 14.17) records the <b>riot</b> and the Senate’s <b>ten-year ban</b>, and a fresco shows the scene. The amphitheatre (about 70 BCE) is the earliest surviving stone amphitheatre, paid for by local magistrates.</p>'},
  {lv:2,kind:'order',q:'Put these rooms of a Roman bath in a typical bather’s order.',
    items:['Apodyterium (changing room)','Tepidarium (warm room)','Caldarium (hot room)','Frigidarium (cold plunge)'],
    hint:'Change, warm up, get hot, then cool off.',
    exp:'<p>A common route was <b>apodyterium → tepidarium → caldarium → frigidarium</b>, though orders varied. Exercise in the <b>palaestra</b> often came first, as in the Stabian Baths at Pompeii.</p>'},
  {lv:3,q:'How were Roman baths heated?',
    a:'By a hypocaust: furnace heat flowed under raised floors and up hollow wall tiles',
    w:['By open fires in the middle of each room, with smoke escaping through the roof','By natural hot springs only, so baths could be built only near volcanoes','By rows of oil lamps along the walls, kept burning by slaves day and night'],
    hint:'“Hypocaust” means “heat from below”.',

  {lv:3,q:'Why is the Theatre of Marcellus important in the development of Roman architecture?',

society:[
  {lv:1,q:'Who were the helots?',a:'State-owned serfs, many of them Messenians, who farmed for the Spartiates',
    w:[['Free non-citizens living in the towns around Laconia, who traded and made goods','They were the perioikoi.'],['Foreigners living in Athens who paid a tax but could not vote or own land','They were the metics.'],'Spartan boys aged seven to eighteen in the state training system'],
    hint:'Fear of their revolt shaped Spartan society.',
    exp:'<p>The <b>helots</b> worked the land so that Spartiates could train full-time. Their great revolt after the earthquake of about 464 BCE, and the constant fear of revolt, influenced Spartan caution abroad and harsh practices such as the <em>krypteia</em>.</p>'},
  {lv:1,q:'Who were the metics in Athens?',a:'Free foreigners in Athens who paid a special tax but had no political rights',
    w:['Slaves who worked in the silver mines at Laurion, owned by the state','Athenian citizens who had settled abroad in colonies around the Aegean','Spartan prisoners of war held in Athens after the battle at Sphacteria'],
    hint:'They needed a citizen sponsor (prostates).',
    exp:'<p><b>Metics</b> paid the <em>metoikion</em> tax, served in the army and navy, and were vital to trade and crafts, but had <b>no political rights</b>. Lysistrata includes them in her “wool” vision of a united city.</p>'},
  {lv:2,q:'What did Pericles’ citizenship law of 451/0 BCE require?',a:'To be a citizen, both your father and your mother had to be Athenian',

    hint:'It made the citizen body more exclusive.',
    exp:'<p>The law (Aristotle, <em>Athenian Constitution</em> 26) restricted citizenship to children of <b>two Athenian parents</b>. It raised the status of Athenian women as mothers of citizens and made citizenship a more valuable privilege.</p>'},
  {lv:2,q:'Which was a key difference between Spartan and Athenian citizen women?',
    a:'Spartan women exercised, managed property and were less secluded',
    w:['Spartan women could vote in the assembly, while Athenian women could not','Athenian women trained as soldiers, while Spartan women stayed indoors','Athenian women owned most of the land, while Spartan women owned none'],
    hint:'Think about what Athenians found shocking about Sparta.',
    exp:'<p>Spartan women had <b>physical training</b> and more economic power, because the men were often away or in the messes. Athenian sources found this shocking. Athenian citizen women were ideally kept at home under a <em>kyrios</em> (male guardian).</p>'},
  {lv:4,q:'Read the source. What attitude does the writer show, and what does it reveal?',
    src:'In Athens you are not allowed to strike a slave, and a slave will not step aside for you. The reason is that the common people dress no better than slaves or metics, so you might hit a citizen by mistake.',cite:'The Old Oligarch, <em>Constitution of the Athenians</em> 1.10 (paraphrased)',
    a:'Hostility to democracy, which accidentally shows how free slaves and metics were',
    w:['Admiration for the way Athens treated its slaves, compared with the harsh Spartans','A Spartan’s description of the helots and how they were kept under control','A law code listing the punishments masters could legally give to their slaves'],
    hint:'The writer dislikes the situation he describes.',
    exp:'<p>The <b>Old Oligarch</b> resents the democracy, but his complaint is useful evidence: in naval Athens slaves and metics mixed with poorer citizens and were hard to tell apart. Always consider an author’s <b>bias</b> and what he reveals without meaning to.</p>'},
  {lv:4,q:'In the Funeral Oration, Pericles tells widows that their greatest glory is to be talked about as little as possible by men, whether for praise or blame. What does this show?',
    a:'The ideal that respectable citizen women should be invisible',
    w:['That Athenian women had equal political rights with men in the city','That women were not allowed to attend public funerals in Athens','That Pericles wanted women to serve in the army in time of war'],
    hint:'Notice “as little as possible”.',
    exp:'<p>Thucydides 2.45 reflects the ideal of <b>seclusion</b> for citizen women. It is a short, formal ideal, not a description of reality. Compare it with women’s religious roles and with comedies like <em>Lysistrata</em>.</p>'},
  {lv:5,q:'Plutarch records that Gorgo, asked why only Spartan women rule their men, replied that only Spartan women give birth to men. How far is this useful evidence?',
    a:'It shows Sparta’s image, but is a late, idealising anecdote',
    w:[['It is completely reliable, because Gorgo wrote the saying down herself','It is a saying reported by Plutarch, centuries later.'],['It is useless, because Gorgo never existed and was invented by Plutarch','Herodotus also mentions Gorgo.'],['It is a contemporary record, but it shows only Athenian views','It is a late anecdote about Sparta.']],
    hint:'Who recorded it, when, and why?',
    exp:'<p>The <em>Sayings of Spartan Women</em> are <b>apophthegms</b> collected around 100 CE, shaped to show Spartan virtue. They show the <b>image</b> of Spartan women, which fits Herodotus’ clever Gorgo, but they need careful handling.</p>'},

politics:[
  {lv:1,q:'How many members were in the Athenian Council (boulé)?',a:'500',

    hint:'Fifty from each of the ten tribes.',
    exp:'<p>The <b>boulé of 500</b> (50 from each of the 10 tribes, chosen by lot) prepared business for the assembly and ran day-to-day affairs, with each tribe’s 50 serving in turn as <em>prytaneis</em>.</p>'},
  {lv:2,kind:'match',q:'Match each Athenian institution to its role.',
    pairs:[['Ecclesia','Assembly of all adult male citizens that voted on laws and war'],['Boulé','Council of 500 that prepared business for the assembly'],['Strategoi','Ten elected generals, who could be re-elected'],['Archons','Nine magistrates chosen by lot after 487 BCE']],
    hint:'Which officials were elected rather than chosen by lot?',
    exp:'<p>Most offices were filled by <b>lot</b>, but the <b>strategoi</b> were <b>elected</b> and could be re-elected. That is why men like Pericles, Cleon and Nicias could exercise long-term influence.</p>'},
  {lv:2,kind:'match',q:'Match each part of the Spartan system to its description.',
    pairs:[['Kings','Two hereditary rulers who led the army'],['Gerousia','Council of 28 elders over 60, plus the kings'],['Ephors','Five officials elected each year'],['Assembly (apella)','Spartiates who voted by shouting']],
    hint:'Sparta had a dual monarchy.',
    exp:'<p>Sparta had a <b>mixed constitution</b>: two <b>kings</b> (Agiad and Eurypontid), the <b>gerousia</b>, five powerful <b>ephors</b>, and an <b>assembly</b> that voted by acclamation.</p>'},
  {lv:2,q:'How did ostracism work in Athens?',
    a:'Citizens wrote a name on potsherds; the man with most votes was exiled for ten years',
    w:['The Council of 500 voted to execute a politician who threatened the democracy','Generals who lost battles were tried in the law courts and fined heavily','The ephors exiled one of the kings each year to stop him growing too powerful'],
    hint:'An ostrakon is a piece of broken pottery.',
    exp:'<p><b>Ostracism</b> (needing about 6,000 votes) removed a man for <b>ten years</b> without loss of property or citizenship. Victims included Aristides, Themistocles and Cimon. It was used for the last time on Hyperbolus (about 416 BCE).</p>'},
  {lv:3,q:'What did Ephialtes’ reforms of 462/1 BCE do?',
    a:'They stripped the Areopagus of most powers, giving them to popular bodies',
    w:['They abolished ostracism, after it had been used against too many leading men','They created the Delian League and moved its treasury from Delos to Athens','They made all offices elected, ending the use of the lot for choosing officials'],
    hint:'It was a major step towards radical democracy, and Ephialtes was murdered soon after.',
    exp:'<p>Ephialtes (with Pericles’ support) moved the Areopagus’ supervisory powers to <b>popular bodies</b>. This happened while <b>Cimon</b>, the pro-Spartan leader, was away helping Sparta at Ithome.</p>'},
  {lv:3,q:'Why was Pericles able to dominate Athenian politics for so long?',
    a:'He was re-elected general year after year and was a trusted, persuasive speaker',
    w:['The assembly appointed him king for life after his victories against Persia','He was chosen as chief archon for life, with the power to veto any law','He commanded the Spartan army as well as the Athenian navy after 446 BCE'],
    hint:'Which office was not chosen by lot?',
    exp:'<p>Pericles’ power came from <b>repeated election as strategos</b>, his <b>oratory</b> and his reputation for incorruptibility. Thucydides calls the result democracy in name but rule by the first man in practice.</p>'},
  {lv:4,q:'Thucydides says that under Pericles Athens was a democracy in name but in fact rule by its first citizen. What does this suggest, and what is the limitation?',

    hint:'Consider Thucydides’ purpose in 2.65.',
    exp:'<p>Thucydides 2.65 praises Pericles’ judgement and contrasts him with the <b>demagogues</b> who followed (such as Cleon). It is valuable analysis from a contemporary, but it is an <b>admirer’s</b> verdict.</p>'},
  {lv:4,q:'In 432 BCE the ephor Sthenelaidas, after a short speech for war, said he could not tell which shout was louder and made the Spartans vote by moving to different sides. Why?',

    w:['Spartans were not allowed to vote by shouting under the laws of Lycurgus','The kings had ordered him to do it, to delay the decision for war','He secretly wanted to vote for peace and hoped the division would show it'],
    hint:'Who wants to be seen voting against war in Sparta?',
    exp:'<p>Thucydides 1.86–87 shows <b>Sthenelaidas</b> overriding the cautious king <b>Archidamus</b>. The public division made opposition visible, so a large majority voted that Athens had broken the treaty. It shows the influence of individuals on Spartan decision-making.</p>'},

  {lv:4,q:'Read the source. What does this episode suggest?',

<script>/* js/courses/cie-9274/tragedy.js */
/* Paper 4 Topic A: Greek Tragedy (Aeschylus, Agamemnon; Sophocles, Antigone; Euripides, Medea and Electra) */
ER.bank('tragedy',{
nature:[
  {lv:1,q:'At which Athenian festival were tragedies chiefly performed in competition?',a:'The City (Great) Dionysia',
    w:['The Panathenaia','The Olympic Games',['The Thesmophoria','The Thesmophoria was a women’s festival of Demeter.']],
    hint:'It honoured the god of theatre each spring.',
    exp:'<p>At the <b>City Dionysia</b> three tragedians each presented three tragedies and a satyr play. A wealthy <em>choregos</em> paid for each chorus, and judges awarded prizes. Tragedy was a <b>religious and civic</b> event.</p>'},
  {lv:1,q:'What was the largest number of speaking actors normally used in a Greek tragedy?',a:'Three',
    w:[['Two','Aeschylus added the second actor; Sophocles added the third.'],'One','Fifteen'],
    hint:'Each actor could play several roles by changing masks.',
    exp:'<p>Aristotle says Aeschylus added a <b>second</b> actor and Sophocles a <b>third</b>. All actors were men and played several roles in masks, so doubling of parts was normal.</p>'},
  {lv:2,q:'What was the ekkyklema?',
    a:'A wheeled platform that revealed indoor scenes, such as bodies',
    w:[['A crane that lifted actors playing gods high above the stage building','That is the mechane.'],'The circular dancing floor where the chorus sang and danced its odes','The painted masks worn by actors, changed between scenes for each role'],
    hint:'Violence happened indoors, offstage.',
    exp:'<p>The <b>ekkyklema</b> showed the <b>results</b> of offstage violence, such as Clytemnestra standing over her victims. It created a powerful tableau without breaking the convention of offstage killing.</p>'},
  {lv:2,q:'In <em>Medea</em>, how was Medea’s escape at the end probably staged?',
    a:'On the mechane, high above, in the Sun god’s chariot',
    w:['Through a trapdoor in the stage, as if sinking into the Underworld','On a ship rowed across the orchestra by members of the chorus','On the ekkyklema, rolled out of the palace doors with the bodies'],
    hint:'She appears above Jason, out of his reach.',
    exp:'<p>The <b>mechane</b> placed Medea in the <b>chariot of Helios</b>, her grandfather, high above Jason. It shows her new, almost divine power, a shocking twist on the deus ex machina.</p>'},
  {lv:2,kind:'match',q:'Match each part of a tragedy to its description.',
    pairs:[['Prologue','Opening scene before the chorus enters'],['Parodos','Entry song of the chorus'],['Episode','Scene of dialogue between choral songs'],['Stasimon','Choral ode sung in the orchestra'],['Exodos','Final scene of the play']],
    hint:'“Parodos” means the way in; “exodos” the way out.',
    exp:'<p>Tragedy alternates <b>episodes</b> (actors) with <b>stasima</b> (chorus). The chorus enters in the <b>parodos</b>, and the play ends with the <b>exodos</b>.</p>'},
  {lv:4,q:'Why were violent deaths usually reported by a messenger rather than shown on stage?',
    a:'It was a convention, and a vivid speech lets the audience imagine it',
    w:['Stage weapons had not yet been invented, so fights could not be acted out','Athenian law did not allow actors to fall down or pretend to die in public','The chorus always refused to watch violence, so it had to happen elsewhere'],
    hint:'Think of the deaths of the princess and Creon in <em>Medea</em>.',
    exp:'<p><b>Messenger speeches</b> (Creon and the princess in <em>Medea</em>; Aegisthus in <em>Electra</em>; Haemon and Antigone in <em>Antigone</em>) are set pieces of vivid narrative. The audience’s imagination often outdoes what staging could show.</p>'},
  {lv:3,q:'Why did tragic actors wear masks?',
    a:'So a few men could play many roles, including women, in a vast theatre',
    w:['To hide their identity from the authorities, as acting was dishonourable','Because acting itself was illegal unless the actor’s face was covered','To protect their faces from the strong sun during the long festival days'],
    hint:'Three actors, many characters.',
    exp:'<p><b>Masks</b> made doubling and female roles possible and were visible from far away. They also linked theatre to the worship of <b>Dionysus</b>.</p>'},
],
aristotle:[
  {lv:2,kind:'match',q:'Match each term from Aristotle’s theory of tragedy to its meaning.',
    pairs:[['Hamartia','A mistake or error of judgement'],['Peripeteia','A reversal of fortune'],['Catharsis','A purging of pity and fear'],['Hubris','Excessive pride that offends the gods']],
    hint:'Catharsis is what happens to the audience.',
    exp:'<p>Aristotle’s <em>Poetics</em> describes the tragic hero falling through <b>hamartia</b>, with <b>peripeteia</b> and recognition, producing <b>catharsis</b> in the audience. <b>Hubris</b> is a key idea in the plays themselves.</p>'},
  {lv:3,q:'Which is the best description of Creon’s hamartia in <em>Antigone</em>?',
    a:'His stubborn refusal to bury Polynices or to listen until too late',
    w:['His decision to bury Polynices himself, against the wishes of the city elders','His secret love for Antigone, which he hides from his son Haemon','His cowardice in the battle against the Argive army outside Thebes'],
    hint:'He changes his mind, but too late.',
    exp:'<p>Creon puts the state’s decree above divine law and refuses advice. His <b>peripeteia</b> (losing his son and his wife) and his late recognition make him a strong candidate for the tragic hero.</p>'},
  {lv:4,q:'Why is Agamemnon’s walk on the crimson tapestries a key example of hubris?',
    a:'Treading on cloths fit for gods is arrogance he fears, and it leads to his death',
    w:['He refuses to enter the palace at all, which insults the gods of his household','He insults Cassandra in front of the chorus and orders her to be beaten','He forgets to thank the gods for his victory at Troy before entering'],
    hint:'He says that such honours belong to the gods.',
    exp:'<p>Clytemnestra persuades Agamemnon to do what he knows is <b>god-like excess</b>. The red cloth suggests <b>blood</b>, and the scene is rich in <b>dramatic irony</b>, as he walks to his own murder.</p>'},
  {lv:5,q:'“Medea fits Aristotle’s idea of the tragic hero.” Which is the strongest counter-argument?',
    a:'She knowingly plans murder and escapes in triumph; Jason suffers the reversal',
    w:[['She is a woman, so she cannot be a tragic hero in Aristotle’s sense at all','Female figures such as Antigone are central tragic figures.'],['She dies at the end of the play, killed by the people of Corinth','She escapes alive.'],'She has no reason to be angry, so the audience cannot feel pity for her'],
    hint:'Who falls from good fortune to bad?',
    exp:'<p>Medea acts with full knowledge (“I know the evil I am about to do”) and ends <b>victorious</b>, a challenge to Aristotle’s model. <b>Jason</b> undergoes the reversal. Strong answers discuss her suffering and divided emotions too.</p>'},
],
agamemnon:[
  {lv:1,q:'In <em>Agamemnon</em>, who kills Agamemnon?',a:'Clytemnestra, his wife',
    w:['Orestes, his son','Aegisthus alone, in battle','Cassandra'],
    hint:'She has been waiting ten years for his return.',
    exp:'<p><b>Clytemnestra</b> kills Agamemnon in his bath, trapping him in a robe like a net, to avenge their daughter <b>Iphigenia</b>. Her lover <b>Aegisthus</b> claims revenge for his father Thyestes.</p>'},
  {lv:2,q:'How does <em>Agamemnon</em> open?',
    a:'A watchman on the roof waits for the beacon signal of Troy’s fall',
    w:['Agamemnon’s ship sails into the harbour with Cassandra on board','The chorus sing a long hymn about the death of Achilles at Troy','Cassandra prophesies on the palace steps in front of the elders'],
    hint:'He has waited a whole year for a light.',
    exp:'<p>The <b>Watchman</b> sees the <b>beacon</b> but hints that the house has dark secrets. The play opens with tension and foreboding.</p>'},
  {lv:2,q:'Why did Agamemnon sacrifice his daughter Iphigenia at Aulis?',
    a:'Artemis held back the fleet with winds, and her death let it sail',
    w:['Clytemnestra demanded the sacrifice as the price of her support for the war','She had secretly betrayed the Greek plans to the Trojans and Paris','An oracle warned that she would marry Paris and start a second war'],
    hint:'The chorus tell the story in the parodos.',
    exp:'<p>The chorus describe the <b>sacrifice of Iphigenia</b> with great pathos. It is the root of Clytemnestra’s revenge, and it raises the question of whether Agamemnon is a guilty victim.</p>'},
  {lv:3,q:'What makes Cassandra’s scene in <em>Agamemnon</em> so powerful?',
    a:'Cursed never to be believed, she foresees both deaths, but no one understands',
    w:['She kills Clytemnestra with an axe before the queen can strike the king','She persuades Agamemnon not to enter the palace, and the murder is avoided','She tells jokes to lighten the mood before the terrible ending of the play'],
    hint:'She sees the truth, but no one acts on it.',
    exp:'<p>Cassandra’s visions of the house’s past (Thyestes’ children) and future create intense <b>dramatic irony</b>. She enters the palace knowing she will die, a striking moment of courage.</p>'},
  {lv:3,q:'In the “Hymn to Zeus” the chorus sing that Zeus has set down a law for humans. What is it?',a:'That we learn wisdom through suffering',
    w:['That the strong should always rule the weak','That kings should never go to war','That the gods do not care about humans'],
    hint:'In Greek: pathei mathos.',
    exp:'<p><b>“Learning through suffering”</b> is a key theme of the <em>Oresteia</em>. The cycle of revenge brings pain until justice is reformed in the <em>Eumenides</em>.</p>'},
  {lv:5,q:'Which is the best description of justice in <em>Agamemnon</em>?',
    a:'A cycle of revenge, each killing “justified” by an earlier crime',
    w:['A fair trial in a law court that ends all the bloodshed for good','The gods punish only the guilty, quickly and in a way all can see','Justice does not appear as a theme in the play at all'],
    hint:'The trial comes later in the trilogy.',
    exp:'<p>In <em>Agamemnon</em> justice means <b>retaliation</b>: Clytemnestra and Aegisthus each claim right. The trilogy resolves this only in the <em>Eumenides</em>, with the court of the Areopagus.</p>'},
],
antigone:[
  {lv:1,q:'Why does Antigone defy Creon?',a:'To bury her brother, as the gods require',
    w:['To make Haemon king of Thebes','To avenge her father Oedipus','To escape her marriage to Haemon'],
    hint:'Creon has decreed that the body be left unburied.',
    exp:'<p>Creon forbids the burial of <b>Polynices</b>, who attacked Thebes. Antigone puts <b>divine law and family duty</b> above the state’s decree, which is the central conflict of the play.</p>'},
  {lv:2,q:'Who is Haemon?',a:'Creon’s son, engaged to Antigone',
    w:['Antigone’s brother','The blind prophet','A guard who catches Antigone'],
    hint:'He argues with his father about listening to the city.',
    exp:'<p><b>Haemon</b> warns Creon that the city sympathises with Antigone. Their quarrel shows Creon’s <b>tyrannical</b> attitude. Haemon later kills himself beside Antigone’s body.</p>'},
  {lv:3,q:'What is Ismene’s dramatic role?',
    a:'She is Antigone’s cautious foil, who later wants to share the blame',
    w:['She is Creon’s spy, sent to report on Antigone’s plans and movements','She buries Polynices herself at night, while Antigone is being watched','She is the messenger who reports Haemon’s death to his mother'],
    hint:'A foil highlights another character by contrast.',
    exp:'<p>Ismene’s caution (women should not fight men or the state) makes Antigone’s defiance stand out. Her later wish to die with her sister adds pathos.</p>'},
  {lv:3,q:'What warning does Teiresias give Creon?',
    a:'The gods are angry at the unburied body, and Creon must change course',
    w:['That Thebes is about to be invaded again by the army of Argos','That Antigone is plotting with the elders to kill Creon and seize power','That Haemon plans to rebel against his father and take the throne'],
    hint:'Creon first accuses him of taking bribes.',
    exp:'<p><b>Teiresias</b> reports bad omens and predicts that Creon will pay with a child’s life. Creon finally gives way, but <b>too late</b>, a classic tragic reversal.</p>'},
  {lv:4,q:'Read the source. Why is this choral ode ironic in its context?',
    src:'Many things are wonderful, but nothing is more wonderful than man. He crosses the stormy sea, ploughs the earth, tames wild animals and has taught himself speech and the laws of cities. Only death he cannot escape. When he honours the laws of the land and the justice of the gods, his city stands high; but he who dares to do wrong has no city.',cite:'Sophocles, <em>Antigone</em>, first stasimon (paraphrased)',
    a:'It praises human skill but warns that cleverness without justice ruins',
    w:['It is a simple hymn of praise for humanity, with no wider meaning in the play','It describes the gods and their power, not human beings at all','It is sung by Antigone herself as she is led away to her tomb'],
    hint:'Who in the play “honours the laws of the land” but ignores the gods?',
    exp:'<p>The “<b>Ode to Man</b>” celebrates human skill, then adds a warning. Read in context, it judges <b>Creon’s</b> state-first stance and Antigone’s defiance of the state, a good example of ambiguity in the chorus.</p>'},
  {lv:5,q:'“Creon, not Antigone, is the tragic hero of the play.” Which evidence best supports this view?',
    a:'Creon suffers reversal and recognition; Antigone dies mid-play',
    w:[['Antigone defies Creon openly, risking death for her principles','This is about Antigone’s heroism, not Creon’s.'],['The play is named after Antigone, not after Creon','The title favours Antigone.'],'Creon is the king of Thebes and has the most lines'],
    hint:'Think about Aristotle’s elements.',
    exp:'<p>Creon’s <b>peripeteia</b> and <b>anagnorisis</b> fit Aristotle’s model. A balanced answer argues for Antigone too: her principled choice, her suffering and the title.</p>'},
],
medea:[
  {lv:1,q:'Why is Medea furious at the start of the play?',a:'Jason has left her to marry the Corinthian king’s daughter',
    w:['Jason has been killed in battle, leaving her alone in a foreign city','She has been exiled from Colchis by her father for helping Jason','Her children have been kidnapped by the king of Corinth'],
    hint:'The Nurse explains in the prologue.',
    exp:'<p>Jason’s new marriage leaves Medea, a <b>foreigner</b> with no family to protect her, betrayed and in danger. The Nurse already fears what she will do to the children.</p>'},
  {lv:2,q:'Who offers Medea refuge in his city?',a:'Aegeus, king of Athens',

    hint:'He is childless and has come from an oracle.',
    exp:'<p><b>Aegeus</b>, longing for children, swears to protect Medea in Athens. The scene secures her escape route, and it may give her the idea of hurting Jason through his children.</p>'},
  {lv:2,kind:'order',q:'Put these events of <em>Medea</em> in order.',
    items:['The Nurse fears for the children in the prologue','Creon orders Medea’s exile but grants her one day','Aegeus promises Medea refuge in Athens','Medea sends the poisoned robe and crown with her sons','Medea escapes in the chariot of the Sun'],
    hint:'The exile order, then the refuge, then the gifts.',

<script>/* js/core/engine.js */
/* Game engine: home menu, course set-up, room planner, gameplay.
   Loaded last, after util, diagrams, scenes, registry and every course file. */
(()=>{
const $=s=>document.querySelector(s);
const {ri,shuffle,TOL,esc}=ER.util;
const {THEMES}=ER.scenes;
const PRODUCT=ER.product||{name:'The Revision Escape',brand:'THE REVISION ESCAPE',tagline:'Escape-room revision'};
const W=Object.assign({problem:'problem',problems:'problems',again:'Play again',ranks:['Master Escapologist','Escape Artist','Hard-won Escape']},PRODUCT.words||{});
const NROOMS=5;
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- planner: turns the student's choices into five rooms of five generators ---------- */
const course=()=>ER.courseById[S.cfg.course];
const genOf=ref=>{const [c,k,id]=ref.split('/');return ER.component(c,k).gens[id]};
const refOf=g=>`${g.course}/${g.component}/${g.id}`;
const levelDist=(g,L)=>{const [lo,hi]=Array.isArray(g.level)?g.level:[g.level,g.level];return L<lo?lo-L:L>hi?L-hi:0};
function comps(cfg){const c=ER.courseById[cfg.course];return c.components.filter(k=>cfg.comps.includes(k.id))}
function topicPool(cfg){return comps(cfg).flatMap(k=>Object.values(k.gens).filter(g=>(cfg.topics[k.id]||[]).includes(g.topic)))}
function defaultCfg(c){const saved=store.get('er.cfg.'+c.id);
  const cfg={course:c.id,comps:(c.defaultComps||[c.components[0].id]).slice(),mode:'full',topics:Object.fromEntries(c.components.map(k=>[k.id,k.topics.map(t=>t.id)]))};
  if(saved&&saved.course===c.id){const ok=saved.comps&&saved.comps.filter(id=>c.components.some(k=>k.id===id));if(ok&&ok.length)cfg.comps=ok;
    if(saved.mode==='topics')cfg.mode='topics';if(saved.topics)for(const k of c.components)if(Array.isArray(saved.topics[k.id]))cfg.topics[k.id]=saved.topics[k.id].filter(t=>k.topicById[t])}
  return cfg}
/* Greedy pick for one room. For generated questions level fit matters most, so a narrow topic
   choice repeats a generator (with new numbers) rather than dropping a Level 5 question into Room 1.
   A fixed question (g.fixed, from a written bank) would repeat word for word, so it is only
   reused when the pool has run out, and a nearby level is used instead. */
function pickRoom(pool,L,used){const chosen=[],tUsed=new Set();
  for(let s=0;s<5;s++){let best=null,bs=Infinity;
    for(const g of pool){const key=refOf(g),tk=g.component+'/'+g.topic;
      const sc=(used.get(key)||0)*(g.fixed?40:2)+levelDist(g,L)*4+chosen.filter(x=>x===g).length*(g.fixed?100:9)+(tUsed.has(tk)?3:0)+chosen.filter(x=>x.component===g.component).length*0.6+Math.random()*1.5;
      if(sc<bs){bs=sc;best=g}}
    chosen.push(best);tUsed.add(best.component+'/'+best.topic);used.set(refOf(best),(used.get(refOf(best))||0)+1)}
  return chosen}
/* Full syllabus draws from every question type in the chosen papers; Choose topics from the
   selected topics only. Either way each room is filled by level, spreading topics and papers. */
function buildPlan(cfg){const c=ER.courseById[cfg.course],ks=comps(cfg);
  const lv=i=>(ks.length===1&&ks[0].levels&&ks[0].levels[i])||(c.levels&&c.levels[i])||{band:'Level '+(i+1),mins:9};
  const pool=cfg.mode==='full'?ks.flatMap(k=>Object.values(k.gens)):topicPool(cfg);
  if(!pool.length)return [];
  const used=new Map();
  return [...Array(NROOMS)].map((_,i)=>({level:i+1,band:lv(i).band,mins:lv(i).mins,gens:pickRoom(pool,i+1,used).map(refOf)}))}

/* ---------- state ---------- */
let S=null;
function makeRoom(P){return{qs:P.gens.map(ref=>{const g=genOf(ref);const q=g.fn(P.level);q.topic=g.label;return q}),code:[0,1,2,3,4].map(()=>ri(0,9)),slots:shuffle([0,1,2,3,4]),
  solved:[0,0,0,0,0].map(()=>false),revealed:[0,0,0,0,0].map(()=>false),att:[0,0,0,0,0],hint:[0,0,0,0,0].map(()=>false),first:[0,0,0,0,0].map(()=>false),time:0,done:false}}
/* each game draws five different room themes at random from everything registered */
function newGame(cfg,free){const snd=S?S.sound:true;const c=ER.courseById[cfg.course];const plan=buildPlan(cfg);
  const picks=shuffle(THEMES.map((_,i)=>i)).slice(0,NROOMS);plan.forEach((P,i)=>{P.theme=picks[i]});
  S={phase:'title',cfg,free:!!free,room:0,plan,rooms:null,timeLeft:c.timeLimit,running:false,paused:false,doorOpen:false,sound:snd}}
function ensureRooms(){if(!S.rooms)S.rooms=S.plan.map(makeRoom)}
function home(){const snd=S?S.sound:true;S={phase:'home',cfg:null,sound:snd}}
const room=()=>S.rooms[S.room];
const theme=i=>THEMES[S.plan[i].theme];
const inGame=()=>S.rooms&&['intro','room','done'].includes(S.phase);

/* ---------- sound ---------- */
let ac=null;
function beep(freqs,dur=.13,type='sine',gap=.09,vol=.13){if(!S.sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();freqs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;const t=ac.currentTime+i*gap;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.03)})}catch(e){}}
const sGood=()=>beep([523,659,784,1047],.16);
const sBad=()=>beep([196,147],.18,'square',.12,.06);
const sKey=()=>beep([880],.05,'square',0,.04);
const sOpen=()=>beep([392,523,659,784,1047,1319],.25,'triangle',.11);

/* ---------- scenes ---------- */
const sceneSVG=()=>{const r=room();return ER.scenes.svg(S.plan[S.room].theme,{solved:r.solved,code:r.code,slots:r.slots,objects:theme(S.room).objects,doorOpen:S.doorOpen})};

/* ---------- UI ---------- */
const fmtT=s=>{const a=Math.abs(s);return `${String(Math.floor(a/60)).padStart(2,'0')}:${String(a%60).padStart(2,'0')}`};
const fmtShort=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const miniDoor=c=>`<svg viewBox="0 0 60 80" class="md" aria-hidden="true"><rect x="4" y="2" width="52" height="13" rx="2" fill="#0a0906"/>${[0,1,2,3,4].map(k=>`<rect x="${8.5+k*9.2}" y="5.5" width="6.5" height="6" fill="${c}" opacity=".85"/>`).join('')}<rect x="10" y="19" width="40" height="59" fill="${c}" fill-opacity=".18" stroke="${c}" stroke-width="2"/><circle cx="43" cy="50" r="2.6" fill="${c}"/></svg>`;
function setAccent(){document.documentElement.style.setProperty('--accent',['home','title','end'].includes(S.phase)?(PRODUCT.accent||'#e2a84b'):theme(S.room).accent)}
let toastT=null;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3600)}
const mins=()=>Math.round(course().timeLimit/60);

function renderBar(){const inRoom=['intro','room','done'].includes(S.phase),c=S.cfg&&course();
  $('#brand').textContent=c?c.brand:PRODUCT.brand;
  $('#roomTag').innerHTML=S.phase==='home'?PRODUCT.tagline:inRoom?`Room <b>${S.room+1}</b> of 5 · ${theme(S.room).name}`:S.phase==='end'?'Escaped':`${c.board} ${c.name} revision`;
  const playing=S.phase==='room';const n=playing?room().solved.filter(Boolean).length:0;
  $('#digitPill').hidden=!playing;$('#digitPill').innerHTML=`Digits <b>${n}</b>/5`;
  $('#timer').hidden=S.phase==='home';$('#menuBtn').hidden=S.phase==='home';$('#menuBtn').textContent=S.phase==='title'?'All courses':'Menu';
  $('#pauseBtn').hidden=!playing;$('#pauseBtn').textContent=S.paused?'Resume':'Pause';$('#muteBtn').textContent=S.sound?'Sound on':'Sound off';if(S.phase!=='home')renderTimer()}
function renderTimer(){const t=$('#timer');t.textContent=(S.timeLeft<0?'+':'')+fmtT(S.timeLeft);t.classList.toggle('over',S.timeLeft<0);t.title=S.timeLeft<0?`Over the ${mins()} minutes`:'Time remaining'}

function renderHome(){const subjects=[...new Set(ER.courses.map(c=>c.subject))];
  $('#s-home').innerHTML=`<div class="hero"><div><h1>${PRODUCT.hero||PRODUCT.name}</h1><p class="lede">${PRODUCT.lede||`Five locked rooms and twenty-five ${W.problems}. Every ${W.problem} you solve lights one digit of the exit code.`}</p></div></div>
  ${subjects.map(sub=>`<div class="sectlabel">${sub}</div><div class="courses">${ER.courses.filter(c=>c.subject===sub).map(c=>`<button class="cc" data-course="${c.id}"><span class="cb">${c.board}</span><span class="cn">${c.name}</span><span class="cd">${c.code}</span><span class="cp">${c.components.map(k=>k.name).join(' · ')}</span><span class="go">Choose →</span></button>`).join('')}</div>`).join('')}
  <div class="sectlabel">How to escape</div>${howHTML()}`}
const howHTML=()=>`<div class="how"><div><b>1 · Search</b><p>${PRODUCT.howSearch||`Glowing objects in each room hide a ${W.problem}. Click one, or use the buttons under the room.`}</p></div><div><b>2 · Solve</b><p>A correct answer lights a digit and tells you its slot on the door's keypad. Hints are there if you're stuck.</p></div><div><b>3 · Unlock</b><p>With all five digits lit, click the exit door and punch in the code to move to the next room.</p></div></div>`;

function renderTitle(){const c=course(),cfg=S.cfg,multi=c.components.length>1;
  const plate=c.codeplate.split('').map(ch=>ch==='-'?'<span class="dim">–</span>':`<span>${ch}</span>`).join('');
  const ks=comps(cfg);
  const topicsHTML=cfg.mode!=='topics'?'':`<div class="topics">${ks.map(k=>{const counts={};Object.values(k.gens).forEach(g=>counts[g.topic]=(counts[g.topic]||0)+1);const sel=cfg.topics[k.id]||[];
    return `<fieldset class="tg"><legend>${esc(k.name)}</legend><div class="tgacts"><button type="button" class="lnk" data-all="${k.id}">Select all</button><button type="button" class="lnk" data-none="${k.id}">Clear</button></div>${k.topics.map(t=>`<label class="chk${counts[t.id]?'':' off'}"><input type="checkbox" data-topic="${k.id}/${t.id}"${sel.includes(t.id)?' checked':''}${counts[t.id]?'':' disabled'}> ${esc(t.name)} <span class="muted">(${counts[t.id]||0})</span></label>`).join('')}</fieldset>`}).join('')}</div>`;
  const pool=cfg.mode==='topics'?topicPool(cfg):null;
  const warn=pool&&pool.length===0?'<p class="warnline">Pick at least one topic to build the rooms.</p>':pool&&pool.length<25?`<p class="warnline">Only ${pool.length} question${pool.length===1?'':'s'} cover${pool.length===1?'s':''} these topics, and a game has 25, so some will come up more than once. Tick more topics for more variety.</p>`:'';

    return `<${tag} class="rc${S.free?' pick':''}" style="--c:${T.accent}" ${S.free?`data-room="${i}"`:''}><span class="lvl">L${P.level}</span>${miniDoor(T.accent)}<span class="nm">${T.name}</span><span class="band">${P.band} · about ${P.mins} min</span><ul>${tops.map(t=>`<li>${t}</li>`).join('')}</ul>${S.free?`<span class="go">Play this room →</span>`:''}</${tag}>`}).join(''):''}</div>
  <div class="sectlabel">How to escape</div>${howHTML()}
  <p class="tip">${c.tip}</p>
  <div class="startrow"><button class="btn primary" id="startBtn"${pool&&!pool.length?' disabled':''}>Begin in Room 1</button><label class="chk"><input type="checkbox" id="freeChk"${S.free?' checked':''}> Free play: choose any room</label><button class="btn" id="reshuffleBtn">Reshuffle rooms</button></div>`}
function renderIntro(){const P=S.plan[S.room],T=theme(S.room);const tops=room().qs.map(q=>q.topic);
  $('#s-intro').innerHTML=`<div class="splash"><div><div class="kicker">Level ${P.level} of 5 · ${P.band}</div><h2>${T.name}</h2><p>${T.blurb}${S.room===4?' This is the last door between you and freedom.':''}</p><div class="chips">${tops.map(t=>`<span class="chip">${t}</span>`).join('')}</div><p class="muted">Five ${W.problems}. Suggested time: about ${P.mins} minutes. The clock is paused until you go in.</p><div class="acts"><button class="btn primary" id="enterBtn">Enter ${T.name.replace('The ','the ')}</button></div></div><div class="preview">${sceneSVG()}</div></div>`}
function renderRoom(){$('#scene').innerHTML=sceneSVG();$('#pauseCover').hidden=!S.paused;renderClues()}
function renderClues(){const r=room(),T=theme(S.room),n=r.solved.filter(Boolean).length;
  $('#clues').innerHTML=r.qs.map((q,i)=>`<button class="clue${r.solved[i]?' done':''}" data-i="${i}"><span class="cn">${T.objects[i]}</span><span class="ct">${q.topic}</span><span class="cs">${r.solved[i]?`Slot ${r.slots[i]+1} = <b>${r.code[r.slots[i]]}</b>${r.revealed[i]?' · revealed':''}`:'Unsolved'}</span></button>`).join('')
   +`<button class="clue doorb${n===5?' ready':''}" id="doorBtn"><span class="cn">Exit door</span><span class="ct">${n===5?'All digits lit. Enter the code.':'Keypad needs all five digits.'}</span><span class="cs">${r.code.map((d,s)=>r.solved[r.slots.indexOf(s)]?`<b>${d}</b>`:'<b style="color:#4a3a1c">–</b>').join(' ')}</span></button>`}
function roomStats(r){return{first:r.first.filter(Boolean).length,hints:r.hint.filter(Boolean).length,rev:r.revealed.filter(Boolean).length}}
function renderDone(){const P=S.plan[S.room],T=theme(S.room),r=room(),st=roomStats(r),last=S.room===4;
  $('#s-done').innerHTML=`<div class="splash"><div><div class="kicker">Room ${S.room+1} escaped</div><h2>Out of ${T.name.replace('The ','the ')}</h2><p>${last?'That was the final door. Time to see how you did.':`The door swings open onto the next room: ${theme(S.room+1).name}. Level ${S.room+2} is harder.`}</p>
  <div class="statgrid"><div><small>Time in room</small><b>${fmtShort(r.time)}</b><span> / ~${P.mins}:00</span></div><div><small>First try</small><b>${st.first}</b><span> / 5</span></div><div><small>Hints</small><b>${st.hints}</b></div><div><small>Revealed</small><b>${st.rev}</b></div></div>
  <div class="acts"><button class="btn primary" id="nextBtn">${last?'See your results':`Go to Room ${S.room+2}`}</button></div></div><div class="preview">${sceneSVG()}</div></div>`}
function renderEnd(){const c=course(),limit=c.timeLimit;const played=S.rooms.map((r,i)=>({r,i})).filter(o=>o.r.done);const used=limit-S.timeLeft;
  const tot=played.reduce((a,{r})=>{const s=roomStats(r);a.first+=s.first;a.hints+=s.hints;a.rev+=s.rev;a.q+=5;return a},{first:0,hints:0,rev:0,q:0});
  const rank=used<=limit&&tot.rev===0?W.ranks[0]:used<=limit?W.ranks[1]:W.ranks[2];
  const allFive=played.length===5;
  $('#s-end').innerHTML=`<div class="hero"><div><div class="sectlabel" style="margin-top:0">${allFive?'All five rooms escaped':'Game over'}</div><h1>${rank}</h1><p class="lede">${allFive?`You broke out of all five rooms in ${fmtShort(used)}${used<=limit?`, inside the ${mins()} minutes`:''}.`:`You escaped ${played.length} room${played.length===1?'':'s'} in ${fmtShort(used)}.`} ${tot.first} of ${tot.q} ${W.problems} were right first time.</p></div><div class="codeplate" aria-hidden="true">${'ESCPD'.split('').map(ch=>`<span>${ch}</span>`).join('')}</div></div>
  <div class="statgrid"><div><small>Total time</small><b>${fmtShort(used)}</b><span> / ${fmtT(limit)}</span></div><div><small>First try</small><b>${tot.first}</b><span> / ${tot.q}</span></div><div><small>Hints used</small><b>${tot.hints}</b></div><div><small>Solutions revealed</small><b>${tot.rev}</b></div></div>
  <div class="sectlabel">Room by room</div><div class="tw"><table class="endtable"><tr><th>Room</th><th>Level</th><th>Time</th><th>First try</th><th>Hints</th><th>Revealed</th></tr>${played.map(({r,i})=>{const s=roomStats(r);return `<tr><td>${theme(i).name}</td><td>${S.plan[i].level}</td><td class="n">${fmtShort(r.time)}</td><td class="n">${s.first}/5</td><td class="n">${s.hints}</td><td class="n">${s.rev}</td></tr>`}).join('')}</table></div>
  ${reviewList(played)}
  <div class="startrow"><button class="btn primary" id="againBtn">${W.again}</button><button class="btn" id="mapBtn">Back to the course page</button></div>`}
function reviewList(played){const items=[];played.forEach(({r,i})=>r.qs.forEach((q,k)=>{if(!r.first[k])items.push(`<li><b>${q.topic}</b> <span class="muted">(${theme(i).name}, ${theme(i).objects[k]})</span></li>`)}));
  return items.length?`<div class="sectlabel">Topics worth revising</div><ul style="margin:0;padding-left:20px;line-height:1.8">${items.join('')}</ul>`:`<div class="sectlabel">Topics worth revising</div><p class="muted" style="margin:0">None. Every ${W.problem} was right first time.</p>`}

const PHASES=['home','title','intro','room','done','end'];
function render(){setAccent();
  PHASES.forEach(p=>{$('#s-'+p).hidden=S.phase!==p});
  for(const p of ['home','title','intro','done','end'])if(S.phase!==p)$('#s-'+p).innerHTML='';
  if(S.phase!=='room'){$('#scene').innerHTML='';$('#clues').innerHTML=''}
  ({home:renderHome,title:renderTitle,intro:renderIntro,room:renderRoom,done:renderDone,end:renderEnd})[S.phase]();
  renderBar()}
const go=()=>{render();window.scrollTo(0,0)};

/* ---------- course set-up actions ---------- */
function openCourse(id){const c=ER.courseById[id];if(!c)return;newGame(defaultCfg(c),false);go()}
function updateCfg(fn){fn(S.cfg);store.set('er.cfg.'+S.cfg.course,S.cfg);const free=S.free;newGame(S.cfg,free);const y=window.scrollY;render();window.scrollTo(0,y)}

/* ---------- modal & answers ---------- */
let modalMode=null,openI=-1,kp='',lastFocus=null,leaveThen=null;
function showModal(html,mode){lastFocus=document.activeElement;modalMode=mode;$('#card').innerHTML=html;$('#modal').hidden=false;const f=$('#card').querySelector('input,select,.primary,.key');if(f)setTimeout(()=>f.focus(),30)}
function closeModal(){$('#modal').hidden=true;modalMode=null;openI=-1;if(lastFocus&&document.body.contains(lastFocus))lastFocus.focus()}
function parseAns(s){s=String(s).replace(/[−–—]/g,'-').replace(/[\s,]/g,'').replace(/[^0-9.\-\/]/g,'');if(!s||s==='-')return null;
  if(s.includes('/')){const [a,b]=s.split('/');const x=Number(a),y=Number(b);if(!a||!b||isNaN(x)||isNaN(y)||y===0)return null;return x/y}const v=Number(s);return isNaN(v)?null:v}
const close=(v,a,acc)=>Math.abs(v-a)<=TOL[acc](a);
const perms=a=>a.length<2?[a]:a.flatMap((x,i)=>perms([...a.slice(0,i),...a.slice(i+1)]).map(p=>[x,...p]));
/* unordered: the answers may be typed in any order (all fields share fields[0].acc) */
function matches(q,vals,target){if(q.unordered){const a=q.fields[0].acc;return perms(target.map((_,k)=>k)).some(p=>p.every((t,k)=>close(vals[k],target[t],a)))}return q.fields.every((f,k)=>close(vals[k],target[k],f.acc))}
function successHTML(i){const r=room(),q=r.qs[i],d=r.code[r.slots[i]];
  return `<div class="success${r.revealed[i]?' rev':''}"><div class="digitbig">${d}</div><div><b>${r.revealed[i]?'Solution revealed.':'Correct!'}</b> Digit ${r.slots[i]+1} of the exit code is <b>${d}</b>.<br><span class="muted">Answer: ${q.answer}</span></div></div><div class="sol"><div class="lbl">${PRODUCT.solLabel||'Worked method'}</div>${q.sol}</div><div class="acts"><button class="btn primary" data-close>${PRODUCT.backLabel||'Back to the room'}</button></div>`}
const fieldHTML=(f,k)=>f.radio
  ?`<fieldset class="fld opts"><legend>${f.label}</legend>${f.choices.map((c,j)=>`<label class="opt"><input type="radio" name="f${k}" value="${j}"><span>${c}</span></label>`).join('')}</fieldset>`
  :`<div class="fld"><label for="f${k}">${f.label}</label><div class="in">${f.pre?`<span>${f.pre}</span>`:''}${f.choices?`<select id="f${k}"><option value="">Choose…</option>${f.choices.map((c,j)=>`<option value="${j}">${c}</option>`).join('')}</select>`:`<input id="f${k}" type="text" inputmode="numeric" spellcheck="false" autocapitalize="off">`}${f.post?`<span>${f.post}</span>`:''}</div></div>`;
const noteOf=q=>q.note!==undefined?q.note:q.fields.some(f=>!f.choices)?'Use - for negatives. Fractions like 3/8 are fine.':'';
const REVEAL=PRODUCT.revealLabel||'Show worked solution';
function qHTML(i){const r=room(),q=r.qs[i],T=theme(S.room),P=S.plan[S.room],note=noteOf(q);
  return `<div class="mh"><span class="chip">${q.topic}</span><span class="lv">Level ${P.level}</span><button class="btn" data-close>Close</button></div><h2 class="mt" id="mTitle">${T.objects[i]}</h2><div class="qbody">${q.html}</div>${q.diagram?`<div class="dgw">${q.diagram}</div>`:''}
  <div id="qzone">${r.solved[i]?successHTML(i):`<form id="af" class="af" autocomplete="off" novalidate><div class="fields${q.wide?' wide':''}">${q.fields.map(fieldHTML).join('')}</div>
  ${note?`<p class="small">${note}</p>`:''}<div class="acts"><button class="btn primary" type="submit">Check answer</button><button class="btn" type="button" id="hintBtn"${r.hint[i]?' disabled':''}>${r.hint[i]?'Hint shown':'Show a hint'}</button>${r.att[i]>=2?`<button class="btn warn" type="button" id="revBtn">${REVEAL}</button>`:''}</div>
  <p class="fb" id="fb" aria-live="polite"></p>${r.hint[i]?`<div class="hintbox"><b>Hint.</b> ${q.hint}</div>`:''}</form>`}</div>`}
function openQ(i){if(S.paused)return;openI=i;beep([660],.05,'sine',0,.05);showModal(qHTML(i),'q')}
function markSolved(i,revealed){const r=room();r.solved[i]=true;r.revealed[i]=!!revealed;if(!revealed&&r.att[i]===0)r.first[i]=true;
  $('#qzone').innerHTML=successHTML(i);$('#qzone').querySelector('.primary').focus();renderRoom();renderBar();
  if(r.solved.every(Boolean))setTimeout(()=>toast('All five digits are lit. Click the exit door and enter the code.'),400)}
function submitQ(){const i=openI,r=room(),q=r.qs[i];const vals=q.fields.map((f,k)=>{const v=f.radio?($(`input[name="f${k}"]:checked`)||{value:''}).value:$('#f'+k).value;return f.choices?(v===''?null:Number(v)):parseAns(v)});const fb=$('#fb');
  if(vals.some(v=>v===null)){fb.className='fb bad';fb.textContent=q.fields.some(f=>f.radio)?'Pick one of the answers first.':q.fields.some(f=>f.choices)?'Make a choice in every list.':'Enter a number in every box.';return}
  if(matches(q,vals,q.fields.map(f=>f.ans))){sGood();markSolved(i,false);return}
  r.att[i]++;sBad();const card=$('#card');card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');
  let msg=null;for(const m of q.mistakes||[]){if(m.vals){if(m.vals.every(v=>isFinite(v))&&matches(q,vals,m.vals)){msg=m.msg;break}}else{const k=m.field||0;if(isFinite(m.val)&&close(vals[k],m.val,q.fields[k].acc)){msg=m.msg;break}}}
  if(!msg&&q.fields.length>1&&!q.unordered){const ok=q.fields.map((f,k)=>close(vals[k],f.ans,f.acc));
    if(ok.length===2){if(ok[0]&&!ok[1])msg='Your first answer is right. Check the second one.';else if(ok[1]&&!ok[0])msg='Your second answer is right. Check the first one.'}
    else{const n=ok.filter(Boolean).length;msg=n===ok.length-1?`Only one needs another look: “${q.fields[ok.indexOf(false)].label}”.`:n?`${n} of ${ok.length} are right so far. Keep going.`:null}}
  if(!msg&&q.unordered){const a=q.fields[0].acc;const hit=vals.some(v=>q.fields.some(f=>close(v,f.ans,a)));if(hit)msg='One of your solutions is right. Check the other one.'}
  if(!msg&&q.fields.some(f=>f.acc!=='exact')){const near=q.fields.every((f,k)=>Math.abs(vals[k]-f.ans)<=Math.max(Math.abs(f.ans)*.02,.06));if(near)msg='Very close. Check your rounding and the accuracy the question asks for.'}
  if(!msg)msg=r.att[i]>=2?`Not right yet. Try the hint, or use “${REVEAL}”.`:'Not quite. Think again and have another go.';
  fb.className='fb bad';fb.textContent=msg;
  if(r.att[i]>=2&&!$('#revBtn')){const b=document.createElement('button');b.className='btn warn';b.type='button';b.id='revBtn';b.textContent=REVEAL;$('#af .acts').appendChild(b)}}
function showHint(){const i=openI,r=room();if(r.hint[i])return;r.hint[i]=true;const b=$('#hintBtn');b.disabled=true;b.textContent='Hint shown';const d=document.createElement('div');d.className='hintbox';d.innerHTML=`<b>Hint.</b> ${r.qs[i].hint}`;$('#af').appendChild(d)}

function kpHTML(){return `<div class="mh"><span class="chip">Exit keypad</span><button class="btn" data-close>Close</button></div><h2 class="mt" id="mTitle">Enter the code</h2><p class="muted" style="margin:0">Type the five digits in slot order, 1 to 5.</p><div class="kpd">${[0,1,2,3,4].map(k=>`<span>${kp[k]??''}</span>`).join('')}</div><div class="kp">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" data-k="${n}">${n}</button>`).join('')}<button class="key clr" data-k="C">Clear</button><button class="key" data-k="0">0</button><button class="key ent" data-k="E">Enter</button></div><p class="fb bad center" id="kfb" aria-live="polite"></p>`}
function openDoor(){if(S.paused||S.doorOpen)return;const r=room(),n=r.solved.filter(Boolean).length;
  if(n<5){sBad();toast(`The keypad is dead. ${n} of 5 digits found. Solve the glowing objects first.`);return}kp='';showModal(kpHTML(),'kp')}
function kpPress(k){if(k==='C'){kp='';sKey()}else if(k==='E'){tryCode();return}else if(/^\d$/.test(k)&&kp.length<5){kp+=k;sKey()}
  $('#card').querySelectorAll('.kpd span').forEach((s,j)=>s.textContent=kp[j]??'')}
function tryCode(){const r=room();if(kp.length<5){$('#kfb').textContent='The code has five digits.';return}
  if(kp===r.code.join('')){closeModal();S.doorOpen=true;r.done=true;S.running=false;sOpen();renderRoom();renderBar();setTimeout(()=>{S.phase='done';S.doorOpen=false;render();window.scrollTo(0,0)},1800)}
  else{sBad();kp='';$('#kfb').textContent='Wrong code. Read the digits in slot order: slot 1 first.';const card=$('#card');card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');$('#card').querySelectorAll('.kpd span').forEach(s=>s.textContent='')}}

/* ---------- events ---------- */
function bind(){
  $('#muteBtn').onclick=()=>{S.sound=!S.sound;renderBar();if(S.sound)sKey()};
  $('#pauseBtn').onclick=()=>{S.paused=!S.paused;$('#pauseCover').hidden=!S.paused;renderBar()};
  /* in-page confirmation: embedded viewers block window.confirm() */
  const leave=(then)=>{if(!(inGame()&&S.rooms.some(r=>r.solved.some(Boolean)))){closeModal();then();go();return}
    leaveThen=then;showModal(`<div class="mh"><span class="chip">Leave game</span><button class="btn" data-close>Close</button></div><h2 class="mt" id="mTitle">Leave this game?</h2><p>Your progress in this game will be lost.</p><div class="acts"><button class="btn primary" id="leaveYes">Leave game</button><button class="btn" data-close>Keep playing</button></div>`,'confirm')};
  $('#menuBtn').onclick=()=>{if(S.phase==='title'){home();go();return}leave(()=>newGame(S.cfg,S.free))};
  $('#brand').onclick=()=>{if(S.phase==='home')return;leave(home)};
  document.addEventListener('change',e=>{const t=e.target;
    if(t.id==='freeChk'){S.free=t.checked;const y=window.scrollY;render();window.scrollTo(0,y);return}
    if(t.dataset.topic){const [k,id]=t.dataset.topic.split('/');updateCfg(cfg=>{const s=new Set(cfg.topics[k]||[]);t.checked?s.add(id):s.delete(id);cfg.topics[k]=ER.component(cfg.course,k).topics.map(x=>x.id).filter(x=>s.has(x))})}});
  document.addEventListener('click',e=>{const t=e.target;
    const cc=t.closest('[data-course]');if(cc&&S.phase==='home'){openCourse(cc.dataset.course);return}
    if(S.phase==='title'){
      const cb=t.closest('[data-comp]');if(cb){const id=cb.dataset.comp;updateCfg(cfg=>{const on=cfg.comps.includes(id);if(on&&cfg.comps.length===1){toast(`Keep at least one ${course().compOne||'paper'} selected.`);return}cfg.comps=on?cfg.comps.filter(x=>x!==id):course().components.map(k=>k.id).filter(x=>x===id||cfg.comps.includes(x))});return}
      const mb=t.closest('[data-mode]');if(mb){updateCfg(cfg=>{cfg.mode=mb.dataset.mode});return}
      const all=t.closest('[data-all]');if(all){updateCfg(cfg=>{cfg.topics[all.dataset.all]=ER.component(cfg.course,all.dataset.all).topics.map(x=>x.id)});return}
      const none=t.closest('[data-none]');if(none){updateCfg(cfg=>{cfg.topics[none.dataset.none]=[]});return}
      if(t.closest('#reshuffleBtn')){updateCfg(()=>{});return}
      if(t.closest('#startBtn')){if(!S.plan.length)return;ensureRooms();S.phase='intro';S.room=0;go();return}
      const rb=t.closest('[data-room]');if(rb&&S.free&&S.plan.length){ensureRooms();S.room=+rb.dataset.room;S.phase='intro';go();return}
      return}
    if(t.closest('#enterBtn')){S.phase='room';S.running=true;S.paused=false;S.doorOpen=false;go();return}
    if(t.closest('#nextBtn')){if(S.room===4||S.rooms.slice(S.room+1).every(r=>r.done)){S.phase='end'}else{S.room++;S.phase='intro'}go();return}
    if(t.closest('#againBtn')){newGame(S.cfg,S.free);ensureRooms();S.phase='intro';go();return}
    if(t.closest('#mapBtn')){newGame(S.cfg,S.free);go();return}
    if(t.closest('#leaveYes')){const f=leaveThen;leaveThen=null;closeModal();if(f){f();go()}return}
    if(t.closest('[data-close]')){closeModal();return}
    if(t.id==='modal'){closeModal();return}
    if(t.closest('#hintBtn')){showHint();return}
    if(t.closest('#revBtn')){markSolved(openI,true);return}
    const key=t.closest('.key');if(key){kpPress(key.dataset.k);return}
    if(S.phase==='room'){const h=t.closest('#scene .hot')||t.closest('#clues .clue[data-i]');if(h){openQ(+h.dataset.i);return}if(t.closest('#scene #door')||t.closest('#doorBtn')){openDoor();return}}});
  document.addEventListener('submit',e=>{if(e.target.id==='af'){e.preventDefault();submitQ()}});
  document.addEventListener('keydown',e=>{
    if(!$('#modal').hidden){if(e.key==='Escape'){closeModal();return}if(modalMode==='kp'){if(/^\d$/.test(e.key)){kpPress(e.key);e.preventDefault()}else if(e.key==='Backspace'){kp=kp.slice(0,-1);kpPress('')}else if(e.key==='Enter'&&!e.target.closest('.key')){e.preventDefault();tryCode()}}return}
    if(S.phase==='room'&&(e.key==='Enter'||e.key===' ')){const h=e.target.closest&&e.target.closest('#scene .hot');if(h){e.preventDefault();openQ(+h.dataset.i)}else if(e.target.closest&&e.target.closest('#scene #door')){e.preventDefault();openDoor()}}});
}
